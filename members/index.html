<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D&S Members — Deuce & Smash</title>
<style>
  :root {
    --bg: #0d0d0d;
    --surface: #161616;
    --card: #1c1c1c;
    --border: #2a2a2a;
    --accent: #e8ff3b;
    --accent2: #3bffe8;
    --text: #f0f0f0;
    --muted: #888;
    --danger: #ff4d4d;
    --success: #4dff91;
    --warn: #ffb347;
    --pill-bg: #252525;
    --radius: 10px;
    --font: 'Segoe UI', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; }

  /* Header */
  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 20px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 100; }
  .header-logo { font-size: 1.3rem; font-weight: 800; letter-spacing: -0.5px; }
  .header-logo span { color: var(--accent); }
  .header-sub { font-size: 0.8rem; color: var(--muted); margin-left: auto; }
  .admin-badge { background: var(--accent); color: #000; font-size: 0.7rem; font-weight: 700; padding: 2px 8px; border-radius: 20px; letter-spacing: 0.5px; }

  /* PIN overlay */
  #pin-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 1000; display: flex; align-items: center; justify-content: center; }
  .pin-box { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 36px 32px; text-align: center; max-width: 320px; width: 100%; }
  .pin-box h2 { font-size: 1.4rem; margin-bottom: 6px; }
  .pin-box p { color: var(--muted); font-size: 0.9rem; margin-bottom: 24px; }
  .pin-input { width: 100%; padding: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 1.4rem; text-align: center; letter-spacing: 8px; outline: none; }
  .pin-input:focus { border-color: var(--accent); }
  .pin-btn { margin-top: 14px; width: 100%; padding: 14px; background: var(--accent); color: #000; border: none; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; }
  .pin-error { color: var(--danger); font-size: 0.85rem; margin-top: 10px; min-height: 20px; }

  /* Tabs */
  .tabs { display: flex; gap: 4px; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--border); overflow-x: auto; }
  .tab { padding: 8px 18px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; cursor: pointer; border: none; background: transparent; color: var(--muted); white-space: nowrap; transition: all 0.15s; }
  .tab.active { background: var(--accent); color: #000; }
  .tab:not(.active):hover { background: var(--pill-bg); color: var(--text); }

  /* Main sections */
  .section { display: none; padding: 16px; }
  .section.active { display: block; }

  /* Search bar */
  .search-row { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .search-input { flex: 1; min-width: 180px; padding: 11px 16px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 0.95rem; outline: none; }
  .search-input:focus { border-color: var(--accent); }
  .filter-select { padding: 10px 14px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 0.85rem; outline: none; cursor: pointer; }
  .btn { padding: 10px 18px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; border: none; cursor: pointer; transition: opacity 0.15s; }
  .btn:hover { opacity: 0.85; }
  .btn-primary { background: var(--accent); color: #000; }
  .btn-secondary { background: var(--pill-bg); color: var(--text); border: 1px solid var(--border); }
  .btn-danger { background: var(--danger); color: #fff; }

  /* Member grid */
  .member-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .member-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; cursor: pointer; transition: border-color 0.15s; }
  .member-card:hover { border-color: var(--accent); }
  .member-card-top { display: flex; align-items: flex-start; gap: 12px; }
  .member-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--border); display: flex; align-items: center; justify-content: center; font-size: 1.1rem; font-weight: 700; color: var(--accent); flex-shrink: 0; }
  .member-name { font-size: 1rem; font-weight: 700; }
  .member-meta { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
  .member-stats { display: flex; gap: 12px; margin-top: 12px; }
  .stat-pill { background: var(--pill-bg); border-radius: 6px; padding: 5px 10px; font-size: 0.75rem; }
  .stat-pill strong { color: var(--accent); }
  .rating-badge { margin-left: auto; text-align: right; }
  .rating-num { font-size: 1.5rem; font-weight: 800; color: var(--accent); line-height: 1; }
  .rating-band { font-size: 0.7rem; color: var(--muted); }
  .badge-prov { color: var(--warn); font-size: 0.65rem; font-weight: 700; letter-spacing: 0.5px; }
  .badge-est { color: var(--accent2); font-size: 0.65rem; font-weight: 700; }
  .badge-vet { color: var(--accent); font-size: 0.65rem; font-weight: 700; }

  /* Detail drawer */
  #drawer-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 200; }
  #drawer { position: fixed; right: 0; top: 0; bottom: 0; width: min(560px, 100vw); background: var(--surface); border-left: 1px solid var(--border); z-index: 201; display: none; flex-direction: column; overflow: hidden; }
  #drawer.open, #drawer-overlay.open { display: flex; }
  .drawer-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
  .drawer-close { background: var(--pill-bg); border: none; color: var(--muted); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 1.1rem; }
  .drawer-edit-btn { background: var(--accent); color: #000; border: none; border-radius: 8px; padding: 7px 16px; font-size: 0.82rem; font-weight: 700; cursor: pointer; }
  .drawer-header-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .drawer-body { flex: 1; overflow-y: auto; padding: 20px; }
  .drawer-section { margin-bottom: 24px; }
  .drawer-section h4 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 12px; }
  /* View mode rows */
  .field-row { display: flex; gap: 8px; margin-bottom: 10px; align-items: flex-start; }
  .field-label { font-size: 0.78rem; color: var(--muted); width: 110px; flex-shrink: 0; padding-top: 2px; }
  .field-val { flex: 1; font-size: 0.9rem; font-weight: 500; word-break: break-word; }
  /* Edit mode inputs */
  .field-edit { flex: 1; padding: 7px 10px; background: var(--card); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 0.9rem; outline: none; width: 100%; }
  .field-edit:focus { border-color: var(--accent); }
  /* Rating pin note */
  .pin-note { font-size: 0.72rem; color: var(--muted); margin-top: 3px; }
  .history-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .history-item { background: var(--card); border-radius: 8px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; }
  .history-date { color: var(--muted); font-size: 0.75rem; }

  /* Connections chart */
  .conn-section { margin-bottom: 18px; }
  .conn-section h5 { font-size: 0.72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin: 0 0 8px; }
  .conn-bar-row { display: flex; align-items: center; gap: 9px; margin-bottom: 6px; cursor: pointer; border-radius: 8px; padding: 5px 6px; transition: background 0.12s; }
  .conn-bar-row:hover { background: rgba(255,255,255,0.04); }
  .conn-name { font-size: 0.8rem; font-weight: 600; width: 100px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conn-bar-wrap { flex: 1; height: 8px; background: rgba(255,255,255,0.07); border-radius: 4px; overflow: hidden; }
  .conn-bar-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
  .conn-count { font-size: 0.75rem; color: var(--muted); width: 28px; text-align: right; flex-shrink: 0; }
  .conn-pill { display: inline-flex; gap: 5px; font-size: 0.72rem; flex-shrink: 0; }
  .conn-pill span { padding: 1px 6px; border-radius: 20px; font-weight: 700; }
  .conn-w { background: rgba(59,230,133,0.15); color: var(--success); }
  .conn-l { background: rgba(255,88,88,0.15); color: var(--danger); }
  .conn-d { background: rgba(136,136,136,0.15); color: var(--muted); }
  /* Last match popover */
  .conn-popover { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; margin: 0 6px 10px; font-size: 0.8rem; animation: fadeIn 0.15s; }
  .conn-popover-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .conn-popover-score { font-size: 1.1rem; font-weight: 800; }
  @keyframes fadeIn { from { opacity:0; transform: translateY(-4px); } to { opacity:1; transform: translateY(0); } }
  .delta-pos { color: var(--success); }
  .delta-neg { color: var(--danger); }
  .save-bar { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; }

  /* Open Play — day history */
  .op-day-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px; overflow: hidden; max-width: 680px; }
  .op-day-header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; user-select: none; transition: background 0.12s; }
  .op-day-header:hover { background: rgba(255,255,255,0.03); }
  .op-day-date { font-weight: 700; font-size: 0.95rem; flex: 1; }
  .op-day-meta { font-size: 0.78rem; color: var(--muted); }
  .op-day-arrow { font-size: 0.7rem; color: var(--muted); transition: transform 0.2s; }
  .op-day-card.open .op-day-arrow { transform: rotate(180deg); }
  .op-day-body { display: none; border-top: 1px solid var(--border); padding: 14px 16px; }
  .op-day-card.open .op-day-body { display: block; }

  /* Day recap: players present that day */
  .op-day-players { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .op-day-player-chip { display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 4px 10px 4px 6px; font-size: 0.78rem; }
  .op-day-player-chip .chip-name { font-weight: 600; }
  .op-day-player-chip .chip-rating { font-size: 0.7rem; font-weight: 700; }

  /* Match rows inside a day */
  .op-match-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.83rem; }
  .op-match-row:last-child { border-bottom: none; }
  .op-match-teams { flex: 1; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .op-match-team { display: flex; gap: 4px; }
  .op-match-vs { font-size: 0.7rem; color: var(--muted); font-weight: 600; }
  .op-match-score { font-weight: 800; font-size: 1rem; white-space: nowrap; }

  /* Member history view */
  .op-member-header { display: flex; align-items: center; gap: 14px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; max-width: 680px; }
  .op-member-rating-big { font-size: 2rem; font-weight: 800; }
  .op-member-stats { display: flex; gap: 16px; margin: 10px 0 14px; flex-wrap: wrap; max-width: 680px; }
  .op-member-stat { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 16px; text-align: center; flex: 1; min-width: 80px; }
  .op-member-stat-val { font-size: 1.4rem; font-weight: 800; }
  .op-member-stat-lbl { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }
  .op-member-section-title { font-size: 0.72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin: 16px 0 8px; }
  .op-history-match { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; margin-bottom: 7px; max-width: 680px; font-size: 0.83rem; }
  .op-history-match-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }

  /* Open Play entry */
  .op-form { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; max-width: 640px; }
  .op-form h3 { font-size: 1.1rem; margin-bottom: 16px; }
  .form-row { margin-bottom: 14px; }
  .form-label { font-size: 0.8rem; color: var(--muted); margin-bottom: 5px; display: block; }
  .form-input { width: 100%; padding: 10px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 0.95rem; outline: none; }
  .form-input:focus { border-color: var(--accent); }
  .match-block { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 10px; }
  .match-block h4 { font-size: 0.8rem; color: var(--muted); margin-bottom: 10px; }
  .team-row { display: flex; gap: 8px; align-items: center; }
  .vs { color: var(--muted); font-size: 0.8rem; margin: 4px 0; text-align: center; }
  .score-input { width: 90px; padding: 8px 10px; background: var(--card); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 0.95rem; text-align: center; outline: none; }
  .score-input:focus { border-color: var(--accent); }
  select.form-input option { background: var(--card); }
  .player-tag { display: inline-flex; align-items: center; gap: 5px; background: var(--pill-bg); border-radius: 20px; padding: 4px 10px; font-size: 0.82rem; cursor: pointer; }
  .player-tag .x { color: var(--muted); font-size: 0.7rem; }

  /* Rating overview */
  .rating-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  .rating-table th { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; }
  .rating-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
  .rating-table tr:hover td { background: var(--card); }
  .rank { font-weight: 700; color: var(--muted); }
  .name-cell { font-weight: 600; }
  .trend-up { color: var(--success); }
  .trend-dn { color: var(--danger); }
  .trend-flat { color: var(--muted); }

  /* Toast */
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px 20px; font-size: 0.9rem; z-index: 500; display: none; }
  #toast.show { display: block; }
  #toast.ok { border-color: var(--success); color: var(--success); }
  #toast.err { border-color: var(--danger); color: var(--danger); }

  /* Loading */
  .loading { text-align: center; padding: 60px; color: var(--muted); }
  .spinner { display: inline-block; width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Responsive */
  @media (max-width: 500px) {
    .member-grid { grid-template-columns: 1fr; }
    .tabs { gap: 2px; }
    .tab { padding: 7px 12px; font-size: 0.8rem; }
  }

  /* New member form */
  .new-member-form { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; max-width: 500px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 500px) { .form-grid { grid-template-columns: 1fr; } }
  .form-full { grid-column: 1 / -1; }

  /* Skill Assessment Modal */
  #assess-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 400; display: none; align-items: center; justify-content: center; padding: 16px; }
  #assess-overlay.open { display: flex; }
  #assess-modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 540px; max-height: 90vh; overflow-y: auto; display: flex; flex-direction: column; }
  .assess-header { padding: 20px 24px 16px; border-bottom: 1px solid var(--border); }
  .assess-header h2 { font-size: 1.15rem; font-weight: 800; margin-bottom: 2px; }
  .assess-header p { font-size: 0.8rem; color: var(--muted); }
  .assess-progress { display: flex; gap: 6px; margin-top: 14px; }
  .assess-pip { flex: 1; height: 4px; border-radius: 2px; background: var(--border); transition: background 0.2s; }
  .assess-pip.done { background: var(--accent); }
  .assess-pip.active { background: var(--accent2); }
  .assess-body { padding: 24px; flex: 1; }
  .assess-q { font-size: 1rem; font-weight: 700; margin-bottom: 6px; line-height: 1.4; }
  .assess-hint { font-size: 0.78rem; color: var(--muted); margin-bottom: 20px; }
  .assess-options { display: flex; flex-direction: column; gap: 10px; }
  .assess-opt { background: var(--card); border: 2px solid var(--border); border-radius: 10px; padding: 13px 16px; cursor: pointer; transition: border-color 0.15s, background 0.15s; text-align: left; color: var(--text); width: 100%; }
  .assess-opt:hover { border-color: var(--accent2); background: rgba(59,255,232,0.05); }
  .assess-opt.selected { border-color: var(--accent); background: rgba(232,255,59,0.08); }
  .assess-opt-label { font-size: 0.92rem; font-weight: 600; color: var(--text); }
  .assess-opt-desc { font-size: 0.78rem; color: var(--muted); margin-top: 3px; }
  .assess-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: space-between; align-items: center; }
  .assess-result { padding: 24px; text-align: center; }
  .assess-result-num { font-size: 4rem; font-weight: 800; color: var(--accent); line-height: 1; }
  .assess-result-band { font-size: 1.1rem; font-weight: 700; margin: 8px 0 4px; }
  .assess-result-desc { font-size: 0.85rem; color: var(--muted); max-width: 360px; margin: 0 auto 20px; }
  .assess-result-breakdown { background: var(--card); border-radius: 10px; padding: 14px 16px; text-align: left; font-size: 0.8rem; margin-bottom: 20px; }
  .assess-result-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid var(--border); }
  .assess-result-row:last-child { border-bottom: none; }

  /* Rating Guide Panel */
  .guide-toggle { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 9px 14px; font-size: 0.82rem; font-weight: 600; color: var(--muted); cursor: pointer; width: 100%; text-align: left; margin-bottom: 12px; transition: border-color 0.15s, color 0.15s; }
  .guide-toggle:hover { border-color: var(--accent2); color: var(--text); }
  .guide-toggle .gt-icon { font-size: 1rem; }
  .guide-toggle .gt-arrow { margin-left: auto; transition: transform 0.2s; font-size: 0.75rem; }
  .guide-toggle.open { border-color: var(--accent2); color: var(--text); }
  .guide-toggle.open .gt-arrow { transform: rotate(180deg); }
  .guide-panel { display: none; margin-bottom: 18px; }
  .guide-panel.open { display: block; }
  .guide-table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; }
  .guide-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; min-width: 560px; }
  .guide-table thead tr { background: var(--surface); }
  .guide-table th { padding: 10px 14px; text-align: left; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); font-weight: 700; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .guide-table td { padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; line-height: 1.45; }
  .guide-table tr:last-child td { border-bottom: none; }
  .guide-table tr:hover td { background: rgba(255,255,255,0.02); }
  .gr-range { font-weight: 800; font-size: 0.95rem; color: var(--accent); white-space: nowrap; }
  .gr-band { font-weight: 700; white-space: nowrap; }
  .gr-badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.3px; }
  .gr-desc { color: var(--muted); font-size: 0.78rem; }
  /* Per-level colour accents on the left border */
  .guide-table tr.tier-init td:first-child { border-left: 3px solid #666; }
  .guide-table tr.tier-init-i td:first-child { border-left: 3px solid #aaa; }
  .guide-table tr.tier-inter td:first-child { border-left: 3px solid var(--accent2); }
  .guide-table tr.tier-inter-h td:first-child { border-left: 3px solid #3bd9ff; }
  .guide-table tr.tier-inter-a td:first-child { border-left: 3px solid #3baaff; }
  .guide-table tr.tier-adv td:first-child { border-left: 3px solid #b47dff; }
  .guide-table tr.tier-elite td:first-child { border-left: 3px solid var(--accent); }
  /* Badge colours */
  .badge-init { background: rgba(150,150,150,0.15); color: #aaa; }
  .badge-init-i { background: rgba(200,200,200,0.12); color: #ccc; }
  .badge-inter { background: rgba(59,255,232,0.12); color: var(--accent2); }
  .badge-inter-h { background: rgba(59,217,255,0.12); color: #3bd9ff; }
  .badge-inter-a { background: rgba(59,170,255,0.12); color: #3baaff; }
  .badge-adv { background: rgba(180,125,255,0.15); color: #b47dff; }
  .badge-elite { background: rgba(232,255,59,0.15); color: var(--accent); }
</style>

<script type="module">

  apiKey: "AIzaSyDu7A0agFAT1jwfrjCRkQe6tHg2Qu_LnDc",
  authDomain: "deuceandsmash-club.firebaseapp.com",

const app = initializeApp(FIREBASE_CONFIG);
const db = getDatabase(app);
const auth = getAuth(app);

// Sign in anonymously so Firebase security rules allow reads
signInAnonymously(auth).catch(e => console.warn('Anon auth failed:', e));

// ===== Smash Rating Engine (embedded) =====
const DSR = {
  SCALE:7/1000,DIVISOR:400,
  K:{provisional:60,established:32,veteran:20},
  ZONES:[{name:"Growth",lo:0,hi:3,gain:1.3,loss:0.9},{name:"Qualification",lo:3,hi:4,gain:0.65,loss:1.0},{name:"Elite",lo:4,hi:99,gain:0.35,loss:1.15}],
  QUALITY_GATE:{from:4.5,oppBelow:3.5,gain:0.15},
  TOP_DAMPENER:{above:6.5,factor:0.5},
  W:{league:1,openplay:1,competitive:1,americano:0.25},
  PROVISIONAL:{sets:8,partners:4,opponents:6},
  BREAK:{faster:90,provisional:180,hidden:365},
  BANDS:[["Beginner",0],["Beginner+",1],["Intermediate",2],["Intermediate+",3],["Intermediate High",4],["Advanced",5],["Elite",6]],
  TAG_SEED:{"Beginner":0.75,"Beginner / Beginner+":1.0,"Beginner+":1.5,"Beginner+ / Inter":2.0,"Inter":2.5,"Inter / Inter+":3.0,"Strong Inter":3.5,"Inter+":3.5},
  TAG_ORDER:["Beginner","Beginner / Beginner+","Beginner+","Beginner+ / Inter","Inter","Inter / Inter+","Strong Inter","Inter+"],
  SEED_FLOOR:0.5,SEED_CAP:4.0,DEFAULT_SEED:0.5,
};
DSR.band=r=>{let b=DSR.BANDS[0][0];for(const[n,lo]of DSR.BANDS)if(r>=lo-1e-9)b=n;return b;};
DSR.zone=r=>DSR.ZONES.find(z=>r>=z.lo-1e-9&&r<z.hi)||DSR.ZONES[0];
// Band colour — consistent across all views (matches guide table tier colours)
const BAND_STYLE = {
  'Beginner':          { color: '#aaa',    bg: 'rgba(150,150,150,0.15)', cls: 'badge-init' },
  'Beginner+':         { color: '#ccc',    bg: 'rgba(200,200,200,0.12)', cls: 'badge-init-i' },
  'Intermediate':      { color: '#3bffe8', bg: 'rgba(59,255,232,0.12)',  cls: 'badge-inter' },
  'Intermediate+':     { color: '#3bffe8', bg: 'rgba(59,255,232,0.12)',  cls: 'badge-inter' },
  'Intermediate High': { color: '#3bd9ff', bg: 'rgba(59,217,255,0.12)',  cls: 'badge-inter-h' },
  'Advanced':          { color: '#b47dff', bg: 'rgba(180,125,255,0.15)', cls: 'badge-adv' },
  'Elite':             { color: '#e8ff3b', bg: 'rgba(232,255,59,0.15)',  cls: 'badge-elite' },
};
function bandColor(band) { return BAND_STYLE[band] || { color: '#888', bg: 'rgba(136,136,136,0.1)', cls: '' }; }
function bandChip(band) {
  const s = bandColor(band);
  return `<span style="display:inline-block;padding:2px 9px;border-radius:20px;font-size:0.72rem;font-weight:700;background:${s.bg};color:${s.color}">${band}</span>`;
}
DSR.expected=(ra,rb)=>1/(1+Math.pow(10,-((ra-rb)/DSR.SCALE)/DSR.DIVISOR));
const dayNum=d=>Math.round(new Date(d+"T00:00:00Z").getTime()/864e5);
DSR.setsIn=m=>m.sets||String(m.score||"").split(",").filter(s=>s.trim()).length||1;
DSR.isProvisional=p=>p.sets<DSR.PROVISIONAL.sets||p.partners.size<DSR.PROVISIONAL.partners||p.opps.size<DSR.PROVISIONAL.opponents;
DSR.seedFromHistory=(games,today)=>{
  const t=dayNum(today);const g=games.filter(x=>x.level in DSR.TAG_SEED&&t-dayNum(x.date)<=183);
  if(!g.length)return null;
  const cnt={};g.forEach(x=>cnt[x.level]=(cnt[x.level]||0)+1);
  const order=DSR.TAG_ORDER;let tag=null,atOrAbove=0;
  for(let i=order.length-1;i>=0;i--){const c=cnt[order[i]]||0;atOrAbove+=c;if(c>=3||(c&&atOrAbove/g.length>=0.4)){tag=order[i];break;}}
  if(!tag)tag=g[g.length-1].level;
  let seed=DSR.TAG_SEED[tag],why=`Seeded from ${tag} open plays`;
  const higher=order.slice(order.indexOf(tag)+1).filter(l=>DSR.TAG_SEED[l]>DSR.TAG_SEED[tag]).reduce((s,l)=>s+(cnt[l]||0),0);
  if(higher>=3){seed+=0.25;why+="; +0.25 for 3+ games a level up";}
  if(g.length<3){seed-=0.25;why+="; −0.25 for fewer than 3 games";}
  return{seed:Math.min(DSR.SEED_CAP,Math.max(DSR.SEED_FLOOR,seed)),tag,why};
};
DSR.compute=(seeds,matches,today)=>{
  const S={};
  const get=n=>S[n]||(S[n]={name:n,seed:seeds[n]?.seed??DSR.DEFAULT_SEED,r:seeds[n]?.seed??DSR.DEFAULT_SEED,me:0,sets:0,matches:0,last:null,partners:new Set(),opps:new Set(),hist:[]});
  Object.keys(seeds).forEach(get);
  const list=matches.filter(m=>m.status==="confirmed"&&DSR.W[m.format]).slice().sort((x,y)=>x.date.localeCompare(y.date)||String(x.enteredAt||"").localeCompare(String(y.enteredAt||"")));
  for(const m of list){
    const A=m.teamA.map(get),B=m.teamB.map(get);
    // Skip this match for any player whose assessment date is after the match date
    const allPlayers=[...A,...B];
    const skip=allPlayers.some(p=>{const s=seeds[p.name];return s?.assessedAt&&m.date<s.assessedAt;});
    if(skip)continue;
    const ra=(A[0].r+A[1].r)/2,rb=(B[0].r+B[1].r)/2;
    const E=DSR.expected(ra,rb);const Sa=m.a/(m.a+m.b);const W=DSR.W[m.format];const d=dayNum(m.date);
    const apply=(p,team,opp,oppAvg,surprise)=>{
      const away=p.last==null?0:d-p.last;
      let status=DSR.isProvisional(p)?"provisional":p.me<30?"established":"veteran";
      if(away>=DSR.BREAK.provisional)status="provisional";
      else if(away>=DSR.BREAK.faster&&status==="veteran")status="established";
      let K=DSR.K[status];if(p.r>DSR.TOP_DAMPENER.above)K*=DSR.TOP_DAMPENER.factor;
      const z=DSR.zone(p.r);let mult=surprise>=0?z.gain:z.loss;
      if(surprise>0&&p.r>=DSR.QUALITY_GATE.from&&oppAvg<DSR.QUALITY_GATE.oppBelow)mult=DSR.QUALITY_GATE.gain;
      const delta=K*mult*W*surprise*DSR.SCALE;const before=p.r;
      p.r=Math.min(7,Math.max(0,p.r+delta));
      const st=DSR.setsIn(m)*W;p.me+=W;p.sets+=st;p.matches++;p.last=d;
      team.filter(x=>x!==p).forEach(x=>p.partners.add(x.name));opp.forEach(x=>p.opps.add(x.name));
      p.hist.push({date:m.date,r:p.r,delta:p.r-before,id:m.id});
    };
    A.forEach(p=>apply(p,A,B,rb,Sa-E));B.forEach(p=>apply(p,B,A,ra,E-Sa));
  }
  const t=dayNum(today);
  Object.values(S).forEach(p=>{
    const away=p.last==null?null:t-p.last;
    p.badge=(DSR.isProvisional(p)||(away!=null&&away>=DSR.BREAK.provisional))?"Provisional":p.me<30?"Established":"Veteran";
    p.hidden=away!=null&&away>DSR.BREAK.hidden;
    p.band=DSR.band(p.r);p.zone=DSR.zone(p.r).name;
    p.trend=p.hist.slice(-5).reduce((s,h)=>s+h.delta,0);
  });
  return{players:S};
};

// ===== State =====
let members = {};       // id -> member object
let sessions = {};      // id -> session
let opMatches = {};     // id -> match

// ===== Data loading =====
async function loadAll() {
  showToast('Loading member database…', 'ok', 2000);
  const [mSnap, sSnap, matchSnap, trnMetaSnap] = await Promise.all([
    get(ref(db, 'members')),
    get(ref(db, 'openPlaySessions')),
    get(ref(db, 'openPlayMatches')),
    get(ref(db, 'tournaments/_meta')),
  ]);
  members = mSnap.val() || {};
  sessions = sSnap.val() || {};
  opMatches = matchSnap.val() || {};
  trnMeta = trnMetaSnap.val() || {};
  trnLoaded = true; // prevent double-subscribe when Tournaments tab is opened
  computeAllRatings();
  renderMembers();
  renderRatings();
  populateOpMemberFilter();
  document.getElementById('header-count').textContent = `${Object.keys(members).length} members`;
}

function computeAllRatings() {
  const today = new Date().toISOString().split('T')[0];
  // Build seeds from open-play history
  const seeds = {};
  for (const [id, m] of Object.entries(members)) {
    const name = m.name;
    // Collect sessions for this player
    const playerGames = [];
    for (const s of Object.values(sessions)) {
      if (Array.isArray(s.players) && s.players.includes(name) && s.status === 'Played') {
        playerGames.push({ date: s.date, level: s.level });
      }
    }
    if (m.ratingOverride != null && m.ratingOverride !== '') {
      // Assessment seed — starting point for DSR from the assessment date onward
      const pinned = parseFloat(m.ratingOverride);
      if (!isNaN(pinned)) seeds[name] = { seed: pinned, source: `Staff assessment: ${pinned}${m.ratingAssessedAt ? ` (set ${m.ratingAssessedAt})` : ''}`, assessedAt: m.ratingAssessedAt || null };
    } else if (m.levelOverride) {
      // Level → seed override takes priority over history
      const LEVEL_MAP = { 'Beginner': 0.75, 'Beginner+': 1.5, 'Inter': 2.5, 'Intermediate': 2.5, 'Intermediate+': 3.5, 'Strong Inter': 3.5, 'Advanced': 4.5, 'Advanced High': 5.5, 'Elite': 6.5 };
      const s = LEVEL_MAP[m.levelOverride] ?? 1.5;
      seeds[name] = { seed: s, source: `Staff override: ${m.levelOverride}` };
    } else {
      const h = DSR.seedFromHistory(playerGames, today);
      if (h) seeds[name] = { seed: h.seed, source: h.why };
    }
  }
  // All matches
  const allMatches = Object.entries(opMatches).map(([id, m]) => ({ id, ...m }));
  const result = DSR.compute(seeds, allMatches, today);
  ratings = result.players;
  // No post-compute pin — ratingOverride is a DSR seed only (point-in-time assessment)
}

    return `<div class="member-card" onclick="openDrawer('${id}')">

      <div class="member-stats">

        ${m.levelOverride ? `<div class="stat-pill">${m.levelOverride}</div>` : ''}
        ${m.membership ? `<div class="stat-pill" style="color:var(--accent2)">${m.membership}</div>` : ''}
      </div>
    </div>`;
  }).join('');
};

// ===== Drawer helpers =====
function drawerMeta(m) {
  const parts = [];
  if (m.levelOverride) parts.push(m.levelOverride);
  if (m.ratingOverride != null && m.ratingOverride !== '') parts.push(`Rating pinned: ${parseFloat(m.ratingOverride).toFixed(2)}`);
  return parts.join(' · ') || 'No level set';
}

function buildHistHtml(r) {
  if (!r || !r.hist.length) return '<p style="color:var(--muted);font-size:0.85rem">No rated matches yet</p>';
  return `<ul class="history-list">${r.hist.slice().reverse().slice(0,10).map(h => {
    const cls = h.delta > 0.001 ? 'delta-pos' : h.delta < -0.001 ? 'delta-neg' : '';
    const sign = h.delta > 0.001 ? '+' : '';
    return `<li class="history-item">
      <span>${h.date}</span>
      <span class="${cls}">${sign}${h.delta.toFixed(3)}</span>
      <span style="color:var(--accent)">${h.r.toFixed(2)}</span>
    </li>`;
  }).join('')}</ul>`;
}

function buildConnectionsHTML(m, playerSessions) {
  if (!playerSessions.length) return '';

  // Build per-person stats: partners and opponents
  const partners = {}, opponents = {};

  playerSessions.forEach(s => {
    const onMyTeam  = s.teamA?.includes(m.name) ? s.teamA : s.teamB;
    const otherTeam = s.teamA?.includes(m.name) ? s.teamB : s.teamA;
    const myScore   = s.teamA?.includes(m.name) ? s.a : s.b;
    const oppScore  = s.teamA?.includes(m.name) ? s.b : s.a;
    const result    = myScore > oppScore ? 'W' : myScore < oppScore ? 'L' : 'D';

    // Partners (teammates, excluding self)
    (onMyTeam || []).filter(n => n !== m.name).forEach(name => {
      if (!partners[name]) partners[name] = { count: 0, W: 0, L: 0, D: 0, last: null };
      partners[name].count++;
      partners[name][result]++;
      if (!partners[name].last || (s.date || '') > (partners[name].last.date || ''))
        partners[name].last = s;
    });

    // Opponents
    (otherTeam || []).forEach(name => {
      if (!opponents[name]) opponents[name] = { count: 0, W: 0, L: 0, D: 0, last: null };
      opponents[name].count++;
      opponents[name][result]++;
      if (!opponents[name].last || (s.date || '') > (opponents[name].last.date || ''))
        opponents[name].last = s;
    });
  });

  function renderGroup(map, label, barColor) {
    const sorted = Object.entries(map).sort((a, b) => b[1].count - a[1].count);
    if (!sorted.length) return '';
    const maxCount = sorted[0][1].count;
    const rows = sorted.map(([name, d], idx) => {
      const widthPct = Math.round((d.count / maxCount) * 100);
      const popId = `conn-pop-${m.id}-${label.slice(0,1)}-${idx}`;
      // Last match summary for popover
      const s = d.last;
      let popoverContent = '';
      if (s) {
        const onMyTeam  = s.teamA?.includes(m.name) ? s.teamA : s.teamB;
        const otherTeam = s.teamA?.includes(m.name) ? s.teamB : s.teamA;
        const myScore   = s.teamA?.includes(m.name) ? s.a : s.b;
        const oppScore  = s.teamA?.includes(m.name) ? s.b : s.a;
        const res       = myScore > oppScore ? 'W' : myScore < oppScore ? 'L' : 'D';
        const rc        = res==='W'?'var(--success)':res==='L'?'var(--danger)':'var(--muted)';
        const teammates = (onMyTeam||[]).filter(n=>n!==m.name).join(' & ') || 'Solo';
        const opps      = (otherTeam||[]).join(' & ') || '—';
        popoverContent = `
          <div class="conn-popover-head">
            <span style="color:var(--muted);font-size:0.72rem">${s.date||'Unknown date'}</span>
            <span class="conn-popover-score" style="color:${rc}">${res} &nbsp;${myScore}–${oppScore}</span>
          </div>
          <div style="font-size:0.77rem;color:var(--muted)">w/ ${teammates} &nbsp;vs&nbsp; ${opps}</div>`;
      }
      return `
        <div>
          <div class="conn-bar-row" onclick="toggleConnPop('${popId}')">
            <span class="conn-name" title="${name}">${name}</span>
            <div class="conn-bar-wrap"><div class="conn-bar-fill" style="width:${widthPct}%;background:${barColor}"></div></div>
            <span class="conn-count">${d.count}×</span>
            <span class="conn-pill">
              ${d.W ? `<span class="conn-w">${d.W}W</span>` : ''}
              ${d.L ? `<span class="conn-l">${d.L}L</span>` : ''}
              ${d.D ? `<span class="conn-d">${d.D}D</span>` : ''}
            </span>
          </div>
          <div id="${popId}" style="display:none">
            ${s ? `<div class="conn-popover">${popoverContent}</div>` : ''}
          </div>
        </div>`;
    }).join('');

    return `<div class="conn-section"><h5>${label}</h5>${rows}</div>`;
  }

  return `
    <div style="margin-top:4px">
      ${renderGroup(partners, 'Partners', 'var(--accent2)')}
      ${renderGroup(opponents, 'Opponents', '#b47dff')}
    </div>`;
}

window.toggleConnPop = (id) => {
  const el = document.getElementById(id);
  if (!el) return;
  const isOpen = el.style.display !== 'none';
  // close all others in the same drawer
  document.querySelectorAll('[id^="conn-pop-"]').forEach(e => e.style.display = 'none');
  if (!isOpen) el.style.display = 'block';
};

function _trnStats(matches, playerName) {
  let wins = 0, ties = 0, losses = 0, ptsFor = 0, ptsAgainst = 0;
  const oppRecord = {};
  matches.forEach(m => {
    const inA = m.teamA?.includes(playerName);
    const myScore = inA ? (m.a||0) : (m.b||0);
    const oppScore = inA ? (m.b||0) : (m.a||0);
    ptsFor += myScore; ptsAgainst += oppScore;
    if (myScore > oppScore) wins++;
    else if (myScore < oppScore) losses++;
    else ties++;
    const opps = inA ? (m.teamB||[]) : (m.teamA||[]);
    opps.forEach(opp => {
      if (!oppRecord[opp]) oppRecord[opp] = { w:0, l:0, t:0 };
      if (myScore > oppScore) oppRecord[opp].w++;
      else if (myScore < oppScore) oppRecord[opp].l++;
      else oppRecord[opp].t++;
    });
  });
  return { wins, ties, losses, ptsFor, ptsAgainst, oppRecord };
}

function _trnStatCards(stats) {
  const { wins, ties, losses, ptsFor, ptsAgainst, oppRecord } = stats;
  const total = wins + ties + losses;
  const ptsDiff = ptsFor - ptsAgainst;
  const ptsDiffStr = ptsDiff >= 0 ? `+${ptsDiff}` : `${ptsDiff}`;
  const avgScored = total > 0 ? (ptsFor / total).toFixed(1) : '—';
  let toughestOpp = null, toughestL = 0;
  Object.entries(oppRecord).forEach(([opp, rec]) => {
    if (rec.l > toughestL) { toughestL = rec.l; toughestOpp = opp; }
  });
  return `
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px">
      <div style="background:var(--card,#1a1a2e);border-radius:8px;padding:10px;border:1px solid rgba(255,255,255,0.06);text-align:center">
        <div style="font-size:1.05rem;font-weight:800;color:var(--text)">${wins}-${ties}-${losses}</div>
        <div style="font-size:0.65rem;color:var(--muted);margin-top:2px">W–T–L</div>
      </div>
      <div style="background:var(--card,#1a1a2e);border-radius:8px;padding:10px;border:1px solid rgba(255,255,255,0.06);text-align:center">
        <div style="font-size:1.05rem;font-weight:800;color:${ptsDiff>=0?'#7DC515':'#FF4D6D'}">${ptsDiffStr}</div>
        <div style="font-size:0.65rem;color:var(--muted);margin-top:2px">Pt diff</div>
      </div>
      <div style="background:var(--card,#1a1a2e);border-radius:8px;padding:10px;border:1px solid rgba(255,255,255,0.06);text-align:center">
        <div style="font-size:1.05rem;font-weight:800;color:var(--text)">${avgScored}</div>
        <div style="font-size:0.65rem;color:var(--muted);margin-top:2px">Avg/match</div>
      </div>
    </div>
    ${toughestOpp ? `
    <div style="background:var(--card,#1a1a2e);border-radius:8px;padding:10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;border:1px solid rgba(255,255,255,0.06)">
      <div>
        <div style="font-weight:700;font-size:0.82rem;color:var(--text)">${toughestOpp}</div>
        <div style="font-size:0.65rem;color:var(--muted);margin-top:2px">Toughest opponent</div>
      </div>
      <div style="font-size:0.75rem;color:var(--muted)">${toughestL} loss${toughestL!==1?'es':''}</div>
    </div>` : ''}`;
}

function buildPlayerSpotlight(playerName) {
  const allTrnMatches = Object.values(opMatches).filter(
    m => m.source === 'tournament' && (m.teamA?.includes(playerName) || m.teamB?.includes(playerName))
  );
  if (!allTrnMatches.length) return '';

  // Group by tournamentId
  const byTrn = {};
  allTrnMatches.forEach(m => {
    const key = m.tournamentId || '__unknown__';
    if (!byTrn[key]) byTrn[key] = [];
    byTrn[key].push(m);
  });

  const trnKeys = Object.keys(byTrn);
  trnKeys.sort((a, b) => {
    const ma = trnMeta[a], mb = trnMeta[b];
    return (mb?.date||'').localeCompare(ma?.date||'');
  });

  const rankEmoji = ['\U0001f947','\U0001f948','\U0001f949'];

  const trnCardsHtml = trnKeys.map(key => {
    const matches = byTrn[key];
    const meta = trnMeta[key];
    const trnName = meta?.name || key;
    const trnDate = meta?.date || '';
    const isFirebaseKey = key.startsWith('-');
    const href = isFirebaseKey
      ? `../tournaments/scoreboard.html?id=${encodeURIComponent(key)}`
      : `../tournaments/${key}.html`;

    const rank = meta?.standings?.findIndex(s => s.name === playerName);
    const rankStr = rank != null && rank >= 0
      ? (rankEmoji[rank] || `${rank+1}th`)
      : '';

    const stats = _trnStats(matches, playerName);
    const statCards = _trnStatCards(stats);

    const matchRows = matches.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map((m, i) => {
      const inA = m.teamA?.includes(playerName);
      const myScore = inA ? (m.a||0) : (m.b||0);
      const oppScore = inA ? (m.b||0) : (m.a||0);
      const partner = (inA ? m.teamA : m.teamB)?.filter(n => n !== playerName).join(' & ') || '—';
      const opp = (inA ? m.teamB : m.teamA)?.join(' & ') || '—';
      const result = myScore > oppScore ? 'W' : myScore < oppScore ? 'L' : 'T';
      const col = result==='W'?'#7DC515':result==='L'?'#FF4D6D':'#aaa';
      return `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:0.75rem">
        <span style="font-weight:700;color:${col};width:14px;flex-shrink:0">${result}</span>
        <span style="font-size:0.95rem;font-weight:800;color:${col};width:38px;flex-shrink:0">${myScore}–${oppScore}</span>
        <div style="flex:1;min-width:0">
          <div style="color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">R${i+1} w/ ${partner}</div>
          <div style="color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">vs ${opp}</div>
        </div>
      </div>`;
    }).join('');

    return `
    <div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:14px;margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">
        <div>
          <a href="${href}" target="_blank" style="color:var(--accent,#7DC515);text-decoration:none;font-weight:700;font-size:0.88rem">${trnName}</a>
          ${trnDate ? `<div style="font-size:0.68rem;color:var(--muted);margin-top:2px">${trnDate}</div>` : ''}
        </div>
        ${rankStr ? `<span style="font-size:1.2rem">${rankStr}</span>` : ''}
      </div>
      ${statCards}
      <details style="margin-top:4px">
        <summary style="font-size:0.72rem;color:var(--muted);cursor:pointer;user-select:none;padding:2px 0">
          Match breakdown (${matches.length})
        </summary>
        <div style="margin-top:8px">${matchRows}</div>
      </details>
    </div>`;
  }).join('');

  // Overall combined summary — only shown when player has been in more than one tournament
  let summaryHtml = '';
  if (trnKeys.length > 1) {
    const overall = _trnStats(allTrnMatches, playerName);
    summaryHtml = `
    <div style="background:rgba(125,197,21,0.07);border:1px solid rgba(125,197,21,0.22);border-radius:10px;padding:12px;margin-bottom:14px">
      <div style="font-size:0.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px">All tournaments combined (${trnKeys.length})</div>
      ${_trnStatCards(overall)}
    </div>`;
  }

  return `
    <div class="drawer-section">
      <h4>\U0001f3c6 Tournament Performance</h4>
      ${summaryHtml}
      ${trnCardsHtml}
    </div>`;
}

  const r = ratings[m.name];
  const playerSessions = Object.values(opMatches).filter(match =>
    match.source !== 'tournament' && (match.teamA?.includes(m.name) || match.teamB?.includes(m.name))
  );

  document.getElementById('drawer-name').textContent = m.name || id;

  document.getElementById('drawer-overlay').classList.add('open');
  document.getElementById('save-bar').style.display = 'none';
};

  const m = members[drawerMemberId];
  if (!m) return;
  document.getElementById('drawer-body').innerHTML = renderDrawerEdit(m);
  document.getElementById('drawer-edit-btn').style.display = 'none';
  document.getElementById('save-bar').style.display = 'flex';
};

window.cancelEdit = () => {
  const m = members[drawerMemberId];
  const r = ratings[m?.name];
  const playerSessions = Object.values(opMatches).filter(match =>
    match.source !== 'tournament' && (match.teamA?.includes(m?.name) || match.teamB?.includes(m?.name))

  drawerEdits = {};
  document.getElementById('drawer-name').textContent = m.name || drawerMemberId;

  document.getElementById('drawer-overlay').classList.remove('open');

  drawerEdits = {};
};

    fullName:     document.getElementById('edit-fullname')?.value.trim() || '',
    phone:        document.getElementById('edit-phone')?.value.trim() || '',
    email:        document.getElementById('edit-email')?.value.trim() || '',
    levelOverride:document.getElementById('edit-level')?.value || '',
    membership:   document.getElementById('edit-membership')?.value || '',
    notes:        document.getElementById('edit-notes')?.value.trim() || '',
    ratingOverride: (() => {
      const v = document.getElementById('edit-rating')?.value;
      if (v === '' || v == null) return '';
      const n = parseFloat(v);
      return isNaN(n) ? '' : n;
    })(),
    ratingAssessedAt: (() => {
      const v = document.getElementById('edit-rating')?.value;
      if (v === '' || v == null) return (m?.ratingAssessedAt || '');
      const n = parseFloat(v);
      if (isNaN(n)) return (m?.ratingAssessedAt || '');
      // If value changed from stored, stamp today; otherwise keep existing date
      const existing = m?.ratingOverride;
      if (existing == null || existing === '' || parseFloat(existing) !== n) {
        return new Date().toISOString().slice(0, 10);
      }
      return m?.ratingAssessedAt || new Date().toISOString().slice(0, 10);
    })(),
    updatedAt: new Date().toISOString(),
  };
  await update(ref(db, `members/${drawerMemberId}`), updates);
  Object.assign(members[drawerMemberId], updates);
  computeAllRatings();
  renderMembers();
  renderRatings();
  // Return to view mode with updated data
  const r = ratings[updates.name || m.name];
  const pName = updates.name || m.name;
  const playerSessions = Object.values(opMatches).filter(match =>
    match.source !== 'tournament' && (match.teamA?.includes(pName) || match.teamB?.includes(pName))
  );
  document.getElementById('drawer-name').textContent = updates.name || m.name;
  document.getElementById('drawer-meta').textContent = drawerMeta(members[drawerMemberId]);
  document.getElementById('drawer-edit-btn').style.display = '';
  document.getElementById('drawer-body').innerHTML = renderDrawerView(members[drawerMemberId], r, playerSessions);
  document.getElementById('save-bar').style.display = 'none';
  showToast('Member updated ✓', 'ok');
};

window.renderRatings = () => {
  const q = document.getElementById('rating-search').value.toLowerCase();
  const sorted = Object.values(ratings)
    .filter(p => !q || p.name.toLowerCase().includes(q))
    .filter(p => !p.hidden)
    .sort((a, b) => b.r - a.r);
  const tbody = document.getElementById('rating-tbody');
  tbody.innerHTML = sorted.map((p, i) => {
    const t = p.trend;
    const tCls = t > 0.01 ? 'trend-up' : t < -0.01 ? 'trend-dn' : 'trend-flat';
    const tTxt = t > 0.01 ? `▲ ${t.toFixed(2)}` : t < -0.01 ? `▼ ${Math.abs(t).toFixed(2)}` : '—';
    const bc = bandColor(p.band);
    return `<tr>
      <td class="rank">${i+1}</td>
      <td class="name-cell">${p.name}</td>
      <td style="color:${bc.color};font-weight:800">${p.r.toFixed(2)}</td>
      <td>${bandChip(p.band)}</td>
      <td><span class="badge-${p.badge.toLowerCase().slice(0,4)}">${p.badge}</span></td>
      <td>${p.matches}</td>
      <td class="${tCls}">${tTxt}</td>
    </tr>`;
  }).join('');
};

window.submitMatch = async () => {
  const date = document.getElementById('op-date').value;
  const format = document.getElementById('op-format').value;
  const a1 = document.getElementById('op-a1').value;
  const a2 = document.getElementById('op-a2').value;
  const b1 = document.getElementById('op-b1').value;
  const b2 = document.getElementById('op-b2').value;
  const scoreText = document.getElementById('op-score').value.trim();
  const res = document.getElementById('op-result');
  if (!date || !a1 || !a2 || !b1 || !b2) { res.innerHTML = '<span style="color:var(--danger)">Fill in all 4 players</span>'; return; }
  if (new Set([a1,a2,b1,b2]).size < 4) { res.innerHTML = '<span style="color:var(--danger)">All 4 players must be different</span>'; return; }
  const pairs = scoreText.split(/[,;]/).map(s=>s.trim()).filter(Boolean);
  const valid = pairs.every(p=>/^\d{1,2}-\d{1,2}$/.test(p));
  if (!scoreText || !valid) { res.innerHTML = '<span style="color:var(--danger)">Score like 6-4 or 6-3, 7-5</span>'; return; }
  const totals = pairs.map(p=>p.split('-').map(Number));
  const ta = totals.reduce((s,p)=>s+p[0],0), tb = totals.reduce((s,p)=>s+p[1],0);
  const matchId = `${date}-${Date.now()}`;
  const matchData = {
    date, format, teamA: [a1,a2], teamB: [b1,b2],
    a: ta, b: tb, score: scoreText, sets: pairs.length,
    status: 'confirmed', enteredAt: new Date().toISOString(),
    note: `Open play — ${a1} & ${a2} vs ${b1} & ${b2}`,
  };
  await set(ref(db, `openPlayMatches/${matchId}`), matchData);
  opMatches[matchId] = matchData;
  computeAllRatings();
  renderMembers();
  renderRatings();
  res.innerHTML = `<span style="color:var(--success)">✓ Match saved! Ratings updated.</span>`;
  populateOpMemberFilter();
  showToast('Match logged & ratings updated', 'ok');
  setTimeout(showOpHistory, 1500);
};

function populateOpMemberFilter() {
  const sel = document.getElementById('op-member-filter');
  if (!sel) return;
  // Collect only members who appear in at least one opMatch
  const active = new Set();
  Object.values(opMatches).forEach(m => {
    (m.teamA||[]).forEach(n => active.add(n));
    (m.teamB||[]).forEach(n => active.add(n));
  });
  const sorted = [...active].sort();
  // Keep existing selection if valid
  const cur = sel.value;
  sel.innerHTML = '<option value="">👤 Filter by member…</option>' +
    sorted.map(n => `<option value="${n}"${n===cur?' selected':''}>${n}</option>`).join('');
}

window.showOpHistory = () => {
  // Reset member filter
  const sel = document.getElementById('op-member-filter');
  if (sel) sel.value = '';
  // Group matches by date
  const byDate = {};
  Object.entries(opMatches).forEach(([id, m]) => {
    const d = m.date || 'Unknown';
    if (!byDate[d]) byDate[d] = [];
    byDate[d].push({ id, ...m });
  });
  const dates = Object.keys(byDate).sort((a,b) => b.localeCompare(a));
  if (!dates.length) {
    document.getElementById('op-area').innerHTML = '<p style="color:var(--muted);padding:20px">No matches logged yet.</p>';
    return;
  }
  const cards = dates.map((date, idx) => {
    const matches = byDate[date];
    // Unique players that day
    const players = new Set();
    matches.forEach(m => { (m.teamA||[]).forEach(n=>players.add(n)); (m.teamB||[]).forEach(n=>players.add(n)); });
    const playerChips = [...players].map(name => {
      const r = ratings[name];
      const bc = r ? bandColor(r.band) : { color:'var(--muted)', bg:'rgba(136,136,136,0.1)' };
      return `<div class="op-day-player-chip">
        <span class="chip-rating" style="color:${bc.color}">${r ? r.r.toFixed(1) : '—'}</span>
        <span class="chip-name">${name}</span>
      </div>`;
    }).join('');
    const matchRows = matches.map(m => {
      const sa = m.a ?? m.score?.split('-')[0] ?? '?';
      const sb = m.b ?? m.score?.split('-')[1] ?? '?';
      const aWon = parseInt(sa) > parseInt(sb);
      const bWon = parseInt(sb) > parseInt(sa);
      const scoreColor = 'var(--text)';
      const aColor = aWon ? 'var(--success)' : bWon ? 'var(--danger)' : 'var(--muted)';
      const bColor = bWon ? 'var(--success)' : aWon ? 'var(--danger)' : 'var(--muted)';
      const teamANames = (m.teamA||[]).map(n => {
        const r = ratings[n]; const bc = r ? bandColor(r.band) : {color:'var(--muted)'};
        return `<span style="font-weight:600">${n}</span><sup style="font-size:0.6rem;color:${bc.color}">${r?r.r.toFixed(1):''}</sup>`;
      }).join(' <span style="color:var(--muted);font-size:0.7rem">&</span> ');
      const teamBNames = (m.teamB||[]).map(n => {
        const r = ratings[n]; const bc = r ? bandColor(r.band) : {color:'var(--muted)'};
        return `<span style="font-weight:600">${n}</span><sup style="font-size:0.6rem;color:${bc.color}">${r?r.r.toFixed(1):''}</sup>`;
      }).join(' <span style="color:var(--muted);font-size:0.7rem">&</span> ');
      return `<div class="op-match-row">
        <div class="op-match-teams">
          <span style="color:${aColor}">${teamANames}</span>
          <span class="op-match-vs">vs</span>
          <span style="color:${bColor}">${teamBNames}</span>
        </div>
        <div class="op-match-score">
          <span style="color:${aColor}">${sa}</span>
          <span style="color:var(--muted);font-size:0.8rem">–</span>
          <span style="color:${bColor}">${sb}</span>
        </div>
      </div>`;
    }).join('');
    // Format date label
    let dateLabel = date;
    if (date !== 'Unknown') {
      try { dateLabel = new Date(date).toLocaleDateString('en-IN', { weekday:'short', day:'numeric', month:'short', year:'numeric' }); } catch(e) {}
    }
    const openClass = idx === 0 ? ' open' : '';
    return `<div class="op-day-card${openClass}" id="op-day-${idx}">
      <div class="op-day-header" onclick="toggleOpDay(${idx})">
        <span class="op-day-date">📅 ${dateLabel}</span>
        <span class="op-day-meta">${matches.length} match${matches.length!==1?'es':''} · ${players.size} player${players.size!==1?'s':''}</span>
        <span class="op-day-arrow">▼</span>
      </div>
      <div class="op-day-body">
        <div class="op-member-section-title" style="margin-top:0">Players</div>
        <div class="op-day-players">${playerChips}</div>
        <div class="op-member-section-title">Match Results</div>
        ${matchRows}
      </div>
    </div>`;
  }).join('');
  document.getElementById('op-area').innerHTML = `<div style="padding-top:4px">${cards}</div>`;
};

window.showOpMemberHistory = () => {
  const name = document.getElementById('op-member-filter')?.value;
  if (!name) { showOpHistory(); return; }

  const playerMatches = Object.values(opMatches)
    .filter(m => m.teamA?.includes(name) || m.teamB?.includes(name))
    .sort((a,b) => (b.date||'').localeCompare(a.date||''));

  const r = ratings[name];
  const bc = r ? bandColor(r.band) : { color: 'var(--muted)', bg: 'rgba(136,136,136,0.1)' };
  const memberObj = Object.values(members).find(m => m.name === name);

  // Stats
  let W=0, L=0, D=0;
  const partnerMap = {}, opponentMap = {};
  playerMatches.forEach(m => {
    const onMyTeam  = m.teamA?.includes(name) ? m.teamA : m.teamB;
    const otherTeam = m.teamA?.includes(name) ? m.teamB : m.teamA;
    const myScore   = m.teamA?.includes(name) ? m.a : m.b;
    const oppScore  = m.teamA?.includes(name) ? m.b : m.a;
    const res       = myScore > oppScore ? 'W' : myScore < oppScore ? 'L' : 'D';
    if (res==='W') W++; else if (res==='L') L++; else D++;
    (onMyTeam||[]).filter(n=>n!==name).forEach(n => { partnerMap[n]=(partnerMap[n]||0)+1; });
    (otherTeam||[]).forEach(n => { opponentMap[n]=(opponentMap[n]||0)+1; });
  });

  const statsHtml = `<div class="op-member-stats">
    <div class="op-member-stat"><div class="op-member-stat-val">${playerMatches.length}</div><div class="op-member-stat-lbl">Matches</div></div>
    <div class="op-member-stat"><div class="op-member-stat-val" style="color:var(--success)">${W}</div><div class="op-member-stat-lbl">Won</div></div>
    <div class="op-member-stat"><div class="op-member-stat-val" style="color:var(--danger)">${L}</div><div class="op-member-stat-lbl">Lost</div></div>
    ${D ? `<div class="op-member-stat"><div class="op-member-stat-val" style="color:var(--muted)">${D}</div><div class="op-member-stat-lbl">Drawn</div></div>` : ''}
  </div>`;

  // Frequent partners/opponents
  function connList(map, color) {
    const sorted = Object.entries(map).sort((a,b)=>b[1]-a[1]);
    if (!sorted.length) return '<span style="color:var(--muted);font-size:0.82rem">None</span>';
    const max = sorted[0][1];
    return sorted.map(([n,count]) => {
      const rr = ratings[n]; const bcc = rr ? bandColor(rr.band) : {color:'var(--muted)'};
      const pct = Math.round(count/max*100);
      return `<div class="conn-bar-row" style="cursor:default">
        <span class="conn-name" title="${n}">${n}</span>
        <div class="conn-bar-wrap"><div class="conn-bar-fill" style="width:${pct}%;background:${color}"></div></div>
        <span class="conn-count">${count}×</span>
        <span style="font-size:0.7rem;color:${bcc.color};font-weight:700">${rr?rr.r.toFixed(2):''}</span>
      </div>`;
    }).join('');
  }

  const connectionsHtml = `
    <div class="conn-section"><h5>Most frequent partners</h5>${connList(partnerMap,'var(--accent2)')}</div>
    <div class="conn-section"><h5>Most frequent opponents</h5>${connList(opponentMap,'#b47dff')}</div>`;

  // Match history
  const matchHistHtml = playerMatches.length ? playerMatches.map(m => {
    const onMyTeam  = m.teamA?.includes(name) ? m.teamA : m.teamB;
    const otherTeam = m.teamA?.includes(name) ? m.teamB : m.teamA;
    const myScore   = m.teamA?.includes(name) ? m.a : m.b;
    const oppScore  = m.teamA?.includes(name) ? m.b : m.a;
    const res       = myScore > oppScore ? 'W' : myScore < oppScore ? 'L' : 'D';
    const rc        = res==='W'?'var(--success)':res==='L'?'var(--danger)':'var(--muted)';
    const partners  = (onMyTeam||[]).filter(n=>n!==name).map(n=>{
      const rr=ratings[n]; const bcc=rr?bandColor(rr.band):{color:'var(--muted)'};
      return `<strong>${n}</strong> <sup style="color:${bcc.color};font-size:0.65rem">${rr?rr.r.toFixed(1):''}</sup>`;
    }).join(' & ') || '—';
    const opps = (otherTeam||[]).map(n=>{
      const rr=ratings[n]; const bcc=rr?bandColor(rr.band):{color:'var(--muted)'};
      return `<strong>${n}</strong> <sup style="color:${bcc.color};font-size:0.65rem">${rr?rr.r.toFixed(1):''}</sup>`;
    }).join(' & ') || '—';
    let dateLabel = m.date||'—';
    if (m.date) { try { dateLabel = new Date(m.date).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}); } catch(e){} }
    return `<div class="op-history-match">
      <div class="op-history-match-top">
        <span style="color:var(--muted);font-size:0.75rem">${dateLabel}</span>
        <span style="font-weight:800;font-size:1rem;color:${rc}">${res} &nbsp;${myScore}–${oppScore}</span>
      </div>
      <div style="font-size:0.78rem">w/ ${partners} &nbsp;<span style="color:var(--muted)">vs</span>&nbsp; ${opps}</div>
    </div>`;
  }).join('') : '<p style="color:var(--muted);font-size:0.85rem">No matches recorded</p>';

  let dateLabel = '';
  if (memberObj?.createdAt) {
    try { dateLabel = 'Member since ' + new Date(memberObj.createdAt).toLocaleDateString('en-IN',{month:'short',year:'numeric'}); } catch(e){}
  }

  document.getElementById('op-area').innerHTML = `
    <div class="op-member-header">
      <div class="op-member-rating-big" style="color:${bc.color}">${r ? r.r.toFixed(2) : '—'}</div>
      <div>
        <div style="font-size:1rem;font-weight:700">${name}</div>
        ${r ? `<div style="margin:3px 0">${bandChip(r.band)}</div>` : ''}
        <div style="font-size:0.72rem;color:var(--muted)">${dateLabel}</div>
      </div>
    </div>
    ${statsHtml}
    <div class="op-member-section-title">Court Connections</div>
    ${connectionsHtml}
    <div class="op-member-section-title">Match History</div>
    ${matchHistHtml}`;
};

let trnLoaded = false;
let trnMeta = {}; // key -> _meta entry, kept in sync
function loadTournaments() {
  if (trnLoaded) return; // already listening
  trnLoaded = true;
  onValue(ref(db, 'tournaments/_meta'), snap => {
    const data = snap.val() || {};
    trnMeta = data;
    const list = Object.values(data).sort((a,b) => (b.date||'').localeCompare(a.date||''));
    renderTournaments(list);
  });
}

function renderTournaments(list) {
  const grid = document.getElementById('trn-grid');
  const countEl = document.getElementById('trn-count');
  if (!list.length) {
    grid.innerHTML = `<div style="color:var(--text-muted);padding:32px 0;font-size:0.9rem">No tournaments recorded yet.</div>`;
    if (countEl) countEl.textContent = '';
    return;
  }
  if (countEl) {
    const live = list.filter(t => t.status === 'live').length;
    countEl.textContent = `${list.length} event${list.length!==1?'s':''}${live?' · '+live+' live':''}`;
  }
  grid.innerHTML = list.map(t => {
    const statusColor = t.status==='live' ? '#FF6B35' : t.status==='completed' ? '#7DC515' : '#8C8B85';
    const statusDot   = t.status==='live'
      ? `<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#FF6B35;animation:pulse 1.5s infinite;margin-right:5px"></span>Live`
      : t.status==='completed' ? '✓ Completed' : '◦ Upcoming';
    const progress = t.rounds ? Math.round(((t.roundsDone||0)/t.rounds)*100) : 0;
    const sport = (t.sport||'padel').charAt(0).toUpperCase()+(t.sport||'padel').slice(1);
    // Link: live → scoreboard; completed/archived → scoreboard with ?id=; static pages use key.html
    const isFirebaseKey = t.key && t.key.startsWith('-');
    const href = isFirebaseKey
      ? `../tournaments/scoreboard.html?id=${encodeURIComponent(t.key)}`
      : `../tournaments/${t.key}.html`;
    // Standings block for completed tournaments
    const standingsHtml = (t.status==='completed' && t.standings && t.standings.length)
      ? `<div style="margin-top:12px;border-top:1px solid rgba(255,255,255,0.07);padding-top:10px">
          <div style="font-size:0.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px">Final Standings</div>
          ${t.standings.map(s => {
            const medal = s.pos===1?'🥇':s.pos===2?'🥈':s.pos===3?'🥉':'';
            return `<div style="display:flex;justify-content:space-between;align-items:center;font-size:0.8rem;padding:3px 0;${s.pos===1?'color:#7DC515;font-weight:700':'color:var(--text)'}">
              <span>${medal} ${s.name}</span>
              <span style="color:var(--text-muted)">${s.pts} pts</span>
            </div>`;
          }).join('')}
        </div>`
      : (t.winner ? `<div style="margin-top:10px;font-size:0.8rem;color:#7DC515;font-weight:600">🏆 ${t.winner}</div>` : '');
    return `
    <a href="${href}" target="_blank" style="text-decoration:none;color:inherit">
      <div style="background:var(--card-bg,#1a1a2e);border:1px solid rgba(255,255,255,0.07);border-radius:14px;overflow:hidden;transition:border-color .2s,transform .2s;cursor:pointer"
           onmouseover="this.style.borderColor='rgba(125,197,21,0.35)';this.style.transform='translateY(-2px)'"
           onmouseout="this.style.borderColor='rgba(255,255,255,0.07)';this.style.transform=''">
        <div style="padding:16px 18px;border-bottom:1px solid rgba(255,255,255,0.05)">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
            <span style="font-size:0.7rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;padding:4px 10px;border-radius:20px;background:rgba(26,111,212,.15);color:#3A8FFF">${t.format||'Tournament'}</span>
            <span style="font-size:0.75rem;font-weight:600;color:${statusColor}">${statusDot}</span>
          </div>
          <div style="font-size:1.05rem;font-weight:700;color:var(--text);margin-bottom:4px">${t.name||t.key}</div>
          <div style="font-size:0.78rem;color:var(--text-muted)">${t.date||''}${t.time?' · '+t.time:''}</div>
        </div>
        <div style="padding:12px 18px">
          <div style="display:flex;gap:16px;font-size:0.78rem;color:var(--text-muted);margin-bottom:10px">
            <span>🎾 ${sport}</span>
            <span>👥 ${t.players||'?'} players</span>
            <span>🏟️ ${t.courts||'?'} courts</span>
          </div>
          ${t.rounds ? `
          <div style="display:flex;justify-content:space-between;font-size:0.72rem;color:var(--text-muted);margin-bottom:4px">
            <span>Rounds</span><span>${t.roundsDone||0} / ${t.rounds}</span>
          </div>
          <div style="background:rgba(255,255,255,0.08);border-radius:4px;height:5px;overflow:hidden">
            <div style="height:100%;width:${progress}%;background:${progress===100?'#7DC515':'#3A8FFF'};border-radius:4px;transition:width .4s"></div>
          </div>` : ''}
          ${standingsHtml}
        </div>
      </div>
    </a>`;
  }).join('');
}

function buildGuideTableHTML() {
  const rows = RATING_GUIDE.map(r => {
    const bc = bandColor(r.band);
    return `
    <tr class="${r.tier}">
      <td><span class="gr-range">${r.range}</span></td>
      <td><span style="display:inline-block;padding:2px 9px;border-radius:20px;font-size:0.72rem;font-weight:700;background:${bc.bg};color:${bc.color}">${r.band}</span></td>
      <td class="gr-desc">${r.desc}</td>
    </tr>`;
  }).join('');
  return `<div class="guide-table-wrap">
    <table class="guide-table">
      <thead><tr>
        <th>DSR Range</th>
        <th>Band</th>
        <th>What it means</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>
  <div style="font-size:0.72rem;color:var(--muted);margin-top:8px;padding:0 2px">
    DSR = Deuce &amp; Smash Rating · Scale 0–7 · Aligned with Playtomic Level system
  </div>`;
}

window.toggleGuide = (which) => {
  const btn = document.getElementById(`guide-toggle-${which}`);
  const panel = document.getElementById(`guide-panel-${which}`);
  const tableEl = document.getElementById(`guide-table-${which}`);
  const isOpen = panel.classList.contains('open');
  if (!isOpen && !tableEl.innerHTML) tableEl.innerHTML = buildGuideTableHTML();
  panel.classList.toggle('open', !isOpen);
  btn.classList.toggle('open', !isOpen);
};

// ===== Skill Assessment Wizard =====
const ASSESS_QUESTIONS = [
  {
    q: 'What is your racquet sport background?',
    hint: 'Include any sport — tennis, badminton, squash, table tennis, padel, pickleball…',
    opts: [
      { label: 'Complete beginner', desc: 'Never played any racquet sport before', score: 0 },
      { label: 'Casual player', desc: 'Played a little for fun — no real training', score: 1.0 },
      { label: 'Some experience', desc: 'A few months of lessons or regular casual play', score: 2.0 },
      { label: 'Experienced player', desc: '1–3 years regular play with proper technique', score: 3.5 },
      { label: 'Competitive background', desc: '3+ years, plays / played club level or tournaments', score: 5.5 },
    ]
  },
  {
    q: 'How long have you been playing padel or pickleball specifically?',
    hint: 'Focus on padel/pickleball — not other racquet sports',
    opts: [
      { label: 'Never played', desc: 'This would be my very first session', score: 0 },
      { label: 'Less than 6 months', desc: 'Still learning the basics of the game', score: 1.0 },
      { label: '6 months – 1 year', desc: 'Getting comfortable with the game', score: 2.0 },
      { label: '1 – 3 years', desc: 'Reasonably consistent, know the game well', score: 3.5 },
      { label: '3+ years', desc: 'Very experienced, plays regularly and competitively', score: 5.5 },
    ]
  },
  {
    q: 'How would you describe your stroke technique?',
    hint: 'Be honest — this helps get the most accurate rating',
    opts: [
      { label: 'Can\'t rally yet', desc: 'Still making contact consistently is a challenge', score: 0 },
      { label: 'Basic strokes only', desc: 'Can rally but technique is rough, many errors', score: 1.0 },
      { label: 'Solid basic strokes', desc: 'Consistent forehand/backhand, can sustain a rally', score: 2.5 },
      { label: 'Good technique', desc: 'Controls direction and pace, few unforced errors', score: 4.0 },
      { label: 'Masters all strokes', desc: 'Topspin, slice, volleys, lobs — full toolkit, high control', score: 6.0 },
    ]
  },
  {
    q: 'How would you describe your tactical understanding of the game?',
    hint: 'Tactics = positioning, shot selection, reading the opponent',
    opts: [
      { label: 'No tactical awareness', desc: 'Just trying to get the ball back over the net', score: 0 },
      { label: 'Basic tactics', desc: 'Aware of basic positioning but mostly reactive', score: 1.5 },
      { label: 'Developing tactics', desc: 'Plays angles, uses different shots, starting to read play', score: 3.0 },
      { label: 'Good tactical player', desc: 'Constructs points, varies play, reads opponents well', score: 5.0 },
      { label: 'High tactical mindset', desc: 'Exploits weaknesses, dominates tactically, dictates rallies', score: 6.5 },
    ]
  },
  {
    q: 'What best describes your match play experience?',
    hint: 'Competitive matches — not just social/fun games',
    opts: [
      { label: 'Never played a match', desc: 'Only practised or played social/fun games', score: 0 },
      { label: 'A few social matches', desc: 'Played casually with friends, not competitive', score: 1.5 },
      { label: 'Regular club/social matches', desc: 'Plays matches regularly at club or social level', score: 3.0 },
      { label: 'Club competitive level', desc: 'Competes in club leagues or local tournaments', score: 5.0 },
      { label: 'Tournament / high level', desc: 'Plays in open or ranked tournaments, wins regularly', score: 7.0 },
    ]
  },
];

const ASSESS_BANDS = [
  { max: 0.8,  band: 'Initiation',            desc: 'Just starting out — never played or brand new to racquet sports' },
  { max: 1.5,  band: 'Initiation',            desc: 'Very early stage — some exposure but still learning the very basics' },
  { max: 2.2,  band: 'Initiation–Intermediate', desc: 'Getting started — a few months of play, developing basic consistency' },
  { max: 3.2,  band: 'Intermediate',          desc: 'Solid foundations — can rally, basic tactical understanding' },
  { max: 4.2,  band: 'Intermediate',          desc: 'Good intermediate player — consistent strokes, plays tactically' },
  { max: 4.8,  band: 'Intermediate High',     desc: 'Strong player — few unforced errors, constructs points well' },
  { max: 5.3,  band: 'Intermediate Advanced', desc: 'High-intermediate — strong tactical game, competitive at club level' },
  { max: 6.2,  band: 'Advanced',              desc: 'Advanced player — dominates technically and tactically' },
  { max: 7.0,  band: 'Elite',                 desc: 'Elite / Professional level' },
];

let assessTarget = 'new'; // 'new' | 'edit'
let assessAnswers = [];
let assessStep = 0;

function assessBandInfo(rating) {
  return ASSESS_BANDS.find(b => rating <= b.max) || ASSESS_BANDS[ASSESS_BANDS.length - 1];
}

function calcAssessRating() {
  if (assessAnswers.length === 0) return 0;
  // Weighted average: Q3 (strokes) and Q4 (tactics) count double, others single
  const weights = [1, 1, 2, 2, 1];
  let total = 0, wSum = 0;
  assessAnswers.forEach((score, i) => {
    const w = weights[i] || 1;
    total += score * w;
    wSum += w;
  });
  const raw = total / wSum;
  // Round to nearest 0.25
  return Math.round(raw * 4) / 4;
}

window.openAssess = (target) => {
  assessTarget = target;
  assessAnswers = [];
  assessStep = 0;
  document.getElementById('assess-overlay').classList.add('open');
  renderAssessStep();
};

window.closeAssess = () => {
  document.getElementById('assess-overlay').classList.remove('open');
};

function renderAssessPips() {
  const total = ASSESS_QUESTIONS.length;
  return Array.from({length: total}, (_, i) => {
    const cls = i < assessAnswers.length ? 'done' : i === assessStep ? 'active' : '';
    return `<div class="assess-pip ${cls}"></div>`;
  }).join('');
}

function renderAssessStep() {
  const overlay = document.getElementById('assess-overlay');
  if (!overlay.classList.contains('open')) return;

  document.getElementById('assess-progress').innerHTML = renderAssessPips();

  if (assessStep >= ASSESS_QUESTIONS.length) {
    renderAssessResult();
    return;
  }

  const q = ASSESS_QUESTIONS[assessStep];
  const body = document.getElementById('assess-body');
  body.innerHTML = `
    <div class="assess-q">Q${assessStep + 1} of ${ASSESS_QUESTIONS.length}: ${q.q}</div>
    <div class="assess-hint">${q.hint}</div>
    <div class="assess-options">
      ${q.opts.map((o, i) => `
        <button class="assess-opt" onclick="selectAssessOpt(${i})">
          <div class="assess-opt-label">${o.label}</div>
          <div class="assess-opt-desc">${o.desc}</div>
        </button>`).join('')}
    </div>`;

  const footer = document.getElementById('assess-footer');
  footer.innerHTML = `
    <button class="btn btn-secondary" onclick="closeAssess()">Cancel</button>
    <span style="font-size:0.8rem;color:var(--muted)">Select an answer to continue</span>`;
}

window.selectAssessOpt = (optIndex) => {
  const q = ASSESS_QUESTIONS[assessStep];
  const score = q.opts[optIndex].score;
  assessAnswers[assessStep] = score;

  // Highlight selected
  const opts = document.querySelectorAll('.assess-opt');
  opts.forEach((el, i) => el.classList.toggle('selected', i === optIndex));

  // Auto-advance after brief highlight
  setTimeout(() => {
    assessStep++;
    renderAssessStep();
  }, 320);
};

function renderAssessResult() {
  const rating = calcAssessRating();
  const info = assessBandInfo(rating);
  const qLabels = ['Racquet Background', 'Padel/Pickleball Experience', 'Stroke Technique', 'Tactical Understanding', 'Match Play'];
  const weightNote = ['(1×)', '(1×)', '(2×)', '(2×)', '(1×)'];

  document.getElementById('assess-body').innerHTML = `
    <div class="assess-result">
      <div style="font-size:0.85rem;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:1px">Suggested Rating</div>
      <div class="assess-result-num">${rating.toFixed(2)}</div>
      <div class="assess-result-band">${info.band}</div>
      <div class="assess-result-desc">${info.desc}</div>
      <div class="assess-result-breakdown">
        <div style="font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);margin-bottom:8px">Score Breakdown</div>
        ${assessAnswers.map((score, i) => `
          <div class="assess-result-row">
            <span>${qLabels[i]} <span style="color:var(--muted);font-size:0.72rem">${weightNote[i]}</span></span>
            <span style="color:var(--accent);font-weight:700">${score.toFixed(1)}</span>
          </div>`).join('')}
      </div>
    </div>`;

  document.getElementById('assess-footer').innerHTML = `
    <button class="btn btn-secondary" onclick="assessStep=0;assessAnswers=[];renderAssessStep()">↩ Redo</button>
    <div style="display:flex;gap:10px">
      <button class="btn btn-secondary" onclick="closeAssess()">Discard</button>
      <button class="btn btn-primary" onclick="applyAssessRating(${rating})">✓ Use ${rating.toFixed(2)}</button>
    </div>`;
}

window.applyAssessRating = (rating) => {
  if (assessTarget === 'new') {
    const el = document.getElementById('new-rating');
    if (el) el.value = rating.toFixed(2);
  } else {
    const el = document.getElementById('edit-rating');
    if (el) el.value = rating.toFixed(2);
  }
  closeAssess();
  showToast(`Rating set to ${rating.toFixed(2)} ✓`, 'ok');
};

// ===== Toast =====
window.showToast = (msg, type='ok', dur=2500) => {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `show ${type}`;
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), dur);
};
</script>
