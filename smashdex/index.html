<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SmashDex — by Deuce &amp; Smash</title>
<meta name="description" content="SmashDex by Deuce & Smash: your SDX Rating, match history and Matchup Dex.">
<meta property="og:title" content="SmashDex — by Deuce & Smash">
<meta property="og:description" content="Your SDX Rating. Your rivals. Your record.">
<meta name="theme-color" content="#0E0E2C">
<link rel="icon" type="image/png" href="/assets/smashdex/favicon-64.png">
<link rel="apple-touch-icon" href="/assets/smashdex/apple-touch-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0E0E2C; --deep:#17173F; --line:rgba(237,237,247,.12); --line2:rgba(237,237,247,.22);
  --text:#EDEDF7; --muted:rgba(237,237,247,.62); --faint:rgba(237,237,247,.38);
  --yellow:#F5D628; --green:#7DC515; --orange:#E05A00; --blue:#1A6FD4;
  --head:'Bebas Neue',Impact,sans-serif; --ui:'Barlow',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--navy);color:var(--text);font-family:var(--ui);font-size:16px;line-height:1.5;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--yellow)}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px;border-radius:6px}
.hidden{display:none!important}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Split-flap tiles: Night Court. --h on the container sets the size */
.tiles{display:inline-flex;align-items:center;gap:calc(var(--h) * .07);--top:#2A2A60;--bot:#1E1E4A;--fg:#E2E41F}
.flap{--r:calc(var(--h) * .087);--half:144ms;position:relative;display:inline-block;flex:none;width:calc(var(--h) * .69);height:var(--h);perspective:calc(var(--h) * 4)}
.flap.dx{--fg:#5AA6F7} .flap.dg{--fg:#F5D628} .flap.gapL{margin-left:calc(var(--h) * .1)}
.flap>span{position:absolute;left:0;right:0;height:50%;overflow:hidden}
.flap>.t,.flap>.ft{top:0;background:var(--top);border-radius:var(--r) var(--r) 0 0}
.flap>.b,.flap>.fb{bottom:0;background:var(--bot);border-radius:0 0 var(--r) var(--r)}
.flap>.b{box-shadow:0 2px 0 rgba(0,0,0,.45)}
.flap i{display:flex;align-items:center;justify-content:center;height:var(--h);padding-top:calc(var(--h) * .09);box-sizing:border-box;font:400 calc(var(--h) * .885)/1 var(--head);font-style:normal;color:var(--fg)}
.flap>.b i,.flap>.fb i{margin-top:calc(var(--h) / -2)}
.flap>.ft{transform-origin:50% 100%;backface-visibility:hidden}
.flap>.fb{transform-origin:50% 0;backface-visibility:hidden}
.flap::after{content:"";position:absolute;left:0;right:0;top:calc(50% - 1px);height:2px;background:#07071A}
.flap.go>.ft{animation:flapT var(--half) cubic-bezier(.55,0,.9,.4) both}
.flap.go>.fb{animation:flapB var(--half) cubic-bezier(.2,.9,.35,1.15) var(--half) both}
@keyframes flapT{from{transform:rotateX(0deg);filter:brightness(1)}to{transform:rotateX(-90deg);filter:brightness(.5)}}
@keyframes flapB{from{transform:rotateX(90deg);filter:brightness(1.4)}to{transform:rotateX(0deg);filter:brightness(1)}}
@media (prefers-reduced-motion:reduce){.flap.go>.ft,.flap.go>.fb{animation:none}}
.tiles .dot{flex:none;width:calc(var(--h) * .22);height:var(--h);display:flex;align-items:flex-end;justify-content:center;padding-bottom:calc(var(--h) * .12);box-sizing:border-box}
.tiles .dot::before{content:"";width:calc(var(--h) * .13);height:calc(var(--h) * .13);border-radius:2px;background:#F5D628}
.gate-logo{--h:min(58px, calc((100vw - 64px) / 6.3));margin:14px 0 10px}
.bar .tiles{--h:22px}
@media (max-width:370px){.bar img{display:none}}
.sdx .score .tiles{--h:clamp(42px, 12.4vw, 62px)}
.wrap{max-width:520px;margin:0 auto;padding:0 18px calc(96px + env(safe-area-inset-bottom))}

.bar{position:sticky;top:0;z-index:20;background:rgba(14,14,44,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar-in{max-width:520px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:10px}
.bar img{height:22px;display:block}
.bar .app{font-family:var(--head);font-size:24px;letter-spacing:.02em;line-height:1}
.bar .app b{color:var(--yellow);font-weight:400}
.bar .sp{flex:1}
.icon-btn{background:none;border:1px solid var(--line2);border-radius:999px;padding:6px 12px;font-size:14px;color:var(--muted)}

.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 20px}
.gate-in{width:100%;max-width:380px;text-align:center}
.gate-in .logo{width:230px;max-width:70%;display:block;margin:0 auto 4px}
.gate-in h1{font-family:var(--head);font-weight:400;font-size:clamp(56px,19vw,84px);line-height:.9;margin:6px 0 4px}
.gate-in h1 b{color:var(--yellow);font-weight:400}
.gate-in p.lead{color:var(--muted);margin-bottom:26px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:transparent;border-radius:12px;padding:12px 16px;font-weight:600}
.btn.full{width:100%}
.btn.primary{background:var(--yellow);color:var(--navy);border-color:var(--yellow)}
.btn.danger{background:var(--orange);border-color:var(--orange);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.or{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:14px;margin:18px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.field{display:block;text-align:left;margin-bottom:12px}
.field span{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
.field input,.field select{width:100%;background:var(--deep);border:1px solid var(--line2);border-radius:10px;padding:11px 12px;color:var(--text);outline:none}
.field input:focus,.field select:focus{border-color:var(--yellow)}
.msg{min-height:22px;font-size:14px;margin-top:10px;color:var(--muted)}
.msg.err{color:#ff9a6b}
.note{font-size:13px;color:var(--muted);text-align:left;margin:-4px 0 14px;line-height:1.45}
.step{display:inline-block;font-size:13px;font-weight:600;color:var(--navy);background:var(--yellow);border-radius:999px;padding:2px 10px;margin-bottom:10px}
fieldset.q{border:0;text-align:left;margin:4px 0 14px}
fieldset.q legend{font-size:14px;color:var(--muted);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{position:relative}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips span{display:inline-block;border:1px solid var(--line2);border-radius:999px;padding:7px 12px;font-size:14px;cursor:pointer}
.chips input:checked+span{border-color:var(--yellow);background:rgba(245,214,40,.12);color:var(--yellow)}
.chips input:focus-visible+span{outline:2px solid var(--yellow);outline-offset:2px}
.linkish{background:none;border:0;color:var(--yellow);text-decoration:underline;font-size:14px;padding:4px}

.who{display:flex;align-items:center;gap:14px;padding:22px 0 16px}
.av{flex:none;width:64px;height:64px;border-radius:50%;background:var(--deep);border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;font-family:var(--head);font-size:28px;letter-spacing:.04em}
.av.sm{width:30px;height:30px;font-size:14px;border-width:1px}
.who h2{font-size:22px;font-weight:700;line-height:1.15}
.who .sub{color:var(--muted);font-size:14px}
.who .edit{margin-left:auto;padding:8px 14px}
.pgrid>.sec{min-width:0}

/* The SDX scorecard: the one loud element on the page */
.sdx{position:relative;display:block;width:100%;text-align:left;border:1px solid rgba(245,214,40,.35);border-radius:22px;padding:22px 22px 18px;background:linear-gradient(180deg,rgba(26,111,212,.18),rgba(14,14,44,0) 70%),var(--deep);overflow:hidden;color:var(--text)}
.sdx .k{position:relative;font-size:15px;color:var(--muted)}
.sdx .score{position:relative;display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;margin:8px 0 10px}
.sdx .mv{font-family:var(--head);font-size:28px;line-height:1;padding-top:4px}
.up{color:var(--green)} .down{color:#ff8a4c}
.sdx .persona{position:relative;font-weight:700;font-size:18px}
.sdx .line{position:relative;color:var(--muted);font-size:15px}
.sdx .foot{position:relative;display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.chip{display:inline-block;border-radius:999px;padding:1px 10px;font-size:13px;font-weight:700;border:1px solid currentColor}
.chip.Low{color:#ff9a6b} .chip.Medium{color:var(--yellow)} .chip.High{color:var(--green)}
.sdx::before{content:"";position:absolute;right:-30px;bottom:-40px;width:214px;height:250px;background:url(/assets/smashdex/mascot-ghost.webp) no-repeat center/contain;opacity:.04;transform:rotate(-7deg);pointer-events:none}
.sdx .more{margin-left:auto;display:inline-flex;align-items:center;gap:10px;color:var(--yellow);font-weight:600}
.sdx .go{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--yellow);color:var(--navy);transition:transform .2s ease}
.sdx .go svg{width:18px;height:18px}
.sdx:hover .go,.sdx:focus-visible .go{transform:translateX(3px)}
@media (prefers-reduced-motion:reduce){.sdx .go{transition:none}}

/* SDX explainer: topic cards */
.sx-top{display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px;margin:10px 0 4px}
.sx-top .n{font-family:var(--head);font-size:34px;line-height:1;color:var(--yellow)}
.grp{font-size:13px;font-weight:600;color:var(--muted);margin:22px 0 10px}
.tcards{display:grid;gap:10px}
.tc{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:14px;width:100%;text-align:left;border:1px solid var(--line2);border-radius:16px;padding:14px 14px 14px 12px;background:var(--deep);color:var(--text);transition:border-color .15s ease}
.tc:hover,.tc:focus-visible{border-color:var(--yellow)}
.tc-ic{position:relative;display:grid;place-items:center;width:44px;height:44px;border-radius:9px;background:linear-gradient(180deg,#2A2A60 0 50%,#1E1E4A 50% 100%);color:var(--yellow);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.tc-ic::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:#07071A}
.tc-ic svg{position:relative;z-index:1;width:22px;height:22px}
.tc-t b{display:block;font-size:16px}
.tc-t span{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.tc-r{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;white-space:nowrap}
.tc-r svg{width:18px;height:18px;color:var(--yellow)}
.tc.dim .tc-ic{color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--yellow);font-weight:600;font-size:15px;padding:4px 0;margin-bottom:10px}
.back svg{width:16px;height:16px}
.fcards{display:grid;gap:10px;margin-top:12px}
.fc{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:rgba(23,23,63,.6)}
.fc b{display:block}
.fc span{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.meter{height:10px;border-radius:999px;background:var(--deep);border:1px solid var(--line);overflow:hidden;margin:10px 0 6px}
.meter i{display:block;height:100%;border-radius:999px;background:var(--yellow)}
.meter.Low i{background:#ff9a6b}.meter.High i{background:var(--green)}

/* Preference editor */
.pq{border:0;margin:0 0 18px}
.pq legend{font-size:14px;color:var(--muted);margin-bottom:8px}
.pq .hint{font-size:13px;color:var(--faint);margin-top:6px}
.sides{display:grid;gap:8px}
.sides label{position:relative;display:block}
.sides input{position:absolute;opacity:0;pointer-events:none}
.sides .card{display:block;border:1px solid var(--line2);border-radius:14px;padding:12px 14px;cursor:pointer}
.sides .card b{display:block}
.sides .card small{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.sides input:checked+.card{border-color:var(--yellow);background:rgba(245,214,40,.08)}
.sides input:checked+.card b{color:var(--yellow)}
.sides input:focus-visible+.card{outline:2px solid var(--yellow);outline-offset:2px}
.pref .note{display:block;font-size:13px;font-weight:400;color:var(--muted);margin-top:2px}

.sec{margin-top:30px}
.sec-h{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;margin-bottom:10px}
.sec-h h3{font-family:var(--head);font-weight:400;font-size:30px;letter-spacing:.02em;line-height:1}
.sec-h .aside{margin-left:auto;font-size:14px;color:var(--muted)}
.form-line{margin-top:12px;font-size:15px;color:var(--text);padding-left:12px;border-left:3px solid var(--yellow)}

.strip{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:18px}
.strip div{padding:12px 4px;text-align:center}
.strip div+div{border-left:1px solid var(--line)}
.strip b{display:block;font-family:var(--head);font-weight:400;font-size:34px;line-height:1}
.strip span{font-size:13px;color:var(--muted)}

.seg{display:inline-flex;border:1px solid var(--line2);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:4px 12px;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--text);color:var(--navy);font-weight:600}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .tip{margin-top:8px;border:1px solid var(--line2);border-radius:14px;padding:12px 14px;font-size:14px;background:var(--deep)}
.tip .t1{display:flex;gap:8px;align-items:baseline}
.tip .t1 b{font-size:15px}
.tip .t1 .d{margin-left:auto;font-family:var(--head);font-size:22px}

.m{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"when res" "teams sets";gap:6px 12px;padding:14px 0;border-top:1px solid var(--line)}
.m .when{grid-area:when;font-size:13px;color:var(--muted);display:flex;gap:10px}
.m .res{grid-area:res;text-align:right;font-weight:700;font-size:13px}
.m .teams{grid-area:teams}
.m .sets{grid-area:sets}
.m .teams{display:grid;gap:6px;min-width:0}
.m .team{display:flex;align-items:center;gap:6px;font-size:15px;min-width:0;height:30px}
.m .team span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m .team.me{font-weight:700}
.m .sets{display:grid;grid-auto-flow:column;grid-template-rows:30px 30px;gap:6px 8px;align-items:center;justify-items:end}
/* Scoreboard tiles for every score (static, same look as the logo) */
.st{--sh:26px;display:inline-flex;gap:2px;vertical-align:middle}
.st i{position:relative;display:inline-flex;align-items:center;justify-content:center;width:calc(var(--sh) * .69);height:var(--sh);border-radius:calc(var(--sh) * .14);background:linear-gradient(180deg,#2A2A60 0%,#2A2A60 50%,#1E1E4A 50%,#1E1E4A 100%);box-shadow:0 2px 0 rgba(0,0,0,.4);padding-top:calc(var(--sh) * .09);box-sizing:border-box;font:400 calc(var(--sh) * .885)/1 var(--head);font-style:normal;color:#F5D628}
.st i::after{content:"";position:absolute;left:0;right:0;top:calc(50% - 1px);height:1.5px;background:#07071A}
.st.lo i{color:rgba(237,237,247,.42)}
.st.even i{color:var(--text)}
.score-line{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:6px 0 2px}
.score-pair{display:inline-flex;align-items:center;gap:5px}
.score-pair .dash{color:var(--faint);font-weight:600}
.tip .st{--sh:22px}
.pending{color:var(--yellow);font-weight:600}

.stat{display:flex;align-items:center;gap:18px}
.ring{flex:none}
.stat dl{display:grid;grid-template-columns:auto auto;gap:4px 18px;font-size:15px}
.stat dt{color:var(--muted)} .stat dd{font-weight:700}

.pref{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.pref .ic{width:28px;text-align:center;font-size:20px}
.pref .l{font-size:13px;color:var(--muted)}
.pref .v{font-weight:600}
.people{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.person{text-align:left;border:1px solid var(--line);border-radius:16px;padding:12px;background:none;color:var(--text)}
.person .nm{font-weight:700;margin-top:8px;line-height:1.2}
.person .ps{font-size:13px;color:var(--muted)}
.clubs{display:flex;flex-wrap:wrap;gap:10px}
.club{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 6px}
.club .ini{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--head);font-size:15px;background:var(--blue)}
.club.home .ini{background:var(--yellow);color:var(--navy)}
.empty{color:var(--muted);font-size:15px;padding:10px 0}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(14,14,44,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{background:none;border:0;padding:10px 4px 12px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.nav-brand,.nav-me{display:none}
.nav button svg{display:block}
.nav button.on{color:var(--yellow)}
.soon{padding:60px 10px;text-align:center}
.soon h3{font-family:var(--head);font-weight:400;font-size:44px;line-height:1}
.soon p{color:var(--muted);max-width:340px;margin:8px auto 0}

.sheet{position:fixed;inset:0;z-index:40;background:rgba(5,5,20,.65);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{position:relative;width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--navy);border:1px solid var(--line2);border-bottom:0;border-radius:24px 24px 0 0;padding:10px 20px calc(28px + env(safe-area-inset-bottom));animation:rise .22s ease-out}
@keyframes rise{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet-in{animation:none}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line2);margin:0 auto 14px}
.sheet h2{font-family:var(--head);font-weight:400;font-size:40px;line-height:1;padding-right:44px}
.sheet h4{font-size:17px;margin:24px 0 8px}
.sheet p{color:var(--muted);font-size:15px;margin-bottom:8px}
.sheet .close{position:sticky;top:0;float:right;background:var(--deep);border:1px solid var(--line2);border-radius:999px;width:36px;height:36px;font-size:16px;z-index:2}
.lv{display:grid;grid-template-columns:56px 1fr;gap:4px 12px;padding:12px 0;border-top:1px solid var(--line)}
.lv .rg{font-family:var(--head);font-size:24px;line-height:1.1;color:var(--muted)}
.lv b{display:block}
.lv span{font-size:14px;color:var(--muted)}
.lv.cur{background:rgba(245,214,40,.06);margin:0 -10px;padding:12px 10px;border-radius:12px}
.lv.cur .rg{color:var(--yellow)}
.lv .here{color:var(--yellow);font-weight:600;font-size:13px}
.factor{padding:10px 0;border-top:1px solid var(--line)}
.factor b{display:block}
.factor span{font-size:14px;color:var(--muted)}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line2);border-radius:14px;padding:14px;background:none;color:var(--text);margin-bottom:10px}
.opt .ic{font-size:22px;width:28px;text-align:center}
.opt .sub{display:block;font-size:13px;color:var(--muted)}
.warn{border-left:3px solid #ff8a4c;padding:8px 12px;margin:12px 0;font-size:15px;color:var(--text)}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}
.pick button{border:1px solid var(--line2);border-radius:12px;padding:10px;background:none;color:var(--text);text-align:left}
.pick button.on{border-color:var(--yellow);background:rgba(245,214,40,.08)}
.pick b{display:block;font-family:var(--head);font-weight:400;font-size:26px;line-height:1}
.pick span{font-size:13px;color:var(--muted)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px;margin:12px 0}

/* ── Split-flap logo and score (Night Court, 300 ms per flip) ── */
const FLIP_MS = 300, INTRO_FLIP_MS = 300, INTRO_HOLD_MS = 1000, IDLE_AFTER_MS = 10000, IDLE_EVERY_MS = 20000, IDLE_MAX_RUNS = 5;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const flapHTML = (ch, cls = '') => `<span class="flap ${cls}" data-c="${ch}" data-final="${ch}"><span class="t"><i>${ch}</i></span><span class="b"><i>${ch}</i></span><span class="ft"><i>${ch}</i></span><span class="fb"><i>${ch}</i></span></span>`;

const digitsHTML = str => str.split('').map(c => c === '.' ? '<span class="dot"></span>' : flapHTML(c, 'dg')).join('');
function setFlap(el, ch, ms = FLIP_MS) {
  el.style.setProperty('--half', Math.round(ms / 2) - 6 + 'ms');
  const prev = el.dataset.c, [t, b, ft, fb] = el.children;
  t.firstChild.textContent = ch; fb.firstChild.textContent = ch;
  b.firstChild.textContent = REDUCED ? ch : prev; ft.firstChild.textContent = REDUCED ? ch : prev;
  el.dataset.c = ch;
  if (REDUCED) return;
  el.classList.remove('go'); void el.offsetWidth; el.classList.add('go');
}
const _flapTimers = new Map();
function playFlap(el, seq, start, ms = FLIP_MS) {
  (_flapTimers.get(el) || []).forEach(clearTimeout);
  _flapTimers.set(el, seq.map((ch, k) => setTimeout(() => setFlap(el, ch, ms), start + k * ms)));
  return start + seq.length * ms;
}
let _lastLogoRun = 0, _idleRuns = 0, _lastInput = Date.now();
// Returns how long until the last tile lands (ms)
function runLogo(root, { intro = false } = {}) {
  if (!root || REDUCED) return 0;
  _lastLogoRun = Date.now();
  const AZ = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', ms = intro ? INTRO_FLIP_MS : FLIP_MS;
  let end = 0;
  root.querySelectorAll('.flap').forEach((el, i) => {
    const final = el.dataset.final || 'SMASHDEX'[i];
    const n = intro ? 2 + Math.floor(i / 4) : 3 + i;
    const seq = Array.from({ length: n }, () => AZ[Math.floor(Math.random() * 26)]).concat(final);
    end = Math.max(end, playFlap(el, seq, i * (intro ? 110 : 70), ms));
  });
  return end;
}
// SDX digits flip only when the score changes, counting through the digits in between
function animateSdx(target) {
  const box = document.getElementById('sdxDigits'); if (!box) return;
  const shown = S.shownSdx; S.shownSdx = target;
  if (shown == null || shown === target) return;
  const up = +target > +shown;
  box.querySelectorAll('.flap').forEach((el, k) => {
    const pos = [0, 2, 3, 4][k], from = shown[pos], to = target[pos];
    if (from === to) return;
    const seq = []; let c = +from;
    while (String(c) !== to && seq.length < 10) { c = (c + (up ? 1 : 9)) % 10; seq.push(String(c)); }
    playFlap(el, seq, k * 90);
  });
}

const _ss = { get(k) { try { return sessionStorage.getItem(k); } catch { return null; } }, set(k, v) { try { sessionStorage.setItem(k, v); } catch {} } };
function track(ev, { once = false } = {}) {

    if (!S.user) return;

    const day = todayLocal(), upd = { [`analytics/daily/${day}/events/${ev}`]: increment(1) };

// A visit = opening SmashDex, or coming back after 30+ minutes away
function trackVisit() {
  if (!S.mid) return;
  const last = +(_ss.get('sdx_last') || 0), nowMs = Date.now();
  _ss.set('sdx_last', String(nowMs));
  if (nowMs - last < 30 * 60 * 1000) return;
  const day = todayLocal();
  const upd = { [`analytics/members/${S.mid}/visits`]: increment(1), [`analytics/members/${S.mid}/lastSeen`]: nowMs,
    [`analytics/daily/${day}/visits`]: increment(1), [`analytics/daily/${day}/users/${S.mid}`]: true };

  get(ref(db, `analytics/members/${S.mid}/firstSeen`)).then(sn => { if (!sn.exists()) set(ref(db, `analytics/members/${S.mid}/firstSeen`), nowMs).catch(() => {}); }).catch(() => {});
}

let _io = null;
function watchSections() {
  if (!('IntersectionObserver' in window)) return;
  _io?.disconnect();
  _io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { track('see_' + e.target.dataset.sec, { once: true }); _io.unobserve(e.target); } }), { threshold: 0.4 });

}

/* ── Compute: same engine and inputs as the staff tool ── */
let _t = null;
function schedule() { clearTimeout(_t); _t = setTimeout(compute, 120); }
function compute() {
  if (!(S.ready.profiles && S.ready.matches && S.ready.adjustments && S.ready.subs)) return;
  const P = S.profiles, nameOf = id => P[id]?.name;
  const ms = Object.entries(S.matches).map(([id, m]) => {
    const x = { id, ...m };
    if (Array.isArray(x.teamA) && Array.isArray(x.teamAIds)) x.teamA = x.teamA.map((n, i) => nameOf(x.teamAIds[i]) || n);
    if (Array.isArray(x.teamB) && Array.isArray(x.teamBIds)) x.teamB = x.teamB.map((n, i) => nameOf(x.teamBIds[i]) || n);
    return x;
  });
  const seeds = {};
  for (const p of Object.values(P)) if (p && p.seed != null && p.name) seeds[p.name] = { seed: +p.seed, assessedAt: p.seedFrom || null };
  const adj = [];
  for (const [mid, a] of Object.entries(S.adjustments)) {
    const name = nameOf(mid); if (!name) continue;
    if (a.self) adj.push({ ...a.self, name, by: 'self', id: `${mid}-self` });
    for (const [k, x] of Object.entries(a.admin || {})) adj.push({ ...x, name, by: 'admin', id: `${mid}-${k}` });
  }
  // Member-recorded scores count once confirmed, or 24 hours after submission with no dispute
  S.dups = markDuplicates(S.subs, S.matches); // sets already recorded elsewhere are held back
  const sx = subsToMatches(S.subs, id => P[id]?.name, Date.now(), { dups: S.dups });
  for (const [k, v] of Object.entries(sx.seeds)) if (!seeds[k]) seeds[k] = v;
  S.newSeeds = sx.seeds; S._seeds = seeds; S._adj = adj; S._base = ms;
  S.ratings = DSR.compute(seeds, ms.concat(sx.matches), todayUTC(), adj).players;
  S.ms = ms.concat(sx.matches);
  S._preview = {};
  buildPre();
  buildOutcomes();
  const firstShow = $('#app').classList.contains('hidden');
  // First time in: let the landed logo sit for a moment before opening the profile
  const wait = firstShow ? _introReadyAt - Date.now() : 0;
  if (wait > 0) { clearTimeout(_t); _t = setTimeout(compute, wait); return; }
  $('#gate').classList.add('hidden'); $('#app').classList.remove('hidden');
  render();
  maybePopup();
}

  S.pre = pre;

const staffLink = (me, p) => waLink(`Hi Deuce & Smash, I'd like my SmashDex level reviewed. Name: ${me}, ${dexLabel(S.profiles[S.mid]?.dexNo)}, current SDX ${sdx(p.r)}.`);

function openSheet(kind, arg) {
  track({ sdx: 'sdx_explainer', 'sdx-levels': 'sdx_levels', 'sdx-conf': 'sdx_confidence', 'sdx-moves': 'sdx_moves', raise: 'raise_info', lower: 'lower_info', edit: 'edit_open', prefs: 'prefs_open', player: 'player_card' }[kind] || kind);
  const me = myName(), p = playerOf(me), b = bandOf(p.r), conf = p.confidence || 0, cl = DSR.confidenceLabel(conf);
  const backBtn = `<button class="back" data-open="sdx">${ICON.back}Your SDX</button>`;
  const tc = (open, ic, title, desc, right = '', dim = false) => `<button class="tc${dim ? ' dim' : ''}" data-open="${open}"><span class="tc-ic">${ICON[ic]}</span><span class="tc-t"><b>${title}</b><span>${desc}</span></span><span class="tc-r">${right}${ICON.chev}</span></button>`;
  const used = S.adjustments[S.mid]?.self;
  if (kind === 'sdx') return sheet(`
    <h2>Your SDX Rating</h2>
    <div class="sx-top"><span class="n">SDX ${sdx(p.r)}</span><span><b>${esc(b.persona)}</b> <span style="color:var(--muted)">· ${esc(b.band)}</span></span></div>
    <p>Your SDX runs from 0 to 7 and moves with every confirmed set you play.</p>

    <h4 class="grp">Understand your SDX</h4>
    <div class="tcards">
      ${tc('sdx-levels', 'levels', 'SDX levels', `Seven levels, from ${esc(BANDS[0].persona)} to ${esc(BANDS[BANDS.length - 1].persona)}.`, `${b.lo}–${b.lo + 1}`)}
      ${tc('sdx-conf', 'conf', 'Confidence', 'How settled your rating is, and what firms it up.', `<span class="chip ${cl}">${conf}%</span>`)}
      ${tc('sdx-moves', 'moves', 'What moves your SDX', 'Results, who was on court, and the type of match.')}
    </div>

    <h4 class="grp">Change your level</h4>
    <div class="tcards">
      ${tc('raise', 'raise', 'Raise your level', 'Play your way up, or ask club staff to review your level.')}
      ${tc('lower', 'lower', 'Lower your level', used ? 'Already used. Further changes need club staff.' : 'A one-time adjustment you can make yourself.', '', !!used)}

  if (kind === 'sdx-levels') return sheet(`
    ${backBtn}

    <div style="margin-top:12px">${BANDS.map(x => `<div class="lv ${x === b ? 'cur' : ''}"><div class="rg">${x.lo}–${x.lo + 1}</div><div><b>${esc(x.band)}: ${esc(x.persona)}${x === b ? ' <span class="here">You are here</span>' : ''}</b><span>${esc(x.about)}</span></div></div>`).join('')}</div>`);

  if (kind === 'sdx-conf') return sheet(`
    ${backBtn}
    <h2>Confidence</h2>
    <div class="sx-top"><span class="n">${conf}%</span><span class="chip ${cl}">${cl}</span></div>
    <div class="meter ${cl}" role="img" aria-label="Confidence ${conf}%"><i style="width:${Math.max(3, conf)}%"></i></div>
    <p>Confidence shows how settled your SDX is. A new rating starts as a best guess and firms up as SmashDex sees more of your game. Three things build it.</p>
    <div class="fcards">
      <div class="fc"><b>How much you've played</b><span>More confirmed sets give a clearer picture of your level.</span></div>
      <div class="fc"><b>Who you've played with and against</b><span>A wide mix of partners and opponents tells us more than the same four players every week.</span></div>
      <div class="fc"><b>How recently you've played</b><span>Confidence fades during long breaks and builds back as you return to the court.</span></div>

  if (kind === 'sdx-moves') return sheet(`
    ${backBtn}
    <h2>What moves your SDX</h2>
    <p style="margin-top:8px">Every confirmed set nudges your SDX up or down. How far depends on these.</p>

      <p>The change will show on your SDX progression chart as a manual adjustment, dated today.</p>
      <label class="check"><input type="checkbox" id="lowerOk"> <span>I understand. Lower my SDX from ${sdx(p.r)} to <b id="lowerTo">${sdx(p.r - S.lowerBy)}</b>.</span></label>

  if (kind === 'edit') {
    const m = S.mine;

        <label class="field"><span>Full name</span><input name="fullName" maxlength="60" value="${esc(m.fullName || '')}"></label>
        <label class="field"><span>Phone</span><input name="phone" inputmode="tel" maxlength="20" value="${esc(m.phone || '')}"></label>
        <label class="field"><span>Email</span><input name="email" type="email" maxlength="80" value="${esc(m.email || '')}"></label>
        <p style="font-size:14px">Your SDX Rating and skill level come from your matches, so they can't be edited here. To change them, use <button type="button" class="linkish" data-open="sdx">Change your level</button> or contact club staff.</p>
        <button class="btn primary full" type="submit">Save changes</button>
        <div class="msg" id="editMsg"></div>
      </form>`);
  }

  if (kind === 'prefs') {
    const pr = S.profiles[S.mid]?.prefs || {}, tm = timesOf(pr.time);
    const chips = (name, label, opts, multi = false, hint = '') => `<fieldset class="pq"><legend>${label}</legend><div class="chips">${opts.map(o => `<label><input type="${multi ? 'checkbox' : 'radio'}" name="${name}" value="${esc(o)}" ${(multi ? tm.includes(o) : pr[name] === o) ? 'checked' : ''}><span>${esc(o)}</span></label>`).join('')}</div>${hint ? `<div class="hint">${hint}</div>` : ''}</fieldset>`;
    return sheet(`
      <h2>Player preferences</h2>
      <p>Other players see these on your profile. Tap a choice again to clear it.</p>
      <form id="prefsForm" style="margin-top:16px">
        ${chips('hand', 'Best hand', ['Right', 'Left', 'Both'])}
        <fieldset class="pq"><legend>Court side</legend><div class="sides">${Object.entries(SIDES).map(([o, d]) => `<label><input type="radio" name="side" value="${o}" ${pr.side === o ? 'checked' : ''}><span class="card"><b>${o}</b><small>${d}</small></span></label>`).join('')}</div></fieldset>
        ${chips('matchType', 'Match type', ['Casual', 'Competitive', 'Both'])}
        ${chips('time', 'Preferred time to play', TIMES, true, 'Pick as many as you like.')}
        <button class="btn primary full" type="submit">Save preferences</button>
      </form>`);
  }

  if (kind === 'player') {
    const n = arg, q = playerOf(n), qb = bandOf(q.r), pid = Object.keys(S.profiles).find(id => S.profiles[id].name === n), pp = S.profiles[pid] || {}, pr = pp.prefs || {};
    const doneMine = myMatches().filter(validMatch);
    const together = doneMine.filter(m => { const s = sideOf(m, me); return s && ((s === 'A' ? m.teamA : m.teamB) || []).includes(n); }).length;
    const against = doneMine.filter(m => { const s = sideOf(m, me); return s && ((s === 'A' ? m.teamB : m.teamA) || []).includes(n); }).length;
    return sheet(`
      <div class="who" style="padding-top:4px"><div class="av" aria-hidden="true">${esc(initials(n))}</div><div><h2 style="font-family:var(--ui);font-size:22px;font-weight:700">${esc(n)}</h2><div class="sub">${dexLabel(pp.dexNo)}</div></div></div>
      <p style="font-size:18px;color:var(--text);font-weight:700">${esc(qb.persona)} <span style="color:var(--muted);font-weight:500">· ${esc(qb.band)}</span></p>
      <p>${esc(qb.quip)}</p>
      <p class="form-line">${esc(formLine(n))}</p>
      <div class="strip"><div><b>${q.matches || 0}</b><span>Matches</span></div><div><b>${together}</b><span>With you</span></div><div><b>${against}</b><span>Against you</span></div></div>
      ${(pr.hand || pr.side || pr.matchType || timesOf(pr.time).length) ? `<h4>Preferences</h4>${prefRows(pr)}` : ''}`);
  }
}
document.addEventListener('click', e => {
  const k = e.target.closest('#lowerPick [data-k]');
  if (k) { S.lowerBy = +k.dataset.k; document.querySelectorAll('#lowerPick button').forEach(b => b.classList.toggle('on', b === k)); $('#lowerTo').textContent = sdx(playerOf(myName()).r - S.lowerBy); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'lowerOk') $('#lowerGo').disabled = !e.target.checked;
  if (e.target.name === 'time' && e.target.checked) document.querySelectorAll('#prefsForm input[name=time]').forEach(i => { if (i !== e.target && (e.target.value === 'Anytime' || i.value === 'Anytime')) i.checked = false; });
});
// Radios in the preferences form clear when tapped again
let _wasOn = null;
document.addEventListener('pointerdown', e => { const i = e.target.closest('#prefsForm label')?.querySelector('input[type=radio]'); _wasOn = i && i.checked ? i : null; });
document.addEventListener('click', e => { const i = e.target.closest('#prefsForm label')?.querySelector('input[type=radio]'); if (i && i === _wasOn && e.target.tagName !== 'INPUT') { e.preventDefault(); setTimeout(() => { i.checked = false; }, 0); _wasOn = null; } });
document.addEventListener('click', async e => {
  if (e.target.id !== 'lowerGo') return;
  const p = playerOf(myName()), from = Math.round(p.r * 1000) / 1000, to = Math.round((p.r - S.lowerBy) * 1000) / 1000;
  e.target.disabled = true;
  try { await set(ref(db, `adjustments/${S.mid}/self`), { from, to, date: todayLocal(), at: new Date().toISOString() }); closeSheet(); track('lowered'); toast(`Level lowered. Your SDX is now ${sdx(to)}`); }
  catch (err) { e.target.disabled = false; toast(/permission/i.test(err.message) ? 'You have already used your one self adjustment.' : 'Could not lower your level: ' + err.message, 4000); }
});
document.addEventListener('submit', async e => {
  if (e.target.id === 'editForm') {
    e.preventDefault(); const f = new FormData(e.target), name = f.get('name').trim();
    const clash = Object.entries(S.profiles).find(([id, x]) => id !== S.mid && (x.name || '').trim().toLowerCase() === name.toLowerCase());
    if (clash) { $('#editMsg').textContent = `Another player is already called “${name}”. Add a surname or an initial.`; $('#editMsg').className = 'msg err'; return; }
    const upd = { [`members/${S.mid}/name`]: name, [`profiles/${S.mid}/name`]: name };
    for (const k of ['fullName', 'phone', 'email']) upd[`members/${S.mid}/${k}`] = f.get(k).trim();
    try { await update(ref(db), upd); Object.assign(S.mine, { name, fullName: f.get('fullName').trim(), phone: f.get('phone').trim(), email: f.get('email').trim() }); closeSheet(); track('profile_saved'); toast('Profile saved'); }
    catch (err) { $('#editMsg').textContent = 'Could not save: ' + err.message; $('#editMsg').className = 'msg err'; }
  }
  if (e.target.id === 'prefsForm') {
    e.preventDefault(); const f = new FormData(e.target), prefs = {};
    for (const k of ['hand', 'side', 'matchType']) if (f.get(k)) prefs[k] = f.get(k);
    const tm = f.getAll('time'); if (tm.length) prefs.time = tm;
    try { await set(ref(db, `profiles/${S.mid}/prefs`), prefs); closeSheet(); track('prefs_saved'); toast('Preferences saved'); }
    catch (err) { toast('Could not save preferences: ' + err.message, 4000); }
  }
});

/* ══════════ Record score ══════════ */
const CLUB_DEFAULT = 'deuce-and-smash';
const clubList = () => Object.entries(S.clubs || {}).filter(([, c]) => c && c.name && c.approved !== false).sort((a, b) => (a[1].order || 99) - (b[1].order || 99)).map(([k, c]) => [k, c.name]);
function clubName(k, other) { if (k === 'other') return other || 'Other club'; return S.clubs?.[k || CLUB_DEFAULT]?.name || (k && k !== CLUB_DEFAULT ? k : 'Deuce & Smash'); }
const clubBadge = k => (k || CLUB_DEFAULT) === CLUB_DEFAULT ? `<img class="cb-logo" src="/assets/deuce-and-smash-logo.png" alt="">` : `<span class="cb" aria-hidden="true">${esc(initials(clubName(k)))}</span>`;
const pName = (s, id) => isNew(id) ? (s?.newcomers?.[id.slice(4)]?.name || 'New player') : (S.profiles[id]?.name || '?');
const engName = (sid, id) => isNew(id) ? `~new:${sid}:${id.slice(4)}` : S.profiles[id]?.name;
const teamName = (s, ids) => ids.map(id => id === S.mid ? 'You' : pName(s, id)).join(' & ');
const listOr = a => a.length <= 1 ? (a[0] || '') : `${a.slice(0, -1).join(', ')} or ${a[a.length - 1]}`;
const localISO = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const dayChoices = () => [...Array(8)].map((_, n) => { const d = new Date(); d.setDate(d.getDate() - n); return localISO(d); });
const setsTxt = (s) => setsOfSub(s).map((t, i) => `Set ${i + 1}: ${teamName(s, t.A).replace(/^You/, pName(s, S.mid))} ${t.a}–${t.b}${t.tb ? ` (tie-break ${t.tb.a}–${t.tb.b})` : ''} ${teamName(s, t.B).replace(/^You/, pName(s, S.mid))}`).join('\n');
const appUrl = q => `${location.origin}/smashdex/${q}`;
const shareText = (sid, s) => `🎾 ${pName(s, s.by)} recorded our padel match on ${fmtDate(s.date)} at ${clubName(s.club, s.clubOther)}.\n${setsTxt(s)}\n\nConfirm or dispute it on SmashDex: ${appUrl(`?m=${sid}`)}`;
const shareLink = (sid, s) => `https://wa.me/?text=${encodeURIComponent(shareText(sid, s))}`;
const nudgeText = (sid, s) => `Hi Deuce & Smash, a disputed SmashDex score is still open. Match on ${fmtDate(s.date)} at ${clubName(s.club, s.clubOther)}, recorded by ${pName(s, s.by)}, disputed by ${pName(s, s.dispute?.by)}. Ref ${sid}. Please review it in /admin → Member scores.`;
const inviteLink = (sid, s, k) => { const nc = s.newcomers?.[k] || {}; return `https://wa.me/?text=${encodeURIComponent(`Hi ${nc.name || ''}, I've added our padel match from ${fmtDate(s.date)} at ${clubName(s.club, s.clubOther)} to SmashDex, the Deuce & Smash player rating. Join to see your SDX rating and your matches: ${appUrl(`?join=${sid}.${k}`)}`)}`; };

function mySubItems() {
  const now = Date.now();
  return Object.entries(S.subs || {}).filter(([, s]) => s && playersOf(s).includes(S.mid)).map(([sid, s]) => ({ sid, s, st: subState(s, now) })).filter(x => x.st !== 'void');
}
// Voided by staff: still shown in history so members can see what happened, but never counted
const myVoided = () => Object.entries(S.subs || {}).filter(([, s]) => s && s.status === 'void' && playersOf(s).includes(S.mid)).map(([sid, s]) => ({ sid, s, st: 'void' }));
function subResult(x) {
  let w = 0, l = 0;
  setsOfSub(x.s).forEach(t => { const side = t.A.includes(S.mid) ? 'A' : t.B.includes(S.mid) ? 'B' : null; if (!side) return; const my = side === 'A' ? +t.a : +t.b, th = side === 'A' ? +t.b : +t.a; if (my > th) w++; else if (my < th) l++; });
  return { w, l };
}
const subDelta = sid => (playerOf(myName()).hist || []).filter(h => String(h.id || '').startsWith(`s:${sid}:`)).reduce((a, h) => a + h.delta, 0);
// SDX going into the match: from the rating history once counted, else the current rating (or a newcomer's estimate)
function subPre(sid, s, id) {
  const n = engName(sid, id);
  for (let bi = 0; bi < 6; bi++) { const v = S.pre[`s:${sid}:${bi}`]?.[n]; if (v != null) return v; }
  if (isNew(id)) return levelSeed(s.newcomers?.[id.slice(4)]?.level);
  return n ? playerOf(n).r : null;
}
// What this score would do to my SDX if it counted now
function previewDelta(sid) {
  if (sid in S._preview) return S._preview[sid];
  const sx = subsToMatches(S.subs, id => S.profiles[id]?.name, Date.now(), { include: k => k === sid, dups: S.dups });
  const seeds = { ...S._seeds }; for (const [k, v] of Object.entries(sx.seeds)) if (!seeds[k]) seeds[k] = v;
  const r = DSR.compute(seeds, S._base.concat(sx.matches), todayUTC(), S._adj).players[myName()];
  return (S._preview[sid] = r ? { from: playerOf(myName()).r, to: r.r } : null);
}
const subTeam = (sid, s, ids, isMe, withSdx = true) => `<div class="team ${isMe ? 'me' : ''}">${ids.map(id => pa(engName(sid, id) || id, withSdx ? subPre(sid, s, id) : null, isNew(id), pName(s, id))).join('')}<span>${ids.map(id => esc(pName(s, id))).join(' & ')}</span></div>`;
function subStatus(x) {
  const { s, st, sid } = x;
  if (st === 'void') return `<span class="down">${s.staffNote === 'voided' || s.resolvedBy ? 'Removed by club staff' : 'Withdrawn'}</span>`;
  if (st === 'expired') return `<span class="mu">Didn't count</span>`;
  if (st === 'pending') return `<span class="pending">Pending · ${hoursLeft(s)} h left</span>`;
  if (st === 'disputed') return `<span class="down">Disputed</span>`;
  const { w, l } = subResult(x), d = subDelta(sid);
  const r = s.rotate ? `<span class="${w > l ? 'up' : w < l ? 'down' : ''}">Won ${w} of ${w + l}</span>` : (w > l ? '<span class="up">Win</span>' : w < l ? '<span class="down">Loss</span>' : 'Draw');
  return `${r}${d ? ` <span class="${d >= 0 ? 'up' : 'down'}">${sgn(d)}</span>` : ''}`;
}
// The teams and set tiles of a recorded score. Fixed pairs: like any match row. Rotating: one line per set.
function subCore(sid, s) {
  const ss = setsOfSub(s);
  if (!s.rotate) {
    const t0 = ss[0], mine = t0.A.includes(S.mid) ? 'A' : 'B';
    return `<div class="teams">${subTeam(sid, s, t0.A, mine === 'A')}${subTeam(sid, s, t0.B, mine === 'B')}</div><div class="sets" aria-label="Set scores">${ss.map(t => scoreTiles(t.a, tileCls(+t.a, +t.b)) + scoreTiles(t.b, tileCls(+t.b, +t.a))).join('')}</div>`;
  }
  return `<div class="rot-who">${playersOf(s).map(id => pa(engName(sid, id) || id, subPre(sid, s, id), isNew(id), pName(s, id))).join('')}<span>Partners rotated</span></div>
    <div class="rot-lines">${ss.map((t, i) => `<div class="rl"><span class="rn">Set ${i + 1}</span><div class="teams">${subTeam(sid, s, t.A, t.A.includes(S.mid), false)}${subTeam(sid, s, t.B, t.B.includes(S.mid), false)}</div><span class="rs">${scoreTiles(t.a, tileCls(+t.a, +t.b))}${scoreTiles(t.b, tileCls(+t.b, +t.a))}</span></div>`).join('')}</div>`;
}
// Sets of this score already recorded elsewhere (held back so nothing counts twice)
function dupNotes(sid, s) {
  const d = S.dups?.[sid]; if (!d) return '';
  const ss = setsOfSub(s);
  return Object.entries(d).map(([i, x]) => {
    const who = x.src === 'staff' ? 'the front desk' : pName(S.subs[x.ref], S.subs[x.ref]?.by);
    if (x.type === 'dup') return `Set ${+i + 1} was already recorded by ${esc(who)}, so it isn't counted twice`;
    const sc = scoreFor(ss[+i], x.score);
    return `Set ${+i + 1} was recorded as ${sc.a}–${sc.b} by ${esc(who)}${x.src === 'staff' || !isOutside(s) ? '; club staff will check it' : '; if that one is wrong, dispute it'}`;
  }).join(' · ');
}
const subTb = s => setsOfSub(s).map((t, i) => t.tb ? `Set ${i + 1} tie-break ${t.tb.a}–${t.tb.b}` : '').filter(Boolean).join(' · ');
function subRow(x) {
  const { sid, s } = x, v = validatedBy(s);
  const tick = v ? `<span class="tick">${svgI('<path d="M5 12.5l4.5 4.5L19 7"/>')}${v.kind === 'player' ? `Confirmed by ${esc(pName(s, v.id))}` : v.kind === 'auto' ? 'Counted after 24 h, no one disputed it' : v.kind === 'agreed' ? 'Correction agreed by both sides' : 'Checked by club staff'}</span>` : '';

  return `<div class="m${s.rotate ? ' rot' : ''}${x.st === 'void' ? ' voided' : ''}" data-sub="${sid}"><div class="when"><span>${fmtDate(s.date)}</span><span>${esc(clubName(s.club, s.clubOther))}</span></div><div class="res">${subStatus(x)}</div>${subCore(sid, s)}${tb ? `<div class="tbn">${tb}</div>` : ''}</div>`;
}

function historyItems() {
  const staff = myMatches().filter(m => !m.sub).map(m => ({ kind: 'm', date: m.date, at: String(m.enteredAt || ''), m }));
  const sub = mySubItems().concat(myVoided()).map(x => ({ kind: 's', date: x.s.date, at: new Date(+x.s.at || 0).toISOString(), ...x }));
  return staff.concat(sub).sort((a, b) => b.date.localeCompare(a.date) || b.at.localeCompare(a.at));
}
const itemRow = it => it.kind === 'm' ? matchRow(it.m) : subRow(it);
const itemRes = it => { if (it.kind === 'm') return validMatch(it.m) ? resultFor(it.m, myName()) : 'P'; if (it.st === 'void' || it.st === 'expired') return 'V'; if (!counts(it.st)) return 'P'; const { w, l } = subResult(it); return w > l ? 'W' : w < l ? 'L' : 'D'; };

const canConfirm = s => s.status === 'pending' && confirmers(s).includes(S.mid) && !(s.confirms || {})[S.mid];
function attention() {
  const out = { act: [], mine: [], disp: [] };
  for (const x of mySubItems()) {
    if (x.st === 'disputed') out.disp.push(x);
    else if (x.st === 'pending') (x.s.by === S.mid ? out.mine : out.act).push(x);
  }
  const by = (a, b) => (b.s.at || 0) - (a.s.at || 0);

}
function attnCard(x, ctx) {
  const { sid, s } = x, conf = ctx === 'act' && canConfirm(s);
  const opp = confirmers(s).filter(id => id !== S.mid).map(id => pName(s, id));
  const pv = ctx !== 'disp' ? previewDelta(sid) : null;
  let note = '', btns = '', tag = '';
  if (ctx === 'act') {
    tag = conf ? '<span class="tag hot">Confirm</span>' : '<span class="tag">Waiting</span>';
    note = conf ? `${esc(pName(s, s.by))} recorded this. You were on the other side${s.rotate ? ' in at least one set' : ''}.`
      : `${esc(pName(s, s.by))}${s.rotate ? '' : ', your partner,'} recorded this. Waiting for ${esc(listOr(opp)) || 'an opponent'} to confirm.`;
    btns = conf ? `<div class="row2"><button class="btn primary" data-sub-act="confirm" data-sid="${sid}">Confirm</button><button class="btn" data-sub-act="dispute" data-sid="${sid}">Dispute</button></div>`
      : `<button class="btn full" data-sub-act="dispute" data-sid="${sid}">Something wrong? Dispute</button>`;
  } else if (ctx === 'mine') {
    tag = '<span class="tag">Waiting</span>';
    note = opp.length ? `You recorded this. Waiting for ${esc(listOr(opp))} to confirm.${isOutside(s) ? ` At another club it only counts once an opponent confirms, within ${OUTSIDE_DAYS} days.` : ''}`
      : isOutside(s) ? `You recorded this. None of your opponents is on SmashDex yet, and at another club an opponent has to confirm it, so it won't count unless they join and confirm within ${OUTSIDE_DAYS} days.`
      : `You recorded this. None of your opponents is on SmashDex yet, so it counts automatically.`;
    btns = `<div class="row2"><a class="btn wa" href="${shareLink(sid, s)}" target="_blank" rel="noopener" data-track="rec_remind">Remind on WhatsApp</a><button class="btn" data-sub-act="edit" data-sid="${sid}">Edit</button></div>`;
  } else if (isOutside(s)) {

    tag = '<span class="tag disp">Disputed</span>';
    const d = s.dispute || {}, fix = Object.entries(d.fix || {}), raw = rawSets(s), hl = disputeHoursLeft(s);
    const prop = fix.length ? fix.map(([i, f]) => `set ${+i + 1} should be ${f.a}–${f.b} (recorded as ${raw[+i]?.a}–${raw[+i]?.b})`).join(', ') : '';
    const who = d.by === S.mid ? 'You' : esc(pName(s, d.by));
    note = `${who} disputed this${d.reason ? ` (${esc(String(d.reason).toLowerCase())})` : ''}${prop ? `: ${esc(prop)}` : ''}.${d.note ? ` “${esc(d.note)}”` : ''} At another club the players settle it between them. If it isn't agreed within ${hl} h, the match won't count.`;
    if (s.by === S.mid) btns = `<div class="row2">${fix.length ? `<button class="btn primary" data-sub-act="accept" data-sid="${sid}">Accept the correction</button>` : ''}<button class="btn" data-sub-act="withdraw" data-sid="${sid}">Withdraw the match</button></div>`;
    else btns = `<p class="note" style="margin:0">Waiting for ${esc(pName(s, s.by))} to ${fix.length ? 'accept the correction or withdraw the match' : 'withdraw the match'}.</p>`;
  } else {
    tag = '<span class="tag disp">Disputed</span>';
    const d = s.dispute || {}, open24 = Date.now() - (+s.at || 0) >= DAY_MS;
    note = `${d.by === S.mid ? 'You' : esc(pName(s, d.by))} disputed this${d.reason ? ` (${esc(String(d.reason).toLowerCase())})` : ''}.${d.note ? ` “${esc(d.note)}”` : ''} Club staff will review it. The disputed sets don't count until then.`;
    btns = open24 ? `<a class="btn wa full" href="${waLink(nudgeText(sid, s))}" target="_blank" rel="noopener" data-track="rec_nudge">Nudge the club on WhatsApp</a>`
      : `<p class="note" style="margin:0">If it's still open 24 hours after the score was entered, you can nudge the club from here.</p>`;
  }
  return `<div class="acard${conf ? ' hot' : ''}">
    <div class="ah"><span>${fmtDate(s.date)} · ${esc(clubName(s.club, s.clubOther))} · ${s.format === 'competitive' ? 'Competitive' : 'Casual'}</span>${tag}</div>
    <div class="m bare${s.rotate ? ' rot' : ''}">${subCore(sid, s)}</div>
    <p class="note">${note}</p>
    ${pv && Math.abs(pv.to - pv.from) > 1e-6 ? `<div class="pv"><span>Your SDX once ${ctx === 'mine' ? 'it counts' : 'confirmed'}</span><b>${sdx(pv.from)} → <span class="${pv.to >= pv.from ? 'up' : 'down'}">${sdx(pv.to)}</span> <small class="${pv.to >= pv.from ? 'up' : 'down'}">${sgn(pv.to - pv.from)}</small></b></div>` : ''}
    ${btns}
    ${ctx !== 'disp' ? `<p class="note clock">${isOutside(s) ? `Needs an opponent to confirm within ${hoursLeft(s)} h, or it won't count` : `Confirms automatically in ${hoursLeft(s)} h`}</p>` : ''}
  </div>`;
}

function recNew(fromSid) {

      sets: setsOfSub(s).map(t => {
        const meA = t.A.includes(S.mid), mate = (meA ? t.A : t.B).find(i => i !== S.mid);
        let a = meA ? +t.a : +t.b, b = meA ? +t.b : +t.a, tb = t.tb ? (meA ? { a: t.tb.a, b: t.tb.b } : { a: t.tb.b, b: t.tb.a }) : null;
        if (tb && Math.max(a, b) === 7 && Math.min(a, b) === 6) { a = 6; b = 6; }
        return { a, b, tb, p: Math.max(1, pl.indexOf(mate)) };

  } else S.rec = { step: 0, sid: null, date: todayLocal(), club: CLUB_DEFAULT, clubOther: '', format: 'openplay', rotate: false, early: false,
    slots: [S.mid, null, null, null], newcomers: {}, sets: [{ a: null, b: null, tb: null, p: 1 }], act: { i: 0, k: 'a' }, pick: 1, q: '', newForm: false };
}

    ${R.rotate ? `<div class="pp"><span class="hint" style="margin:0">Your partner this set</span><div class="fchips">${[1, 2, 3].map(j => `<button class="fchip${(t.p || 1) === j ? ' on' : ''}" data-rp="${i}:${j}">${esc(slotName(j))}</button>`).join('')}</div></div>` : ''}
    <div class="srow"><span class="me">${esc(mine.map(slotName).join(' & '))}</span>${tileBtn(i, 'a', t.a, t.b)}</div>
    <div class="srow"><span>${esc(opp.map(slotName).join(' & '))}</span>${tileBtn(i, 'b', t.b, t.a)}</div>
    ${act ? `<div class="pad" role="group" aria-label="Games">${[0, 1, 2, 3, 4, 5, 6, 7].map(n => `<button data-rpad="${n}">${scoreTiles(n)}</button>`).join('')}</div>` : ''}
    ${tb}</div>`;
}
function recErrors() {
  const R = S.rec, errs = [];
  R.sets.forEach((t, i) => {
    const n = `Set ${i + 1}`;
    if (t.a == null || t.b == null) return errs.push(`${n} needs both scores.`);
    if (!validSet(t.a, t.b, R.early)) return errs.push(`${n}: ${t.a}–${t.b} isn't a finished set. If time ran out, tick “A set ended early”.`);
    const tbIn = t.tb && t.tb.a !== '' && t.tb.a != null && t.tb.b !== '' && t.tb.b != null;
    if (+t.a === 6 && +t.b === 6 && !R.early && !validTb(t.tb)) return errs.push(`${n}: add the tie-break score (first to 7, win by 2).`);
    if (tbIn && !validTb(t.tb)) return errs.push(`${n}: check the tie-break score (first to 7, win by 2).`);
    if (tbIn && +t.a !== +t.b && ((+t.a > +t.b) !== (+t.tb.a > +t.tb.b))) errs.push(`${n}: the tie-break winner should also win the set.`);
  });
  return errs;
}
function recScore() {
  const R = S.rec, max = R.rotate ? MAX_SETS.rotate : MAX_SETS.fixed, errs = recErrors();
  return `<div class="rsec"><p class="lbl">Match type</p><div class="seg2">${[['openplay', 'Casual'], ['competitive', 'Competitive']].map(([k, l]) => `<button class="fchip${R.format === k ? ' on' : ''}" data-rfmt="${k}">${l}</button>`).join('')}</div></div>
    <label class="tog"><span><b>Partners rotate between sets</b><small>Open play with the same four players, swapping partners</small></span><input type="checkbox" data-rrot${R.rotate ? ' checked' : ''}></label>
    <div class="scards">${R.sets.map(setCard).join('')}</div>
    ${R.sets.length < max ? `<button class="btn full dashed" data-raddset>${svgI('<path d="M12 5v14M5 12h14"/>')}Add set ${R.sets.length + 1} <span class="mu">(up to ${max})</span></button>` : `<p class="hint">That's the most sets for one ${R.rotate ? 'session' : 'match'}. Record the rest as a new score.</p>`}
    <label class="chk"><input type="checkbox" data-rearly${R.early ? ' checked' : ''}><span><b>A set ended early</b><small>Time ran out before a set finished. The score still counts, game by game.</small></span></label>
    <p class="hint">Tap a tile, then pick the games. A set is 6–0 to 6–4 or 7–5. At 6–6 the tie-break opens on its own.</p>
    <div id="recErr" class="rerr" aria-live="polite">${errs.length && R.sets.some(t => t.a != null && t.b != null) ? esc(errs[0]) : ''}</div>
    <button class="btn primary full big" data-rstep="2" id="recNext"${errs.length ? ' disabled' : ''}>Next: review</button>`;
}
function buildDraft() {
  const R = S.rec, sl = R.slots;
  const sets = R.sets.map(t => {
    const { mine, opp } = teamsFor(t);
    const tb = t.tb && validTb(t.tb) && needsTb(t.a, t.b) ? { a: +t.tb.a, b: +t.tb.b } : null;
    const x = finalSet({ a: +t.a, b: +t.b, tb });
    const o = { A: mine.map(j => sl[j]), B: opp.map(j => sl[j]), a: x.a, b: x.b }; if (x.tb) o.tb = x.tb; return o;
  });
  const p1 = R.rotate ? sl[R.sets[0].p || 1] : sl[1];
  const players = [S.mid, p1, ...[1, 2, 3].map(j => sl[j]).filter(id => id !== p1)];
  const nc = {}; for (const id of players) if (isNew(id)) nc[id.slice(4)] = { name: R.newcomers[id.slice(4)].name, level: R.newcomers[id.slice(4)].level };
  const d = { by: S.mid, at: R.sid ? S.subs[R.sid]?.at : Date.now(), date: R.date, club: R.club, format: R.format, players, sets, status: 'pending' };
  if (R.rotate) d.rotate = true; if (R.early) d.early = true;
  if (R.club === 'other') d.clubOther = R.clubOther.trim().slice(0, 40);
  if (Object.keys(nc).length) d.newcomers = nc;
  return d;
}
// Sets of the draft already recorded by the front desk or another member
function draftDups(d) {
  const key = S.rec.sid || '~draft', all = { ...S.subs, [key]: { ...d, at: S.rec.sid ? d.at : Date.now() + 1 } };
  return markDuplicates(all, S.matches)[key] || {};
}
function recReview() {
  const R = S.rec, d = buildDraft(), who = confirmers(d).map(id => pName(d, id)), nc = Object.values(d.newcomers || {});
  const dd = draftDups(d), ddi = Object.keys(dd).map(Number), ss = setsOfSub(d);
  const src = x => x.src === 'staff' ? 'the front desk' : pName(S.subs[x.ref], S.subs[x.ref]?.by);
  const allDup = ddi.length === ss.length && Object.values(dd).every(x => x.type === 'dup');
  const other = allDup ? [...new Set(Object.values(dd).filter(x => x.src === 'member').map(x => x.ref))].find(k => S.subs[k] && canConfirm(S.subs[k])) : null;
  const dupBox = ddi.length ? `<div class="warnbox"><b>${allDup ? 'This match looks already recorded' : `${ddi.length === 1 ? 'One set is' : `${ddi.length} sets are`} already recorded`}</b>
      <ul>${ddi.map(i => { const x = dd[i], sc = scoreFor(ss[i], x.score); return `<li>Set ${i + 1} (${esc(teamName(d, ss[i].A))} vs ${esc(teamName(d, ss[i].B))}): ${x.type === 'dup' ? `recorded by ${esc(src(x))} with the same score, so it won't count twice` : `recorded by ${esc(src(x))} as ${sc.a}–${sc.b}. Check your score: ${x.src === 'staff' || !isOutside(d) ? 'club staff will decide which is right' : `if ${esc(src(x))}'s is wrong, dispute it`}`}</li>`; }).join('')}</ul>
      ${allDup ? '<p>There is nothing new to add.</p>' : '<p>You can submit as it is: only the new sets will count.</p>'}
      ${other ? `<button class="btn primary full" data-sub-act="confirm" data-sid="${other}">Confirm ${esc(pName(S.subs[other], S.subs[other].by))}'s score instead</button>` : ''}</div>` : '';
  const outsideNoConf = isOutside(d) && !who.length;
  const { w, l } = subResult({ s: d });
  const res = d.rotate ? `You won ${w} of ${w + l} sets` : w > l ? `${teamName(d, d.sets[0].A)} win ${w}–${l}` : w < l ? `${teamName(d, d.sets[0].B)} win ${l}–${w}` : `Sets level at ${w}–${l}`;
  return `<div class="acard">
      <div class="ah"><span>${fmtDate(d.date)} · ${esc(clubName(d.club, d.clubOther))} · ${d.format === 'competitive' ? 'Competitive' : 'Casual'}${d.rotate ? ' · partners rotate' : ''}</span></div>
      <div class="m bare${d.rotate ? ' rot' : ''}">${subCore('draft', d)}</div>
      ${subTb(d) ? `<p class="note">${subTb(d)}</p>` : ''}
      <p class="rres-line ${w > l ? 'up' : w < l ? 'down' : ''}">${esc(res)}</p></div>
    <ul class="rnotes">
      <li>${who.length ? `${esc(listOr(who))} ${who.length > 1 ? 'can' : 'will be asked to'} confirm it. Only one needs to.` : outsideNoConf ? '' : 'None of your opponents is on SmashDex yet, so it counts automatically after 24 hours. Club staff may spot-check it.'}</li>
      <li>${isOutside(d) ? `It was played at another club, so it only counts once an opponent confirms it, within ${OUTSIDE_DAYS} days. If there's a disagreement, you settle it between you.` : `Your SDX moves once it's confirmed, or automatically after 24 hours if nobody disputes it.`}</li>
      ${nc.map(n => `<li>${esc(n.name)} counts as ${esc(n.level)} (about ${levelSeed(n.level).toFixed(1)}) until they join SmashDex.</li>`).join('')}
    </ul>
    ${outsideNoConf ? `<div class="warnbox"><b>This score won't count yet</b><p>At another club an opponent on SmashDex has to confirm it, and none of your opponents is on SmashDex yet. Invite them after you submit: if one joins and confirms within ${OUTSIDE_DAYS} days, it counts.</p></div>` : ''}
    ${dupBox}
    ${allDup ? '<button class="btn full big" data-close>Close without submitting</button>' : `<button class="btn primary full big" data-rsubmit>${R.sid ? 'Save changes' : 'Submit score'}</button>`}
    ${R.sid ? `<button class="btn full" style="margin-top:10px" data-rdelete>Delete this score</button>` : ''}`;
}
function recDone() {
  const R = S.rec, d = R.doneData, sid = R.done, nk = Object.keys(d.newcomers || {});
  return `<div class="done-h">${svgI('<path d="M5 12.5l4.5 4.5L19 7"/>')}<h2>${R.sid ? 'Score updated' : 'Score recorded'}</h2></div>
    <div class="acard"><div class="m bare${d.rotate ? ' rot' : ''}">${subCore(sid, d)}</div></div>
    <p>Let the others know so they can confirm it. WhatsApp opens with the score and a link; pick your group chat or send it to each player.</p>
    <a class="btn wa full big" href="${shareLink(sid, d)}" target="_blank" rel="noopener" data-track="rec_share">Send to the players on WhatsApp</a>
    ${nk.map(k => `<a class="btn full" style="margin-top:10px" href="${inviteLink(sid, d, k)}" target="_blank" rel="noopener" data-track="rec_invite">Invite ${esc(d.newcomers[k].name)} to SmashDex</a>`).join('')}
    <button class="btn full" style="margin-top:10px" data-close>Done</button>`;
}
async function recSubmit(btn) {
  const R = S.rec;
  if (recErrors().length) return;
  if (!R.sid && Object.values(S.subs).filter(s => s && s.by === S.mid && Date.now() - (+s.at || 0) < DAY_MS).length >= 6)
    return toast('You can record up to 6 scores in 24 hours. Ask club staff to add the rest.', 4500);
  const d = buildDraft(), sid = R.sid || `${Date.now().toString(36)}${Math.random().toString(36).slice(2, 7)}`;
  btn.disabled = true;
  try { await set(ref(db, `submissions/${sid}`), d); track('rec_submit'); R.done = sid; R.doneData = d; R.step = 3; recRender(true); }
  catch (e) { btn.disabled = false; toast(/permission/i.test(e.message) ? (R.sid ? 'This score can no longer be edited (it has been confirmed, disputed or is over 24 hours old).' : 'Could not save the score. Check your connection and try again.') : 'Could not save the score: ' + (e.code || e.message), 5000); }
}

/* ── Dispute ── */
function disputeSheet(sid) {
  const s = S.subs[sid]; if (!s) return;
  S.sheetKind = 'dispute';
  sheet(`<h2>Dispute this score</h2>
    <div class="acard"><div class="ah"><span>${fmtDate(s.date)} · ${esc(clubName(s.club, s.clubOther))} · recorded by ${esc(pName(s, s.by))}</span></div><div class="m bare${s.rotate ? ' rot' : ''}">${subCore(sid, s)}</div></div>
    <form id="dispForm" data-sid="${sid}">
      <fieldset class="pq"><legend>What's wrong?</legend><div class="chips">${['The score', 'The players', 'The date or club', "I didn't play this"].map((r, i) => `<label><input type="radio" name="reason" value="${r}"${i ? '' : ' checked'}><span>${r}</span></label>`).join('')}</div></fieldset>
      <fieldset class="pq" id="dispSets"><legend>Which set is wrong, and what was the score?</legend>
        ${setsOfSub(s).map((t, i) => `<div class="dset"><label class="chk" style="margin:0"><input type="checkbox" name="set" value="${i}"><span><b>Set ${i + 1}</b><small>${esc(teamName(s, t.A))} ${t.a}–${t.b} ${esc(teamName(s, t.B))}</small></span></label>
          <span class="fix">Should be <input name="fa${i}" inputmode="numeric" maxlength="1" aria-label="Set ${i + 1} correct games for ${esc(teamName(s, t.A))}">–<input name="fb${i}" inputmode="numeric" maxlength="1" aria-label="Set ${i + 1} correct games for ${esc(teamName(s, t.B))}"></span></div>`).join('')}
      </fieldset>
      <label class="field"><span>Anything else? (optional)</span><textarea name="note" maxlength="300" rows="3"></textarea></label>
      <p class="note">${isOutside(s) ? `This match was at another club, so you and ${esc(pName(s, s.by))} settle it between you. If the dispute is about the score, propose the right one: if ${esc(pName(s, s.by))} accepts it, the corrected score counts. If it isn't agreed within ${OUTSIDE_DAYS} days, the match doesn't count.` : 'The disputed sets stop counting until club staff sort it out. Staff see it in their review list straight away.'}</p>
      <button class="btn primary full big" type="submit">Send dispute</button>
    </form>`, true);
}
document.addEventListener('change', e => {
  if (e.target.closest('#dispForm') && e.target.name === 'reason') $('#dispSets').classList.toggle('hidden', e.target.value !== 'The score');
});
document.addEventListener('submit', async e => {
  if (e.target.id !== 'dispForm') return;
  e.preventDefault();
  const f = new FormData(e.target), sid = e.target.dataset.sid, s = S.subs[sid]; if (!s) return;
  const reason = f.get('reason'), d = { by: S.mid, at: Date.now(), reason };
  if (reason === 'The score') {
    const sets = f.getAll('set').map(Number);
    if (sets.length) d.sets = sets;
    const fix = {}; (sets.length ? sets : setsOfSub(s).map((_, i) => i)).forEach(i => { const a = f.get('fa' + i), b = f.get('fb' + i); if (a !== '' && b !== '' && validSet(+a, +b, true)) fix[i] = { a: +a, b: +b }; });
    if (Object.keys(fix).length) d.fix = fix;
    if (isOutside(s) && !Object.keys(fix).length) return toast('Add the right score for the set that is wrong, so it can be accepted', 4000);
  }
  const note = String(f.get('note') || '').trim().slice(0, 300); if (note) d.note = note;
  const btn = e.target.querySelector('[type=submit]'); btn.disabled = true;
  try { await update(ref(db), { [`submissions/${sid}/dispute`]: d, [`submissions/${sid}/status`]: 'disputed' }); track('rec_dispute'); closeSheet(); toast('Dispute sent. Club staff will review it.', 3500); }
  catch (err) { btn.disabled = false; toast(/permission/i.test(err.message) ? 'This score can no longer be disputed here. Message the club instead.' : 'Could not send: ' + err.message, 4500); }
});

/* ── Clicks and inputs for the Record score tab and flow ── */
document.addEventListener('click', async e => {
  const t = e.target;
  const tr = t.closest('[data-track]'); if (tr) track(tr.dataset.track);
  if (t.closest('[data-rec=start]')) { recNew(); track('rec_start'); return recOpen(); }
  const go = t.closest('[data-go]'); if (go) return switchTab(go.dataset.go);
  const hf = t.closest('[data-hf]'); if (hf) { S.hFilter = hf.dataset.hf; S.hShown = 20; return render(); }
  if (t.closest('[data-act=hmore]')) { S.hShown += 20; return render(); }
  const sa = t.closest('[data-sub-act]');
  if (sa) {
    const sid = sa.dataset.sid, act = sa.dataset.subAct, s = S.subs[sid]; if (!s) return;
    if (act === 'dispute') return disputeSheet(sid);
    if (act === 'edit') { recNew(sid); return recOpen(); }
    if (act === 'accept' || act === 'withdraw') {
      if (!sa.dataset.armed) { sa.dataset.armed = '1'; sa.textContent = act === 'accept' ? 'Tap again to accept' : 'Tap again to withdraw'; return; }
      sa.disabled = true;
      try {
        await update(ref(db), act === 'accept' ? { [`submissions/${sid}/dispute/accepted`]: true, [`submissions/${sid}/status`]: 'confirmed' } : { [`submissions/${sid}/status`]: 'void' });
        track(act === 'accept' ? 'rec_accept' : 'rec_withdraw');
        toast(act === 'accept' ? 'Correction accepted. The corrected score now counts.' : 'Match withdrawn. It no longer counts.', 3500);
        if (S.sheetKind === 'waiting' && !$('#sheet').classList.contains('hidden')) setTimeout(() => openWaiting(), 400);
      } catch (err) { sa.disabled = false; toast('Could not save: ' + err.message, 4000); }
      return;
    }
    if (act === 'confirm') {
      sa.disabled = true; const pv = previewDelta(sid);
      try {
        await set(ref(db, `submissions/${sid}/confirms/${S.mid}`), Date.now()); track('rec_confirm');
        toast(pv ? `Confirmed. Your SDX is now ${sdx(pv.to)} (${sgn(pv.to - pv.from)})` : 'Confirmed', 4000);
        if (S.sheetKind === 'waiting' && !$('#sheet').classList.contains('hidden')) setTimeout(() => openWaiting(), 400);
        if (S.sheetKind === 'rec') closeSheet();
      } catch (err) { sa.disabled = false; toast('Could not confirm: ' + err.message, 4000); }
    }
    return;
  }
  if (!S.rec || S.sheetKind !== 'rec' || !t.closest('#sheetBody')) return;
  const R = S.rec, d = k => t.closest(`[${k}]`)?.getAttribute(k);
  let v;
  if ((v = d('data-rstep')) != null) {
    const n = +v;
    if (n > R.step && n === 1 && !(R.slots.every(Boolean))) return;
    if (n > R.step && n === 2 && recErrors().length) return;
    R.step = n; R.act = n === 1 && R.sets.some(x => x.a == null) ? { i: R.sets.findIndex(x => x.a == null), k: 'a' } : (n === 1 ? R.act : null);
    if (n === 1) track('rec_score'); if (n === 2) track('rec_review');
    return recRender(true);
  }
  if ((v = d('data-rdate')) != null) { R.date = v; return recRender(); }
  if ((v = d('data-rslot')) != null) { R.pick = +v; R.q = ''; R.newForm = false; return recRender(); }
  if ((v = d('data-rslot-clear')) != null) { R.slots[+v] = null; R.pick = +v; R.q = ''; R.newForm = false; return recRender(); }
  if ((v = d('data-rpick')) != null) { R.slots[R.pick] = v; R.q = ''; R.newForm = false; const nx = R.slots.findIndex(x => !x); R.pick = nx >= 0 ? nx : null; return recRender(); }
  if (t.closest('[data-rnew]')) { R.newForm = true; return recRender(); }
  if (t.closest('[data-rnew-cancel]')) { R.newForm = false; return recRender(); }
  if (t.closest('[data-rnew-add]')) {
    const name = ($('#ncName')?.value || '').trim().slice(0, 30), level = document.querySelector('input[name=nclv]:checked')?.value || 'Beginner+';
    if (!name) { $('#ncName')?.focus(); return toast('Add their name first'); }
    const k = 'k' + Date.now().toString(36); R.newcomers[k] = { name, level }; R.slots[R.pick] = 'new:' + k; R.q = ''; R.newForm = false; track('rec_newcomer');
    const nx = R.slots.findIndex(x => !x); R.pick = nx >= 0 ? nx : null; return recRender();
  }
  if ((v = d('data-rfmt')) != null) { R.format = v; return recRender(); }
  if ((v = d('data-rp')) != null) { const [i, j] = v.split(':').map(Number); R.sets[i].p = j; return recRender(); }
  if ((v = d('data-rt')) != null) { const [i, k] = v.split(':'); R.act = { i: +i, k }; return recRender(); }
  if ((v = d('data-rpad')) != null && R.act) {
    const st = R.sets[R.act.i]; st[R.act.k] = +v;
    if (!needsTb(st.a, st.b)) st.tb = null;
    if (R.act.k === 'a' && st.b == null) R.act = { i: R.act.i, k: 'b' };
    else { const nx = R.sets.findIndex(x => x.a == null || x.b == null); R.act = nx >= 0 ? { i: nx, k: R.sets[nx].a == null ? 'a' : 'b' } : null; }
    recRender();
    if (needsTb(st.a, st.b) && !st.tb) setTimeout(() => document.querySelector(`[data-rtb="${R.sets.indexOf(st)}:a"]`)?.focus(), 30);
    return;
  }
  if (t.closest('[data-raddset]')) { const last = R.sets[R.sets.length - 1]; R.sets.push({ a: null, b: null, tb: null, p: R.rotate ? ((last.p || 1) % 3) + 1 : 1 }); R.act = { i: R.sets.length - 1, k: 'a' }; return recRender(); }
  if ((v = d('data-rdelset')) != null) { R.sets.splice(+v, 1); R.act = null; return recRender(); }
  if (t.closest('[data-rsubmit]')) return recSubmit(t.closest('[data-rsubmit]'));
  if (t.closest('[data-rdelete]')) {
    const b = t.closest('[data-rdelete]');
    if (!b.dataset.armed) { b.dataset.armed = '1'; b.textContent = 'Tap again to delete this score'; b.classList.add('danger'); return; }
    try { await set(ref(db, `submissions/${R.sid}`), null); track('rec_delete'); closeSheet(); toast('Score deleted'); }
    catch (err) { toast('Could not delete: ' + err.message, 4000); }
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('[data-hclub]')) { S.hClub = t.value; S.hShown = 20; return render(); }
  if (!S.rec || S.sheetKind !== 'rec') return;
  const R = S.rec;
  if (t.matches('[data-rdate-sel]') && t.value) { R.date = t.value; return recRender(); }
  if (t.matches('[data-rf=club]')) { R.club = t.value; return recRender(); }
  if (t.matches('[data-rrot]')) { R.rotate = t.checked; if (!R.rotate) { R.sets = R.sets.slice(0, MAX_SETS.fixed); R.sets.forEach(x => x.p = 1); } return recRender(); }
  if (t.matches('[data-rearly]')) { R.early = t.checked; return recRender(); }
});
document.addEventListener('input', e => {
  const t = e.target; if (!S.rec || S.sheetKind !== 'rec') return;
  const R = S.rec;
  if (t.id === 'recQ') { R.q = t.value; $('#recRes').innerHTML = recResults(); return; }
  if (t.id === 'ncName') { R.q = t.value; return; }
  if (t.matches('[data-rf=clubOther]')) { R.clubOther = t.value; const nb = document.querySelector('[data-rstep="1"]'); if (nb) nb.disabled = !(R.slots.every(Boolean) && R.clubOther.trim()); return; }
  if (t.matches('[data-rtb]')) {
    const [i, k] = t.dataset.rtb.split(':'); t.value = t.value.replace(/\D/g, '');
    R.sets[+i].tb = { ...(R.sets[+i].tb || { a: '', b: '' }), [k]: t.value === '' ? '' : +t.value };
    const errs = recErrors(); $('#recErr').textContent = errs[0] || ''; $('#recNext').disabled = !!errs.length;
  }
});
// Invitation links for new players: remember which match invited them, so staff can swap them in
try { const j = new URLSearchParams(location.search).get('join'); if (j) { localStorage.setItem('sdxJoin', j); history.replaceState(null, '', location.pathname); } } catch {}
</script>
