<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmashDex — by Deuce &amp; Smash</title>
<meta name="description" content="SmashDex by Deuce & Smash: your SDX Rating, match history and Matchup Dex. Coming soon for club players.">
<meta property="og:title" content="SmashDex — by Deuce & Smash">
<meta property="og:description" content="Your SDX Rating, your rivals, your record. Coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0E0E2C;--yellow:#F5D628;--blue:#1A6FD4;--green:#7DC515;--orange:#E05A00;--muted:rgba(255,255,255,.62)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--navy);color:#fff;font-family:'Barlow Condensed',system-ui,sans-serif;display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden}
.court{position:fixed;inset:0;pointer-events:none;opacity:.07}
.court::before,.court::after{content:"";position:absolute;border:2px solid #fff}
.court::before{left:50%;top:-10%;bottom:-10%;width:0;border-width:0 0 0 2px}
.court::after{left:12%;right:12%;top:50%;height:0;border-width:2px 0 0 0}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 24px;position:relative}
.brand{width:min(340px,72vw);height:auto;display:block;margin:0 auto 8px}
.by{font-size:15px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted)}
h1{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:clamp(76px,19vw,168px);line-height:.86;letter-spacing:.01em;margin:10px 0 6px}
h1 span{color:var(--yellow)}
.tag{font-size:clamp(19px,4.6vw,24px);color:#fff;max-width:520px;line-height:1.25}
.card{margin-top:38px;border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:22px 26px;display:flex;align-items:center;gap:22px;background:rgba(255,255,255,.03);text-align:left}
.dex{font-size:13px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
.score{font-family:'Bebas Neue',sans-serif;font-size:56px;line-height:1;color:var(--yellow)}
.score small{font-size:26px;color:#fff;margin-right:6px}
.arrow{color:var(--green);font-size:22px;margin-left:6px}
.persona{font-size:20px;font-weight:600}
.line{font-size:16px;color:var(--muted)}
.soon{margin-top:34px;display:inline-block;font-weight:700;letter-spacing:.24em;text-transform:uppercase;font-size:14px;color:var(--navy);background:var(--yellow);padding:9px 18px;border-radius:999px}
footer{text-align:center;padding:22px;font-size:14px;color:var(--muted);position:relative}
footer a{color:var(--muted)}
@media (max-width:480px){.card{flex-direction:column;text-align:center;gap:10px}}
</style>
</head>
<body>
<div class="court"></div>
<main>
  <img class="brand" src="/assets/deuce-and-smash-logo.png" alt="Deuce &amp; Smash">
  <div class="by">presents</div>
  <h1>Smash<span>Dex</span></h1>
  <p class="tag">Your SDX Rating. Your rivals. Your record. Every set you play at the club, counted.</p>
  <div class="card" aria-hidden="true">
    <div>
      <div class="dex">Dex #0001</div>
      <div class="score"><small>SDX</small>?.???<span class="arrow">▲</span></div>
    </div>
    <div>
      <div class="persona">Persona: classified</div>
      <div class="line">Still being decided by the algorithm. Keep playing.</div>
    </div>
  </div>
  <div class="soon">Coming soon</div>
</main>
<footer>
  <a href="https://deuceandsmash.com/">deuceandsmash.com</a> · Ivory Estate, Baner, Pune · <a href="/admin/">Club staff</a>
</footer>
</body>
</html>
