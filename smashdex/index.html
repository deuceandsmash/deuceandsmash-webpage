<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SmashDex — by Deuce &amp; Smash</title>
<meta name="description" content="SmashDex by Deuce & Smash: your SDX Rating, match history and Matchup Dex.">
<meta property="og:title" content="SmashDex — by Deuce & Smash">
<meta property="og:description" content="Your SDX Rating. Your rivals. Your record.">
<meta name="theme-color" content="#0E0E2C">
<link rel="icon" type="image/png" href="/assets/smashdex/favicon-64.png">
<link rel="apple-touch-icon" href="/assets/smashdex/apple-touch-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0E0E2C; --deep:#17173F; --line:rgba(237,237,247,.12); --line2:rgba(237,237,247,.22);
  --text:#EDEDF7; --muted:rgba(237,237,247,.62); --faint:rgba(237,237,247,.38);
  --yellow:#F5D628; --green:#7DC515; --orange:#E05A00; --blue:#1A6FD4;
  --head:'Bebas Neue',Impact,sans-serif; --ui:'Barlow',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--navy);color:var(--text);font-family:var(--ui);font-size:16px;line-height:1.5;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--yellow)}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px;border-radius:6px}
.hidden{display:none!important}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Split-flap tiles: Night Court. --h on the container sets the size */
.tiles{display:inline-flex;align-items:center;gap:calc(var(--h) * .07);--top:#2A2A60;--bot:#1E1E4A;--fg:#E2E41F}
.flap{--r:calc(var(--h) * .087);--half:144ms;position:relative;display:inline-block;flex:none;width:calc(var(--h) * .69);height:var(--h);perspective:calc(var(--h) * 4)}
.flap.dx{--fg:#5AA6F7} .flap.dg{--fg:#F5D628} .flap.gapL{margin-left:calc(var(--h) * .1)}
.flap>span{position:absolute;left:0;right:0;height:50%;overflow:hidden}
.flap>.t,.flap>.ft{top:0;background:var(--top);border-radius:var(--r) var(--r) 0 0}
.flap>.b,.flap>.fb{bottom:0;background:var(--bot);border-radius:0 0 var(--r) var(--r)}
.flap>.b{box-shadow:0 2px 0 rgba(0,0,0,.45)}
.flap i{display:flex;align-items:center;justify-content:center;height:var(--h);padding-top:calc(var(--h) * .09);box-sizing:border-box;font:400 calc(var(--h) * .885)/1 var(--head);font-style:normal;color:var(--fg)}
.flap>.b i,.flap>.fb i{margin-top:calc(var(--h) / -2)}
.flap>.ft{transform-origin:50% 100%;backface-visibility:hidden}
.flap>.fb{transform-origin:50% 0;backface-visibility:hidden}
.flap::after{content:"";position:absolute;left:0;right:0;top:calc(50% - 1px);height:2px;background:#07071A}
.flap.go>.ft{animation:flapT var(--half) cubic-bezier(.55,0,.9,.4) both}
.flap.go>.fb{animation:flapB var(--half) cubic-bezier(.2,.9,.35,1.15) var(--half) both}
@keyframes flapT{from{transform:rotateX(0deg);filter:brightness(1)}to{transform:rotateX(-90deg);filter:brightness(.5)}}
@keyframes flapB{from{transform:rotateX(90deg);filter:brightness(1.4)}to{transform:rotateX(0deg);filter:brightness(1)}}
@media (prefers-reduced-motion:reduce){.flap.go>.ft,.flap.go>.fb{animation:none}}
.tiles .dot{flex:none;width:calc(var(--h) * .22);height:var(--h);display:flex;align-items:flex-end;justify-content:center;padding-bottom:calc(var(--h) * .12);box-sizing:border-box}
.tiles .dot::before{content:"";width:calc(var(--h) * .13);height:calc(var(--h) * .13);border-radius:2px;background:#F5D628}
.gate-logo{--h:min(58px, calc((100vw - 64px) / 6.3));margin:14px 0 10px}
.bar .tiles{--h:22px}
@media (max-width:370px){.bar img{display:none}}
.sdx .score .tiles{--h:clamp(42px, 12.4vw, 62px)}
.wrap{max-width:520px;margin:0 auto;padding:0 18px calc(96px + env(safe-area-inset-bottom))}

.bar{position:sticky;top:0;z-index:20;background:rgba(14,14,44,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar-in{max-width:520px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:10px}
.bar img{height:22px;display:block}
.bar .app{font-family:var(--head);font-size:24px;letter-spacing:.02em;line-height:1}
.bar .app b{color:var(--yellow);font-weight:400}
.bar .sp{flex:1}
.icon-btn{background:none;border:1px solid var(--line2);border-radius:999px;padding:6px 12px;font-size:14px;color:var(--muted)}

.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 20px}
.gate-in{width:100%;max-width:380px;text-align:center}
.gate-in .logo{width:230px;max-width:70%;display:block;margin:0 auto 4px}
.gate-in h1{font-family:var(--head);font-weight:400;font-size:clamp(56px,19vw,84px);line-height:.9;margin:6px 0 4px}
.gate-in h1 b{color:var(--yellow);font-weight:400}
.gate-in p.lead{color:var(--muted);margin-bottom:26px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:transparent;border-radius:12px;padding:12px 16px;font-weight:600}
.btn.full{width:100%}
.btn.primary{background:var(--yellow);color:var(--navy);border-color:var(--yellow)}
.btn.danger{background:var(--orange);border-color:var(--orange);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.or{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:14px;margin:18px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.field{display:block;text-align:left;margin-bottom:12px}
.field span{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
.field input,.field select{width:100%;background:var(--deep);border:1px solid var(--line2);border-radius:10px;padding:11px 12px;color:var(--text);outline:none}
.field input:focus,.field select:focus{border-color:var(--yellow)}
.msg{min-height:22px;font-size:14px;margin-top:10px;color:var(--muted)}
.msg.err{color:#ff9a6b}
.note{font-size:13px;color:var(--muted);text-align:left;margin:-4px 0 14px;line-height:1.45}
.step{display:inline-block;font-size:13px;font-weight:600;color:var(--navy);background:var(--yellow);border-radius:999px;padding:2px 10px;margin-bottom:10px}
fieldset.q{border:0;text-align:left;margin:4px 0 14px}
fieldset.q legend{font-size:14px;color:var(--muted);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{position:relative}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips span{display:inline-block;border:1px solid var(--line2);border-radius:999px;padding:7px 12px;font-size:14px;cursor:pointer}
.chips input:checked+span{border-color:var(--yellow);background:rgba(245,214,40,.12);color:var(--yellow)}
.chips input:focus-visible+span{outline:2px solid var(--yellow);outline-offset:2px}
.linkish{background:none;border:0;color:var(--yellow);text-decoration:underline;font-size:14px;padding:4px}

.who{display:flex;align-items:center;gap:14px;padding:22px 0 16px}
.av{flex:none;width:64px;height:64px;border-radius:50%;background:var(--deep);border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;font-family:var(--head);font-size:28px;letter-spacing:.04em}
.av.sm{width:30px;height:30px;font-size:14px;border-width:1px}
.who h2{font-size:22px;font-weight:700;line-height:1.15}
.who .sub{color:var(--muted);font-size:14px}
.who .edit{margin-left:auto;padding:8px 14px}
.pgrid>.sec{min-width:0}

/* The SDX scorecard: the one loud element on the page */
.sdx{position:relative;display:block;width:100%;text-align:left;border:1px solid rgba(245,214,40,.35);border-radius:22px;padding:22px 22px 18px;background:linear-gradient(180deg,rgba(26,111,212,.18),rgba(14,14,44,0) 70%),var(--deep);overflow:hidden;color:var(--text)}
.sdx .k{position:relative;font-size:15px;color:var(--muted)}
.sdx .score{position:relative;display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;margin:8px 0 10px}
.sdx .mv{font-family:var(--head);font-size:28px;line-height:1;padding-top:4px}
.up{color:var(--green)} .down{color:#ff8a4c}
.sdx .persona{position:relative;font-weight:700;font-size:18px}
.sdx .line{position:relative;color:var(--muted);font-size:15px}
.sdx .foot{position:relative;display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.chip{display:inline-block;border-radius:999px;padding:1px 10px;font-size:13px;font-weight:700;border:1px solid currentColor}
.chip.Low{color:#ff9a6b} .chip.Medium{color:var(--yellow)} .chip.High{color:var(--green)}
.sdx::before{content:"";position:absolute;right:-30px;bottom:-40px;width:214px;height:250px;background:url(/assets/smashdex/mascot-ghost.webp) no-repeat center/contain;opacity:.04;transform:rotate(-7deg);pointer-events:none}
.sdx .more{margin-left:auto;display:inline-flex;align-items:center;gap:10px;color:var(--yellow);font-weight:600}
.sdx .go{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--yellow);color:var(--navy);transition:transform .2s ease}
.sdx .go svg{width:18px;height:18px}
.sdx:hover .go,.sdx:focus-visible .go{transform:translateX(3px)}
@media (prefers-reduced-motion:reduce){.sdx .go{transition:none}}

/* SDX explainer: topic cards */
.sx-top{display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px;margin:10px 0 4px}
.sx-top .n{font-family:var(--head);font-size:34px;line-height:1;color:var(--yellow)}
.grp{font-size:13px;font-weight:600;color:var(--muted);margin:22px 0 10px}
.tcards{display:grid;gap:10px}
.tc{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:14px;width:100%;text-align:left;border:1px solid var(--line2);border-radius:16px;padding:14px 14px 14px 12px;background:var(--deep);color:var(--text);transition:border-color .15s ease}
.tc:hover,.tc:focus-visible{border-color:var(--yellow)}
.tc-ic{position:relative;display:grid;place-items:center;width:44px;height:44px;border-radius:9px;background:linear-gradient(180deg,#2A2A60 0 50%,#1E1E4A 50% 100%);color:var(--yellow);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.tc-ic::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:#07071A}
.tc-ic svg{position:relative;z-index:1;width:22px;height:22px}
.tc-t b{display:block;font-size:16px}
.tc-t span{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.tc-r{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;white-space:nowrap}
.tc-r svg{width:18px;height:18px;color:var(--yellow)}
.tc.dim .tc-ic{color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--yellow);font-weight:600;font-size:15px;padding:4px 0;margin-bottom:10px}
.back svg{width:16px;height:16px}
.fcards{display:grid;gap:10px;margin-top:12px}
.fc{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:rgba(23,23,63,.6)}
.fc b{display:block}
.fc span{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.meter{height:10px;border-radius:999px;background:var(--deep);border:1px solid var(--line);overflow:hidden;margin:10px 0 6px}
.meter i{display:block;height:100%;border-radius:999px;background:var(--yellow)}
.meter.Low i{background:#ff9a6b}.meter.High i{background:var(--green)}

/* Preference editor */
.pq{border:0;margin:0 0 18px}
.pq legend{font-size:14px;color:var(--muted);margin-bottom:8px}
.pq .hint{font-size:13px;color:var(--faint);margin-top:6px}
.sides{display:grid;gap:8px}
.sides label{position:relative;display:block}
.sides input{position:absolute;opacity:0;pointer-events:none}
.sides .card{display:block;border:1px solid var(--line2);border-radius:14px;padding:12px 14px;cursor:pointer}
.sides .card b{display:block}
.sides .card small{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.sides input:checked+.card{border-color:var(--yellow);background:rgba(245,214,40,.08)}
.sides input:checked+.card b{color:var(--yellow)}
.sides input:focus-visible+.card{outline:2px solid var(--yellow);outline-offset:2px}
.pref .note{display:block;font-size:13px;font-weight:400;color:var(--muted);margin-top:2px}

.sec{margin-top:30px}
.sec-h{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;margin-bottom:10px}
.sec-h h3{font-family:var(--head);font-weight:400;font-size:30px;letter-spacing:.02em;line-height:1}
.sec-h .aside{margin-left:auto;font-size:14px;color:var(--muted)}
.form-line{margin-top:12px;font-size:15px;color:var(--text);padding-left:12px;border-left:3px solid var(--yellow)}

.strip{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:18px}
.strip div{padding:12px 4px;text-align:center}
.strip div+div{border-left:1px solid var(--line)}
.strip b{display:block;font-family:var(--head);font-weight:400;font-size:34px;line-height:1}
.strip span{font-size:13px;color:var(--muted)}

.seg{display:inline-flex;border:1px solid var(--line2);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:4px 12px;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--text);color:var(--navy);font-weight:600}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .tip{margin-top:8px;border:1px solid var(--line2);border-radius:14px;padding:12px 14px;font-size:14px;background:var(--deep)}
.tip .t1{display:flex;gap:8px;align-items:baseline}
.tip .t1 b{font-size:15px}
.tip .t1 .d{margin-left:auto;font-family:var(--head);font-size:22px}

.m{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"when res" "teams sets";gap:6px 12px;padding:14px 0;border-top:1px solid var(--line)}
.m .when{grid-area:when;font-size:13px;color:var(--muted);display:flex;gap:10px}
.m .res{grid-area:res;text-align:right;font-weight:700;font-size:13px}
.m .teams{grid-area:teams}
.m .sets{grid-area:sets}
.m .teams{display:grid;gap:6px;min-width:0}
.m .team{display:flex;align-items:center;gap:6px;font-size:15px;min-width:0;height:30px}
.m .team span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m .team.me{font-weight:700}
.m .sets{display:grid;grid-auto-flow:column;grid-template-rows:30px 30px;gap:6px 8px;align-items:center;justify-items:end}
/* Scoreboard tiles for every score (static, same look as the logo) */
.st{--sh:26px;display:inline-flex;gap:2px;vertical-align:middle}
.st i{position:relative;display:inline-flex;align-items:center;justify-content:center;width:calc(var(--sh) * .69);height:var(--sh);border-radius:calc(var(--sh) * .14);background:linear-gradient(180deg,#2A2A60 0%,#2A2A60 50%,#1E1E4A 50%,#1E1E4A 100%);box-shadow:0 2px 0 rgba(0,0,0,.4);padding-top:calc(var(--sh) * .09);box-sizing:border-box;font:400 calc(var(--sh) * .885)/1 var(--head);font-style:normal;color:#F5D628}
.st i::after{content:"";position:absolute;left:0;right:0;top:calc(50% - 1px);height:1.5px;background:#07071A}
.st.lo i{color:rgba(237,237,247,.42)}
.st.even i{color:var(--text)}
.score-line{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:6px 0 2px}
.score-pair{display:inline-flex;align-items:center;gap:5px}
.score-pair .dash{color:var(--faint);font-weight:600}
.tip .st{--sh:22px}
.pending{color:var(--yellow);font-weight:600}

.stat{display:flex;align-items:center;gap:18px}
.ring{flex:none}
.stat dl{display:grid;grid-template-columns:auto auto;gap:4px 18px;font-size:15px}
.stat dt{color:var(--muted)} .stat dd{font-weight:700}

.pref{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.pref .ic{width:28px;text-align:center;font-size:20px}
.pref .l{font-size:13px;color:var(--muted)}
.pref .v{font-weight:600}
.people{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.person{text-align:left;border:1px solid var(--line);border-radius:16px;padding:12px;background:none;color:var(--text)}
.person .nm{font-weight:700;margin-top:8px;line-height:1.2}
.person .ps{font-size:13px;color:var(--muted)}
.clubs{display:flex;flex-wrap:wrap;gap:10px}
.club{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 6px}
.club .ini{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--head);font-size:15px;background:var(--blue)}
.club.home .ini{background:var(--yellow);color:var(--navy)}
.empty{color:var(--muted);font-size:15px;padding:10px 0}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(14,14,44,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{background:none;border:0;padding:10px 4px 12px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.nav-brand,.nav-me{display:none}
.nav button svg{display:block}
.nav button.on{color:var(--yellow)}
.soon{padding:60px 10px;text-align:center}
.soon h3{font-family:var(--head);font-weight:400;font-size:44px;line-height:1}
.soon p{color:var(--muted);max-width:340px;margin:8px auto 0}

.sheet{position:fixed;inset:0;z-index:40;background:rgba(5,5,20,.65);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{position:relative;width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--navy);border:1px solid var(--line2);border-bottom:0;border-radius:24px 24px 0 0;padding:10px 20px calc(28px + env(safe-area-inset-bottom));animation:rise .22s ease-out}
@keyframes rise{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet-in{animation:none}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line2);margin:0 auto 14px}
.sheet h2{font-family:var(--head);font-weight:400;font-size:40px;line-height:1;padding-right:44px}
.sheet h4{font-size:17px;margin:24px 0 8px}
.sheet p{color:var(--muted);font-size:15px;margin-bottom:8px}
.sheet .close{position:sticky;top:0;float:right;background:var(--deep);border:1px solid var(--line2);border-radius:999px;width:36px;height:36px;font-size:16px;z-index:2}
.lv{display:grid;grid-template-columns:56px 1fr;gap:4px 12px;padding:12px 0;border-top:1px solid var(--line)}
.lv .rg{font-family:var(--head);font-size:24px;line-height:1.1;color:var(--muted)}
.lv b{display:block}
.lv span{font-size:14px;color:var(--muted)}
.lv.cur{background:rgba(245,214,40,.06);margin:0 -10px;padding:12px 10px;border-radius:12px}
.lv.cur .rg{color:var(--yellow)}
.lv .here{color:var(--yellow);font-weight:600;font-size:13px}
.factor{padding:10px 0;border-top:1px solid var(--line)}
.factor b{display:block}
.factor span{font-size:14px;color:var(--muted)}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line2);border-radius:14px;padding:14px;background:none;color:var(--text);margin-bottom:10px}
.opt .ic{font-size:22px;width:28px;text-align:center}
.opt .sub{display:block;font-size:13px;color:var(--muted)}
.warn{border-left:3px solid #ff8a4c;padding:8px 12px;margin:12px 0;font-size:15px;color:var(--text)}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}
.pick button{border:1px solid var(--line2);border-radius:12px;padding:10px;background:none;color:var(--text);text-align:left}
.pick button.on{border-color:var(--yellow);background:rgba(245,214,40,.08)}
.pick b{display:block;font-family:var(--head);font-weight:400;font-size:26px;line-height:1}
.pick span{font-size:13px;color:var(--muted)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px;margin:12px 0}

<body>

<section id="gate" class="gate">
  <div class="gate-in">

    <p class="lead">Your SDX Rating, your matches and your rivals, all in one place.</p>
    <div id="gateBody"><div class="spinner"></div></div>
    <div class="msg" id="gateMsg"></div>
  </div>
</section>

<div id="app" class="hidden">
  <header class="bar"><div class="bar-in">
    <img src="/assets/deuce-and-smash-logo.png" alt="Deuce &amp; Smash">
    <span id="barLogo"></span>

  <main class="wrap" id="view"></main>

    <div class="nav-brand"><span id="navLogo"></span><span id="navSdx"></span><span class="nav-by">by <img src="/assets/deuce-and-smash-logo.png" alt="Deuce &amp; Smash"></span></div>
    <button data-tab="profile" class="on"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg><span>Profile</span></button>
    <button data-tab="record"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Record score</span></button>
    <button data-tab="dex"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg><span>Matchup Dex</span></button>
    <button data-tab="honours"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="10" r="6"/><path d="M9 15l-2 6 5-3 5 3-2-6"/></svg><span>Honours</span></button>
    <div class="nav-me"><span class="av sm" id="navAv" aria-hidden="true"></span><span class="nav-me-txt"><b id="navName"></b><span id="navDex"></span></span><button class="nav-out" data-act="signout" aria-label="Sign out"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg><span>Sign out</span></button></div>
  </div></nav>
</div>

<div id="sheet" class="sheet hidden" role="dialog" aria-modal="true"><div class="sheet-in" id="sheetBody"></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, get, set, update, onValue, increment } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut,
  signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { DSR } from "/shared/dsr.js";

const app = initializeApp({
  apiKey: "AIzaSyDu7A0agFAT1jwfrjCRkQe6tHg2Qu_LnDc", authDomain: "deuceandsmash-club.firebaseapp.com",
  databaseURL: "https://deuceandsmash-club-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "deuceandsmash-club",
  storageBucket: "deuceandsmash-club.firebasestorage.app", messagingSenderId: "953747553630", appId: "1:953747553630:web:316645b323ae12019fa3cf"
});
const db = getDatabase(app), auth = getAuth(app);
const CLUB_WA = '919028337970';

/* Placeholder personas — to be revisited */
const BANDS = [
  { band: 'Beginner',          lo: 0, persona: 'Fresh Grip',         quip: 'Still negotiating a peace treaty with the back glass.',
    about: 'New to padel or racquet sports. Getting the ball back over the net is a win, and the walls are still a mystery.' },
  { band: 'Beginner+',         lo: 1, persona: 'Wall Whisperer',     quip: "The glass has started talking back, and they're starting to listen.",
    about: 'Rallies are happening. Starting to let the ball come off the back glass, with a steadier serve and positioning still in progress.' },
  { band: 'Lower Intermediate', lo: 2, persona: 'Bandeja Apprentice', quip: 'Has discovered the bandeja and will not stop telling people about it.',
    about: 'Knows the main shots and keeps regular rallies going. Building control at the net and confidence off the walls.' },
  { band: 'Intermediate',      lo: 3, persona: 'Lob Architect',      quip: 'Builds points one lob at a time. Patience of a monk, cunning of a cat.',
    about: 'Consistent at medium pace. Lobs and volleys with a purpose, and moves as a pair with their partner. Earned through match play.' },
  { band: 'Intermediate High', lo: 4, persona: 'Víbora Venom',       quip: 'Slices with intent. Opponents report mild emotional damage.',
    about: 'Controls the pace of a rally, finishes overheads and punishes loose balls. Reads where the next shot is going.' },
  { band: 'Advanced',          lo: 5, persona: 'Net Bandit',         quip: 'Steals points at the net and sleeps perfectly well afterwards.',
    about: 'Strong in every part of the game and competitive in tournaments. Wins points with tactics as much as power.' },
  { band: 'Elite',             lo: 6, persona: 'Por Tres Royalty',   quip: 'Their smashes leave the court. Some have not been seen since.',
    about: 'Top regional or national level. Rare air at any club.' },
];
const bandOf = r => { let b = BANDS[0]; for (const x of BANDS) if (r >= x.lo - 1e-9) b = x; return b; };

/* State */
const S = { user: null, mid: null, profiles: {}, matches: {}, adjustments: {}, clubs: {}, mine: {}, ratings: {}, ms: [], outcomes: {},
  tab: 'profile', chartN: 10, sel: null, showAll: false, ready: { profiles: false, matches: false, adjustments: false } };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sdx = r => (Math.round(r * 1000) / 1000).toFixed(3);
const sgn = d => (d > 0 ? '+' : d < 0 ? '−' : '±') + Math.abs(d).toFixed(3);
const initials = n => String(n || '?').replace(/[^\p{L}\p{N}\s]/gu, ' ').trim().split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase() || '?';
const todayUTC = () => new Date().toISOString().split('T')[0];
const todayLocal = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const fmtDate = d => { try { return new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); } catch { return d; } };
const dexLabel = n => n ? `Dex #${String(n).padStart(4, '0')}` : '';
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00:00Z') - new Date(a + 'T00:00:00Z')) / 864e5);
const avg = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0;
function toast(t, ms = 2600) { document.querySelectorAll('.toast').forEach(x => x.remove()); const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), ms); }
const waLink = text => `https://wa.me/${CLUB_WA}?text=${encodeURIComponent(text)}`;

/* ── Split-flap logo and score (Night Court, 300 ms per flip) ── */
const FLIP_MS = 300, INTRO_FLIP_MS = 300, INTRO_HOLD_MS = 1000, IDLE_AFTER_MS = 10000, IDLE_EVERY_MS = 20000, IDLE_MAX_RUNS = 5;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const flapHTML = (ch, cls = '') => `<span class="flap ${cls}" data-c="${ch}" data-final="${ch}"><span class="t"><i>${ch}</i></span><span class="b"><i>${ch}</i></span><span class="ft"><i>${ch}</i></span><span class="fb"><i>${ch}</i></span></span>`;
const logoHTML = cls => `<span class="tiles ${cls}" role="img" aria-label="SmashDex">${'SMASHDEX'.split('').map((c, i) => flapHTML(c, (i < 5 ? '' : 'dx') + (i === 5 ? ' gapL' : ''))).join('')}</span>`;
const digitsHTML = str => str.split('').map(c => c === '.' ? '<span class="dot"></span>' : flapHTML(c, 'dg')).join('');
function setFlap(el, ch, ms = FLIP_MS) {
  el.style.setProperty('--half', Math.round(ms / 2) - 6 + 'ms');
  const prev = el.dataset.c, [t, b, ft, fb] = el.children;
  t.firstChild.textContent = ch; fb.firstChild.textContent = ch;
  b.firstChild.textContent = REDUCED ? ch : prev; ft.firstChild.textContent = REDUCED ? ch : prev;
  el.dataset.c = ch;
  if (REDUCED) return;
  el.classList.remove('go'); void el.offsetWidth; el.classList.add('go');
}
const _flapTimers = new Map();
function playFlap(el, seq, start, ms = FLIP_MS) {
  (_flapTimers.get(el) || []).forEach(clearTimeout);
  _flapTimers.set(el, seq.map((ch, k) => setTimeout(() => setFlap(el, ch, ms), start + k * ms)));
  return start + seq.length * ms;
}
let _lastLogoRun = 0, _idleRuns = 0, _lastInput = Date.now();
// Returns how long until the last tile lands (ms)
function runLogo(root, { intro = false } = {}) {
  if (!root || REDUCED) return 0;
  _lastLogoRun = Date.now();
  const AZ = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', ms = intro ? INTRO_FLIP_MS : FLIP_MS;
  let end = 0;
  root.querySelectorAll('.flap').forEach((el, i) => {
    const final = el.dataset.final || 'SMASHDEX'[i];
    const n = intro ? 2 + Math.floor(i / 4) : 3 + i;
    const seq = Array.from({ length: n }, () => AZ[Math.floor(Math.random() * 26)]).concat(final);
    end = Math.max(end, playFlap(el, seq, i * (intro ? 110 : 70), ms));
  });
  return end;
}
// SDX digits flip only when the score changes, counting through the digits in between
function animateSdx(target) {
  const box = document.getElementById('sdxDigits'); if (!box) return;
  const shown = S.shownSdx; S.shownSdx = target;
  if (shown == null || shown === target) return;
  const up = +target > +shown;
  box.querySelectorAll('.flap').forEach((el, k) => {
    const pos = [0, 2, 3, 4][k], from = shown[pos], to = target[pos];
    if (from === to) return;
    const seq = []; let c = +from;
    while (String(c) !== to && seq.length < 10) { c = (c + (up ? 1 : 9)) % 10; seq.push(String(c)); }
    playFlap(el, seq, k * 90);
  });
}
$('#gateLogo').outerHTML = logoHTML('gate-logo');
$('#barLogo').outerHTML = logoHTML('bar-logo');
$('#navLogo').innerHTML = logoHTML('nav-logo');
$('#navSdx').innerHTML = `<span class="tiles nav-sdx" role="img" aria-label="SmashDex">${flapHTML('S')}${flapHTML('D', 'dx')}${flapHTML('X', 'dx')}</span>`;
// The logo that is actually on screen at this width
const visibleLogo = () => !$('#app').classList.contains('hidden')
  ? ['.bar-logo', '.nav-logo', '.nav-sdx'].map(q => $(q)).find(el => el && el.offsetParent !== null)
  : $('.gate-logo');
const _introReadyAt = Date.now() + runLogo($('.gate-logo'), { intro: true }) + (REDUCED ? 0 : INTRO_HOLD_MS);
// Idle re-flip: every 20 s, only while the page is on screen and untouched for 10 s; pauses after 5 idle flips until the next tap or scroll
['pointerdown', 'keydown', 'touchstart', 'wheel', 'scroll'].forEach(ev => addEventListener(ev, () => { _lastInput = Date.now(); _idleRuns = 0; }, { passive: true }));
setInterval(() => {
  if (document.visibilityState !== 'visible' || !$('#sheet').classList.contains('hidden')) return;
  const now = Date.now();
  if (now - _lastInput < IDLE_AFTER_MS || now - _lastLogoRun < IDLE_EVERY_MS || _idleRuns >= IDLE_MAX_RUNS) return;
  _idleRuns++;
  runLogo(visibleLogo());
}, 1000);

/* ── Usage analytics (counts only; read by club staff in /admin) ── */
const _ss = { get(k) { try { return sessionStorage.getItem(k); } catch { return null; } }, set(k, v) { try { sessionStorage.setItem(k, v); } catch {} } };
function track(ev, { once = false } = {}) {
  try {
    if (!S.user) return;
    if (once) { if (_ss.get('sdx_ev_' + ev)) return; _ss.set('sdx_ev_' + ev, '1'); }
    const day = todayLocal(), upd = { [`analytics/daily/${day}/events/${ev}`]: increment(1) };
    if (S.mid) upd[`analytics/members/${S.mid}/events/${ev}`] = increment(1);
    update(ref(db), upd).catch(() => {});
  } catch {}
}
// A visit = opening SmashDex, or coming back after 30+ minutes away
function trackVisit() {
  if (!S.mid) return;
  const last = +(_ss.get('sdx_last') || 0), nowMs = Date.now();
  _ss.set('sdx_last', String(nowMs));
  if (nowMs - last < 30 * 60 * 1000) return;
  const day = todayLocal();
  const upd = { [`analytics/members/${S.mid}/visits`]: increment(1), [`analytics/members/${S.mid}/lastSeen`]: nowMs,
    [`analytics/daily/${day}/visits`]: increment(1), [`analytics/daily/${day}/users/${S.mid}`]: true };
  update(ref(db), upd).catch(() => {});
  get(ref(db, `analytics/members/${S.mid}/firstSeen`)).then(sn => { if (!sn.exists()) set(ref(db, `analytics/members/${S.mid}/firstSeen`), nowMs).catch(() => {}); }).catch(() => {});
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.mid) trackVisit(); });
// Which profile sections people actually scroll to (once per visit)
let _io = null;
function watchSections() {
  if (!('IntersectionObserver' in window)) return;
  _io?.disconnect();
  _io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { track('see_' + e.target.dataset.sec, { once: true }); _io.unobserve(e.target); } }), { threshold: 0.4 });
  document.querySelectorAll('[data-sec]').forEach(el => _io.observe(el));
}

/* ── Sign-in ── */
const provider = new GoogleAuthProvider(); provider.setCustomParameters({ prompt: 'select_account' });
let MODE = 'in';
function gate(html, msg = '', err = false) { $('#app').classList.add('hidden'); $('#gate').classList.remove('hidden'); $('#gateBody').innerHTML = html; $('#gateMsg').textContent = msg; $('#gateMsg').className = 'msg' + (err ? ' err' : ''); }
const signInHTML = () => `
  <p class="note" style="text-align:center;margin:0 0 16px">Signing in for the first time? It's a one-time step that connects SmashDex to your club profile. You'll stay signed in on this device.</p>
  <button class="btn primary full" data-act="google">Continue with Google</button>
  <div class="or">or use your email</div>
  <form id="emailForm" autocomplete="on">
    <label class="field"><span>Email</span><input type="email" name="email" required autocomplete="email"></label>
    <label class="field"><span>Password</span><input type="password" name="password" required minlength="6" autocomplete="${MODE === 'up' ? 'new-password' : 'current-password'}"></label>
    <button class="btn full" type="submit">${MODE === 'up' ? 'Create account' : 'Sign in'}</button>
  </form>
  <p style="margin-top:12px;font-size:14px;color:var(--muted)">${MODE === 'up'
    ? 'Already have an account? <button class="linkish" data-act="mode-in">Sign in</button>'
    : 'New to SmashDex? <button class="linkish" data-act="mode-up">Create an account</button> or <button class="linkish" data-act="reset">reset your password</button>'}</p>`;

document.addEventListener('click', async ev => {
  const a = ev.target.closest('[data-act]')?.dataset.act; if (!a) return;
  if (a === 'signout') return signOut(auth);
  if (a === 'google') {
    try { await signInWithPopup(auth, provider); S._method = 'signin_google'; }
    catch (e) { if (['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment'].includes(e.code)) return signInWithRedirect(auth, provider);

/* Scores always show as scoreboard tiles. cls: '' (winning side), 'lo' (losing side), 'even' (level) */
const scoreTiles = (n, cls = '') => `<span class="st ${cls}" role="img" aria-label="${n}">${String(n ?? '–').split('').map(d => `<i aria-hidden="true">${esc(d)}</i>`).join('')}</span>`;
const tileCls = (mine, th) => mine > th ? '' : mine < th ? 'lo' : 'even';
// One line of set scores from one side's point of view, e.g. [6]–[3]  [4]–[6]
const scoreLineHTML = (m, side) => `<span class="score-line">${setsOf(m).map(s => { const a = side === 'B' ? s.b : s.a, b = side === 'B' ? s.a : s.b;
  return `<span class="score-pair">${scoreTiles(a, tileCls(a, b))}<span class="dash" aria-hidden="true">–</span>${scoreTiles(b, tileCls(b, a))}</span>`; }).join('')}</span>`;

/* ── Progression chart ── */
function chartPoints() {
  const p = playerOf(myName()), pts = [];
  for (const h of p.hist || []) {
    const last = pts[pts.length - 1];
    if (!h.manual && last && !last.manual && last.id === h.id) { last.r = h.r; last.delta += h.delta; continue; }
    pts.push({ ...h });
  }
  return pts;
}
function drawChart() {
  const el = $('#chart'); if (!el) return;
  const all = chartPoints();
  if (!all.length) { el.innerHTML = `<p class="empty">Your SDX line starts with your first match.</p>`; return; }
  let pts = [{ r: all[0].r - all[0].delta, start: true }, ...all];
  if (S.chartN) pts = pts.slice(-(S.chartN + 1));
  const W = Math.max(300, Math.round(el.clientWidth || 340)), Hh = W > 520 ? 220 : 170, pad = 14;
  const rs = pts.map(x => x.r), lo = Math.min(...rs), hi = Math.max(...rs), span = Math.max(0.05, hi - lo);
  const X = i => pad + (W - 2 * pad - 30) * (pts.length === 1 ? 0.5 : i / (pts.length - 1));
  const Y = r => pad + (Hh - 2 * pad) * (1 - (r - lo) / span);
  const path = pts.map((q, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(q.r).toFixed(1)}`).join(' ');
  const area = `${path} L${X(pts.length - 1).toFixed(1)},${Hh - pad} L${X(0).toFixed(1)},${Hh - pad} Z`;
  const selIdx = S.sel != null && S.sel < pts.length ? S.sel : pts.length - 1;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="SDX progression from ${sdx(pts[0].r)} to ${sdx(pts[pts.length - 1].r)}">
    <defs><linearGradient id="gA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1A6FD4" stop-opacity=".45"/><stop offset="1" stop-color="#1A6FD4" stop-opacity="0"/></linearGradient></defs>
    <line x1="${pad}" y1="${Y(hi)}" x2="${W - 34}" y2="${Y(hi)}" stroke="rgba(237,237,247,.1)" stroke-dasharray="3 5"/>
    <line x1="${pad}" y1="${Y(lo)}" x2="${W - 34}" y2="${Y(lo)}" stroke="rgba(237,237,247,.1)" stroke-dasharray="3 5"/>
    <text x="${W}" y="${Y(hi) + 4}" text-anchor="end" fill="rgba(237,237,247,.55)" font-size="11">${hi.toFixed(2)}</text>
    <text x="${W}" y="${Y(lo) + 4}" text-anchor="end" fill="rgba(237,237,247,.55)" font-size="11">${lo.toFixed(2)}</text>
    <path d="${area}" fill="url(#gA)"/><path d="${path}" fill="none" stroke="#6FA8F0" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.map((q, i) => q.manual
      ? `<g data-i="${i}" style="cursor:pointer" role="button" aria-label="Manual adjustment"><line x1="${X(i)}" y1="${pad}" x2="${X(i)}" y2="${Hh - pad}" stroke="#ff8a4c" stroke-dasharray="3 4" stroke-width="1.5"/><circle cx="${X(i)}" cy="${Y(q.r)}" r="${i === selIdx ? 11 : 8}" fill="#ff8a4c"/><text x="${X(i)}" y="${Y(q.r) + 4}" text-anchor="middle" font-size="11" font-weight="700" fill="#0E0E2C">M</text></g>`
      : `<circle data-i="${i}" cx="${X(i)}" cy="${Y(q.r)}" r="${i === selIdx ? 9 : 4.5}" fill="${i === selIdx ? '#F5D628' : '#6FA8F0'}" stroke="${i === selIdx ? 'rgba(245,214,40,.35)' : 'transparent'}" stroke-width="10" style="cursor:pointer"/>`).join('')}
  </svg><div class="tip" aria-live="polite">${tipHTML(pts[selIdx])}</div>`;
  el.querySelectorAll('[data-i]').forEach(n => n.addEventListener('click', () => { S.sel = +n.dataset.i; track('chart_point'); drawChart(); }));
}
function tipHTML(q) {
  if (q.start) return `<div class="t1"><b>Where this view starts</b><span class="d">SDX ${sdx(q.r)}</span></div>`;
  if (q.manual) return `<div class="t1"><b>${q.by === 'admin' ? 'Adjusted by club staff' : 'Self adjustment'}</b><span class="d down">${sgn(q.delta)}</span></div><div style="color:var(--muted)">${fmtDate(q.date)} · this level change was made manually. SDX set to ${sdx(q.r)}.</div>`;
  const m = S.ms.find(x => x.id === q.id); if (!m) return '';
  const me = myName(), side = sideOf(m, me), mates = ((side === 'A' ? m.teamA : m.teamB) || []).filter(n => n !== me), opp = (side === 'A' ? m.teamB : m.teamA) || [];
  return `<div class="t1"><b>${fmtDate(m.date)}</b><span class="d ${q.delta >= 0 ? 'up' : 'down'}">${sgn(q.delta)}</span></div>
    <div style="color:var(--muted)">With ${mates.map(esc).join(' & ') || '—'} against ${opp.map(esc).join(' & ')}</div>
    ${scoreLineHTML(m, side)}
    <div style="color:var(--muted)">SDX ${sdx(q.r)} afterwards.</div>`;
}
document.addEventListener('click', e => {
  const n = e.target.closest('#seg [data-n]'); if (n) { S.chartN = +n.dataset.n; S.sel = null; track('chart_range'); render(); }
  if (e.target.closest('[data-act=allmatches]')) { S.showAll = true; track('matches_all'); render(); }
  if (e.target.closest('a[href^="https://wa.me/"]')) track('whatsapp_staff');
  const o = e.target.closest('[data-open]'); if (o) openSheet(o.dataset.open);
  const pl = e.target.closest('[data-player]'); if (pl) openSheet('player', pl.dataset.player);
});

/* ── Sheets ── */
function sheet(html, wide = false) { $('#sheetBody').classList.toggle('wide', wide); $('#sheetBody').innerHTML = `<button class="close" data-close aria-label="Close">✕</button><div class="grab"></div>${html}`; $('#sheet').classList.remove('hidden'); document.body.style.overflow = 'hidden'; $('#sheetBody').scrollTop = 0; }
function closeSheet() { $('#sheet').classList.add('hidden'); document.body.style.overflow = ''; }
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet' || e.target.closest('[data-close]')) closeSheet(); });
addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
let _rz = null; addEventListener('resize', () => { clearTimeout(_rz); _rz = setTimeout(() => { if (S.tab === 'profile' && $('#chart')) drawChart(); }, 150); });
const staffLink = (me, p) => waLink(`Hi Deuce & Smash, I'd like my SmashDex level reviewed. Name: ${me}, ${dexLabel(S.profiles[S.mid]?.dexNo)}, current SDX ${sdx(p.r)}.`);

function openSheet(kind, arg) {
  track({ sdx: 'sdx_explainer', 'sdx-levels': 'sdx_levels', 'sdx-conf': 'sdx_confidence', 'sdx-moves': 'sdx_moves', raise: 'raise_info', lower: 'lower_info', edit: 'edit_open', prefs: 'prefs_open', player: 'player_card' }[kind] || kind);
  const me = myName(), p = playerOf(me), b = bandOf(p.r), conf = p.confidence || 0, cl = DSR.confidenceLabel(conf);
  const backBtn = `<button class="back" data-open="sdx">${ICON.back}Your SDX</button>`;
  const tc = (open, ic, title, desc, right = '', dim = false) => `<button class="tc${dim ? ' dim' : ''}" data-open="${open}"><span class="tc-ic">${ICON[ic]}</span><span class="tc-t"><b>${title}</b><span>${desc}</span></span><span class="tc-r">${right}${ICON.chev}</span></button>`;
  const used = S.adjustments[S.mid]?.self;
  if (kind === 'sdx') return sheet(`
    <h2>Your SDX Rating</h2>
    <div class="sx-top"><span class="n">SDX ${sdx(p.r)}</span><span><b>${esc(b.persona)}</b> <span style="color:var(--muted)">· ${esc(b.band)}</span></span></div>
    <p>Your SDX runs from 0 to 7 and moves with every confirmed set you play.</p>

    <h4 class="grp">Understand your SDX</h4>
    <div class="tcards">
      ${tc('sdx-levels', 'levels', 'SDX levels', `Seven levels, from ${esc(BANDS[0].persona)} to ${esc(BANDS[BANDS.length - 1].persona)}.`, `${b.lo}–${b.lo + 1}`)}
      ${tc('sdx-conf', 'conf', 'Confidence', 'How settled your rating is, and what firms it up.', `<span class="chip ${cl}">${conf}%</span>`)}
      ${tc('sdx-moves', 'moves', 'What moves your SDX', 'Results, who was on court, and the type of match.')}
    </div>

    <h4 class="grp">Change your level</h4>
    <div class="tcards">
      ${tc('raise', 'raise', 'Raise your level', 'Play your way up, or ask club staff to review your level.')}
      ${tc('lower', 'lower', 'Lower your level', used ? 'Already used. Further changes need club staff.' : 'A one-time adjustment you can make yourself.', '', !!used)}
    </div>`);

  if (kind === 'sdx-levels') return sheet(`
    ${backBtn}
    <h2>SDX levels</h2>
    <p style="margin-top:8px">Each level spans one point of SDX. Your level updates as soon as your rating crosses into a new range.</p>
    <div style="margin-top:12px">${BANDS.map(x => `<div class="lv ${x === b ? 'cur' : ''}"><div class="rg">${x.lo}–${x.lo + 1}</div><div><b>${esc(x.band)}: ${esc(x.persona)}${x === b ? ' <span class="here">You are here</span>' : ''}</b><span>${esc(x.about)}</span></div></div>`).join('')}</div>`);

  if (kind === 'sdx-conf') return sheet(`
    ${backBtn}
    <h2>Confidence</h2>
    <div class="sx-top"><span class="n">${conf}%</span><span class="chip ${cl}">${cl}</span></div>
    <div class="meter ${cl}" role="img" aria-label="Confidence ${conf}%"><i style="width:${Math.max(3, conf)}%"></i></div>
    <p>Confidence shows how settled your SDX is. A new rating starts as a best guess and firms up as SmashDex sees more of your game. Three things build it.</p>
    <div class="fcards">
      <div class="fc"><b>How much you've played</b><span>More confirmed sets give a clearer picture of your level.</span></div>
      <div class="fc"><b>Who you've played with and against</b><span>A wide mix of partners and opponents tells us more than the same four players every week.</span></div>
      <div class="fc"><b>How recently you've played</b><span>Confidence fades during long breaks and builds back as you return to the court.</span></div>
    </div>`);

  if (kind === 'sdx-moves') return sheet(`
    ${backBtn}
    <h2>What moves your SDX</h2>
    <p style="margin-top:8px">Every confirmed set nudges your SDX up or down. How far depends on these.</p>
    <div class="fcards two-up">
      <div class="fc"><b>The result, and how close it was</b><span>Every set counts on its own. A tight set moves ratings less than a one-sided one.</span></div>
      <div class="fc"><b>Who was on court</b><span>Beating a stronger pair is worth more than beating a weaker one, and losing to a stronger pair costs less. Your partner's level counts too.</span></div>
      <div class="fc"><b>How settled your rating is</b><span>With low confidence your SDX moves in bigger steps, so it finds your level quickly. As confidence grows, the steps get smaller.</span></div>
      <div class="fc"><b>The type of match</b><span>Open play and competitive matches count in full. Social formats like Americano count for less.</span></div>
      <div class="fc"><b>Coming back from a break</b><span>Your first matches after a long gap move your SDX a little more while it catches up with you.</span></div>
      <div class="fc"><b>Only confirmed scores count</b><span>A pending or disputed score never moves your SDX.</span></div>
    </div>`);

  if (kind === 'raise') return sheet(`
    ${backBtn}
    <h2>Raise your level</h2>
    <p>Your SDX rises by playing. Win sets, especially against stronger pairs, and it climbs on its own.</p>
    <p>If you think your starting level was set too low, club staff can review it with you.</p>
    <a class="btn primary full" style="text-decoration:none;margin-top:10px" target="_blank" rel="noopener" href="${staffLink(me, p)}">Ask club staff on WhatsApp</a>
    <button class="btn full" style="margin-top:10px" data-open="sdx">Back</button>`);

  if (kind === 'lower') {
    if (used) return sheet(`
      ${backBtn}
      <h2>Lower your level</h2>
      <p>You lowered your level on <b>${fmtDate(used.date)}</b>, from SDX ${sdx(used.from)} to SDX ${sdx(used.to)}. A self adjustment can be made only once.</p>
      <p>Any further change to your level needs approval from club staff.</p>
      <a class="btn primary full" style="text-decoration:none;margin-top:10px" target="_blank" rel="noopener" href="${staffLink(me, p)}">Ask club staff on WhatsApp</a>
      <button class="btn full" style="margin-top:10px" data-open="sdx">Back</button>`);
    const steps = [0.5, 1, 1.5, 2].filter(k => p.r - k >= 0);
    if (!steps.length) return sheet(`<h2>Lower your level</h2><p>Your SDX is already at the bottom of the scale.</p><button class="btn full" data-open="sdx">Back</button>`);
    S.lowerBy = steps.includes(S.lowerBy) ? S.lowerBy : steps[0];
    return sheet(`
      ${backBtn}
      <h2>Lower your level</h2>
      <p>If your SDX feels higher than where you really play, you can lower it so your matches are fairer and more fun.</p>
      <div class="pick" id="lowerPick">${steps.map(k => { const to = p.r - k; return `<button data-k="${k}" class="${S.lowerBy === k ? 'on' : ''}"><b>SDX ${sdx(to)}</b><span>Down ${k.toFixed(1)}, ${esc(bandOf(to).band)}</span></button>`; }).join('')}</div>
      <div class="warn"><b>Once lowered, your SDX can only be increased by playing more matches, based on your performance in those matches.</b></div>
      <div class="warn">You can lower your level yourself <b>only once</b>. After that, any change needs approval from club staff.</div>
      <p>The change will show on your SDX progression chart as a manual adjustment, dated today.</p>
      <label class="check"><input type="checkbox" id="lowerOk"> <span>I understand. Lower my SDX from ${sdx(p.r)} to <b id="lowerTo">${sdx(p.r - S.lowerBy)}</b>.</span></label>
      <button class="btn danger full" id="lowerGo" disabled>Lower my level</button>
      <button class="btn full" style="margin-top:10px" data-open="sdx">Cancel</button>`);
  }

  if (kind === 'edit') {
    const m = S.mine;
    return sheet(`
      <h2>Edit profile</h2>
      <form id="editForm" style="margin-top:14px">
        <label class="field"><span>Display name, shown to other players</span><input name="name" required maxlength="40" value="${esc(m.name || me)}"></label>
        <label class="field"><span>Full name</span><input name="fullName" maxlength="60" value="${esc(m.fullName || '')}"></label>
        <label class="field"><span>Phone</span><input name="phone" inputmode="tel" maxlength="20" value="${esc(m.phone || '')}"></label>
        <label class="field"><span>Email</span><input name="email" type="email" maxlength="80" value="${esc(m.email || '')}"></label>
        <p style="font-size:14px">Your SDX Rating and skill level come from your matches, so they can't be edited here. To change them, use <button type="button" class="linkish" data-open="sdx">Change your level</button> or contact club staff.</p>
        <button class="btn primary full" type="submit">Save changes</button>
        <div class="msg" id="editMsg"></div>
      </form>`);
  }

  if (kind === 'prefs') {
    const pr = S.profiles[S.mid]?.prefs || {}, tm = timesOf(pr.time);
    const chips = (name, label, opts, multi = false, hint = '') => `<fieldset class="pq"><legend>${label}</legend><div class="chips">${opts.map(o => `<label><input type="${multi ? 'checkbox' : 'radio'}" name="${name}" value="${esc(o)}" ${(multi ? tm.includes(o) : pr[name] === o) ? 'checked' : ''}><span>${esc(o)}</span></label>`).join('')}</div>${hint ? `<div class="hint">${hint}</div>` : ''}</fieldset>`;
    return sheet(`
      <h2>Player preferences</h2>
      <p>Other players see these on your profile. Tap a choice again to clear it.</p>
      <form id="prefsForm" style="margin-top:16px">
        ${chips('hand', 'Best hand', ['Right', 'Left', 'Both'])}
        <fieldset class="pq"><legend>Court side</legend><div class="sides">${Object.entries(SIDES).map(([o, d]) => `<label><input type="radio" name="side" value="${o}" ${pr.side === o ? 'checked' : ''}><span class="card"><b>${o}</b><small>${d}</small></span></label>`).join('')}</div></fieldset>
        ${chips('matchType', 'Match type', ['Casual', 'Competitive', 'Both'])}
        ${chips('time', 'Preferred time to play', TIMES, true, 'Pick as many as you like.')}
        <button class="btn primary full" type="submit">Save preferences</button>
      </form>`);
  }

  if (kind === 'player') {
    const n = arg, q = playerOf(n), qb = bandOf(q.r), pid = Object.keys(S.profiles).find(id => S.profiles[id].name === n), pp = S.profiles[pid] || {}, pr = pp.prefs || {};
    const doneMine = myMatches().filter(validMatch);
    const together = doneMine.filter(m => { const s = sideOf(m, me); return s && ((s === 'A' ? m.teamA : m.teamB) || []).includes(n); }).length;
    const against = doneMine.filter(m => { const s = sideOf(m, me); return s && ((s === 'A' ? m.teamB : m.teamA) || []).includes(n); }).length;
    return sheet(`
      <div class="who" style="padding-top:4px"><div class="av" aria-hidden="true">${esc(initials(n))}</div><div><h2 style="font-family:var(--ui);font-size:22px;font-weight:700">${esc(n)}</h2><div class="sub">${dexLabel(pp.dexNo)}</div></div></div>
      <p style="font-size:18px;color:var(--text);font-weight:700">${esc(qb.persona)} <span style="color:var(--muted);font-weight:500">· ${esc(qb.band)}</span></p>
      <p>${esc(qb.quip)}</p>
      <p class="form-line">${esc(formLine(n))}</p>
      <div class="strip"><div><b>${q.matches || 0}</b><span>Matches</span></div><div><b>${together}</b><span>With you</span></div><div><b>${against}</b><span>Against you</span></div></div>
      ${(pr.hand || pr.side || pr.matchType || timesOf(pr.time).length) ? `<h4>Preferences</h4>${prefRows(pr)}` : ''}`);
  }
}
document.addEventListener('click', e => {
  const k = e.target.closest('#lowerPick [data-k]');
  if (k) { S.lowerBy = +k.dataset.k; document.querySelectorAll('#lowerPick button').forEach(b => b.classList.toggle('on', b === k)); $('#lowerTo').textContent = sdx(playerOf(myName()).r - S.lowerBy); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'lowerOk') $('#lowerGo').disabled = !e.target.checked;
  if (e.target.name === 'time' && e.target.checked) document.querySelectorAll('#prefsForm input[name=time]').forEach(i => { if (i !== e.target && (e.target.value === 'Anytime' || i.value === 'Anytime')) i.checked = false; });
});
// Radios in the preferences form clear when tapped again
let _wasOn = null;
document.addEventListener('pointerdown', e => { const i = e.target.closest('#prefsForm label')?.querySelector('input[type=radio]'); _wasOn = i && i.checked ? i : null; });
document.addEventListener('click', e => { const i = e.target.closest('#prefsForm label')?.querySelector('input[type=radio]'); if (i && i === _wasOn && e.target.tagName !== 'INPUT') { e.preventDefault(); setTimeout(() => { i.checked = false; }, 0); _wasOn = null; } });
document.addEventListener('click', async e => {
  if (e.target.id !== 'lowerGo') return;
  const p = playerOf(myName()), from = Math.round(p.r * 1000) / 1000, to = Math.round((p.r - S.lowerBy) * 1000) / 1000;
  e.target.disabled = true;
  try { await set(ref(db, `adjustments/${S.mid}/self`), { from, to, date: todayLocal(), at: new Date().toISOString() }); closeSheet(); track('lowered'); toast(`Level lowered. Your SDX is now ${sdx(to)}`); }
  catch (err) { e.target.disabled = false; toast(/permission/i.test(err.message) ? 'You have already used your one self adjustment.' : 'Could not lower your level: ' + err.message, 4000); }
});
document.addEventListener('submit', async e => {
  if (e.target.id === 'editForm') {
    e.preventDefault(); const f = new FormData(e.target), name = f.get('name').trim();
    const clash = Object.entries(S.profiles).find(([id, x]) => id !== S.mid && (x.name || '').trim().toLowerCase() === name.toLowerCase());
    if (clash) { $('#editMsg').textContent = `Another player is already called “${name}”. Add a surname or an initial.`; $('#editMsg').className = 'msg err'; return; }
    const upd = { [`members/${S.mid}/name`]: name, [`profiles/${S.mid}/name`]: name };
    for (const k of ['fullName', 'phone', 'email']) upd[`members/${S.mid}/${k}`] = f.get(k).trim();
    try { await update(ref(db), upd); Object.assign(S.mine, { name, fullName: f.get('fullName').trim(), phone: f.get('phone').trim(), email: f.get('email').trim() }); closeSheet(); track('profile_saved'); toast('Profile saved'); }
    catch (err) { $('#editMsg').textContent = 'Could not save: ' + err.message; $('#editMsg').className = 'msg err'; }
  }
  if (e.target.id === 'prefsForm') {
    e.preventDefault(); const f = new FormData(e.target), prefs = {};
    for (const k of ['hand', 'side', 'matchType']) if (f.get(k)) prefs[k] = f.get(k);
    const tm = f.getAll('time'); if (tm.length) prefs.time = tm;
    try { await set(ref(db, `profiles/${S.mid}/prefs`), prefs); closeSheet(); track('prefs_saved'); toast('Preferences saved'); }
    catch (err) { toast('Could not save preferences: ' + err.message, 4000); }
  }
});
</script>
</body>
</html>
