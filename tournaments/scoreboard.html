<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Tournament Scoreboard — Deuce &amp; Smash</title>
<style>
  :root {
    --bg:#0d0d0d;--surface:#161616;--card:#1c1c1c;--border:#2a2a2a;
    --accent:#e8ff3b;--accent2:#3bffe8;--text:#f0f0f0;--muted:#888;
    --danger:#ff4d4d;--success:#4dff91;--warn:#ffb347;
    --font:'Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;}

  /* ── Header ── */
  .header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;}
  .logo{font-size:1.3rem;font-weight:800;letter-spacing:-0.5px;white-space:nowrap;}
  .logo span{color:var(--accent);}
  .live-dot{width:8px;height:8px;border-radius:50%;background:#FF6B35;box-shadow:0 0 8px #FF6B35;animation:pulse 1.5s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.5;transform:scale(0.8);}}
  .status-badge{font-size:0.72rem;font-weight:700;letter-spacing:.08em;padding:3px 9px;border-radius:20px;}
  .badge-live{background:rgba(255,107,53,.15);color:#FF6B35;border:1px solid rgba(255,107,53,.3);}
  .badge-done{background:rgba(125,197,21,.12);color:#7DC515;border:1px solid rgba(125,197,21,.25);}
  .header-center{flex:1;min-width:0;padding:0 10px;}
  .t-name{font-size:0.95rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .t-sub{font-size:0.72rem;color:var(--muted);}
  .back-btn{font-size:0.78rem;color:var(--muted);text-decoration:none;white-space:nowrap;padding:5px 10px;border-radius:8px;border:1px solid var(--border);}
  .back-btn:hover{color:var(--text);border-color:var(--muted);}

  /* ── Tabs ── */
  .tabs{display:flex;gap:0;border-bottom:1px solid var(--border);background:var(--surface);padding:0 16px;overflow-x:auto;}
  .tab{padding:12px 18px;font-size:0.82rem;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s;}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent);}
  .tab:hover:not(.active){color:var(--text);}

  /* ── Main content ── */
  .main{padding:16px;max-width:900px;margin:0 auto;}
  .section-title{font-size:0.72rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:10px;padding:0 2px;}

  /* ── Leaderboard ── */
  .lb-card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:20px;}
  .lb-row{display:grid;grid-template-columns:34px 1fr 58px 42px 42px;gap:4px;padding:11px 14px;border-bottom:1px solid var(--border);align-items:center;font-size:0.88rem;}
  .lb-row:last-child{border-bottom:none;}
  .lb-row.hdr{font-size:0.68rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);background:var(--surface);padding:8px 14px;}
  .lb-row.top1{background:rgba(232,255,59,.07);}
  .lb-row.top2{background:rgba(232,255,59,.04);}
  .lb-row.top3{background:rgba(232,255,59,.02);}
  .pos{font-weight:800;color:var(--muted);font-size:.85rem;}
  .pos.p1{color:var(--accent);}
  .pos.p2{color:var(--accent2);}
  .pos.p3{color:var(--warn);}
  .pts-val{color:var(--accent);font-weight:800;font-size:1rem;text-align:right;}
  .stat{text-align:right;color:var(--muted);font-size:.8rem;}

  /* ── Round card ── */
  .round-section{margin-bottom:24px;}
  .round-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .round-pill{font-size:0.75rem;font-weight:700;padding:4px 12px;border-radius:20px;background:rgba(232,255,59,.1);color:var(--accent);border:1px solid rgba(232,255,59,.25);}
  .match-card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:8px;}
  .match-header{padding:7px 14px;background:var(--surface);font-size:0.7rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);display:flex;justify-content:space-between;}
  .court-label{color:var(--accent2);font-weight:700;}
  .match-body{padding:12px 14px;}
  .team-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;}
  .team-names{font-size:0.88rem;font-weight:600;}
  .team-names .p2n{font-size:0.8rem;color:var(--muted);font-weight:400;}
  .team-score{font-size:1.8rem;font-weight:800;color:var(--accent);min-width:36px;text-align:right;}
  .team-score.winner{color:var(--success);}
  .team-score.loser{color:var(--muted);font-size:1.3rem;}
  .vs-line{height:1px;background:var(--border);margin:4px 0;}

  /* ── Player stats ── */
  .ps-player-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
  .ps-chip{padding:6px 14px;border-radius:20px;font-size:0.8rem;font-weight:600;background:var(--surface);border:1px solid var(--border);color:var(--muted);cursor:pointer;transition:all .15s;}
  .ps-chip:hover{color:var(--text);border-color:var(--muted);}
  .ps-chip.active{background:rgba(232,255,59,.12);border-color:rgba(232,255,59,.4);color:var(--accent);}

  /* Spotlight card */
  .spotlight-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:16px;}
  .spotlight-header{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);}
  .spotlight-name{font-size:1.1rem;font-weight:800;}
  .spotlight-pos{font-size:1rem;font-weight:700;color:#3A8FFF;}
  .spotlight-grid{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--border);}
  .spotlight-cell{padding:14px 16px;border-right:1px solid var(--border);}
  .spotlight-cell:nth-child(even){border-right:none;}
  .spotlight-cell:last-child:nth-child(odd){border-right:none;grid-column:span 2;}
  .spotlight-val{font-size:1.6rem;font-weight:800;line-height:1;margin-bottom:4px;}
  .spotlight-lbl{font-size:0.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
  .spotlight-wtl{display:flex;gap:6px;font-size:1.4rem;font-weight:800;line-height:1;margin-bottom:4px;}
  .wtl-w{color:var(--success);}
  .wtl-t{color:var(--muted);}
  .wtl-l{color:var(--danger);}
  .spotlight-footer{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:background .15s;}
  .spotlight-footer:hover{background:rgba(255,255,255,.04);}
  .spotlight-footer-lbl{font-size:0.8rem;color:var(--muted);}
  .spotlight-footer-val{font-size:0.9rem;font-weight:700;color:var(--text);}
  .spotlight-footer-cue{font-size:0.78rem;color:#3A8FFF;}

  /* Performance chart */
  .chart-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:16px;}
  .chart-header{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);}
  .chart-title{font-size:0.82rem;font-weight:700;}
  .chart-toggle{display:flex;background:var(--surface);border-radius:20px;overflow:hidden;border:1px solid var(--border);}
  .chart-toggle-btn{padding:5px 14px;font-size:0.75rem;font-weight:600;cursor:pointer;color:var(--muted);transition:all .15s;border:none;background:transparent;}
  .chart-toggle-btn.active{background:rgba(232,255,59,.15);color:var(--accent);}
  .chart-wrap{padding:12px 8px 8px;}
  svg.perf-chart{width:100%;overflow:visible;}

  /* Match history */
  .match-hist{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:16px;}
  .match-hist-header{padding:13px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:background .15s;}
  .match-hist-header:hover{background:rgba(255,255,255,.04);}
  .match-hist-title{font-size:0.85rem;font-weight:700;}
  .match-hist-cue{font-size:0.78rem;color:#3A8FFF;}
  .match-hist-body{display:none;}
  .match-hist-body.open{display:block;}
  .mh-row{display:grid;grid-template-columns:48px 1fr auto;gap:6px;padding:10px 16px;border-top:1px solid var(--border);align-items:center;font-size:0.83rem;}
  .mh-round{font-size:0.72rem;font-weight:700;color:var(--muted);}
  .mh-players{line-height:1.4;}
  .mh-partner{font-weight:600;}
  .mh-opp{font-size:0.78rem;color:var(--muted);}
  .mh-score{font-size:1.1rem;font-weight:800;text-align:right;white-space:nowrap;}
  .mh-score.won{color:var(--success);}
  .mh-score.lost{color:var(--danger);}
  .mh-score.tied{color:var(--muted);}
  .mh-result{font-size:0.68rem;font-weight:700;letter-spacing:.05em;text-align:right;}

  /* ── Championship banner ── */
  .champ-banner{background:linear-gradient(135deg,rgba(232,255,59,.15),rgba(59,255,232,.1));border:1px solid var(--accent);border-radius:12px;padding:18px;text-align:center;margin-bottom:20px;}
  .champ-banner h2{font-size:1.3rem;color:var(--accent);margin-bottom:4px;}
  .champ-banner .champ-sub{font-size:0.85rem;color:var(--muted);}
  .champ-winner{font-size:1rem;font-weight:700;color:#fff;margin-top:8px;}

  /* ── Idle ── */
  .idle{text-align:center;padding:60px 20px;color:var(--muted);}
  .idle .big{font-size:3rem;margin-bottom:12px;}

  /* ── Responsive ── */
  @media(max-width:480px){
    .lb-row{grid-template-columns:26px 1fr 50px 36px;}
    .lb-row .stat:last-child{display:none;}
    .team-score{font-size:1.4rem;}
    .player-stats-grid{grid-template-columns:1fr 1fr;}
  }
</style>
</head>
<body>

<div class="header">
  <a href="../members/index.html" class="back-btn">← Back</a>
  <div class="header-center">
    <div class="t-name" id="t-name">Loading…</div>
    <div class="t-sub" id="t-sub"></div>
  </div>
  <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
    <div class="live-dot" id="live-dot" style="display:none"></div>
    <span class="status-badge" id="status-badge" style="display:none"></span>
  </div>
</div>

<div class="tabs" id="tabs" style="display:none">
  <div class="tab active" data-tab="standings" onclick="switchTab('standings')">Standings</div>
  <div class="tab" data-tab="rounds" onclick="switchTab('rounds')">Rounds</div>
  <div class="tab" data-tab="players" onclick="switchTab('players')">Player Stats</div>
</div>

<div class="main" id="main-content">
  <div class="idle"><div class="big">🏓</div>Loading…</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, get, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDu7A0agFAT1jwfrjCRkQe6tHg2Qu_LnDc",
  authDomain: "deuceandsmash-club.firebaseapp.com",
  databaseURL: "https://deuceandsmash-club-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "deuceandsmash-club",
  storageBucket: "deuceandsmash-club.firebasestorage.app",
  messagingSenderId: "953747553630",
  appId: "1:953747553630:web:316645b323ae12019fa3cf"
};

const app = initializeApp(FIREBASE_CONFIG);
const db  = getDatabase(app);
const auth = getAuth(app);
signInAnonymously(auth).catch(e => console.warn('Anon auth:', e));

const urlId = new URLSearchParams(location.search).get('id');
let _activeTab = 'standings';
let _tournData = null; // normalised data shared by all render paths

// ────────────────────────────────────────────────────────────
// Entry point
// ────────────────────────────────────────────────────────────
if (urlId) {
  loadTournament(urlId);
} else {
  // Default: watch for a currently-active tournament in the admin format
  onValue(ref(db, 'tournaments'), snap => {
    const all = snap.val() || {};
    const active = Object.entries(all).find(([id,t]) => t.status === 'active' && id !== '_meta');
    if (active) {
      renderAdminFormat(active[0], active[1]);
    } else {
      showIdle('No active tournament running');
    }
  });
}

async function loadTournament(id) {
  // 1. Try the admin-created tournaments/${id} node
  const tsnap = await get(ref(db, `tournaments/${id}`));
  const tdata = tsnap.val();
  if (tdata && tdata.players && tdata.state) {
    // Full admin format — use live listener
    onValue(ref(db, `tournaments/${id}`), snap => {
      const d = snap.val();
      if (d) renderAdminFormat(id, d);
    });
    return;
  }

  // 2. No admin node — try openPlayMatches for tournamentId = id
  const msnap = await get(ref(db, 'openPlayMatches'));
  const allMatches = msnap.val() || {};
  const tournMatches = Object.values(allMatches).filter(m => m.tournamentId === id);
  if (tournMatches.length) {
    // Also fetch _meta for this tournament
    const metaSnap = await get(ref(db, `tournaments/_meta/${id}`));
    const meta = metaSnap.val() || {};
    renderOpenPlayFormat(id, tournMatches, meta);
    return;
  }

  // 3. Nothing found
  showIdle('Tournament not found');
}

// ────────────────────────────────────────────────────────────
// Admin-format render (players array + state.pts/wins/rounds)
// ────────────────────────────────────────────────────────────
function renderAdminFormat(id, data) {
  const { players, state, config, name, status } = data;
  if (!players || !state) return;
  const { totalRounds, times, championshipRound } = config || {};
  const N = players.length;
  const roundsDone = (state.submitted || []).filter(Boolean).length;

  document.getElementById('t-name').textContent = name || id;
  const timePart = (config?.startTime || config?.endTime)
    ? ` · ${config.startTime||''}${config.startTime&&config.endTime?'–':''}${config.endTime||''}`
    : '';
  const closedEarly = data.closedEarlyAfterRound;
  document.getElementById('t-sub').textContent =
    `${config?.date||''}${timePart} · Round ${roundsDone}/${totalRounds||'?'}`;

  const isLive = status === 'active';
  setBadge(isLive ? 'live' : 'done', isLive ? 'LIVE' : 'Completed');

  // Build normalised _tournData so tabs work
  const ranked = [...Array(N).keys()].sort((a,b) =>
    (state.pts[b]||0)-(state.pts[a]||0) || (state.wins[b]||0)-(state.wins[a]||0));
  _tournData = {
    type: 'admin',
    name, players, state, config, ranked, roundsDone,
    id, closedEarly, championshipRound, times
  };

  showTabs();
  renderTab(_activeTab);

  if ((status === 'archived' || status === 'completed') && players && state) {
    backfillMetaStandingsIfMissing(id, data);
  }
}

// ────────────────────────────────────────────────────────────
// openPlayMatches format render (matches with tournamentId)
// ────────────────────────────────────────────────────────────
function renderOpenPlayFormat(id, matches, meta) {
  const name = meta.name || 'Tournament';
  const date = meta.date || '';
  const status = meta.status || 'completed';
  const isLive = status === 'live';

  document.getElementById('t-name').textContent = name;
  const totalRounds = meta.totalRounds || meta.rounds || Math.max(...matches.map(m => m.round||0));
  const roundsDone  = meta.roundsDone || Math.max(...matches.map(m => m.round||0));
  document.getElementById('t-sub').textContent =
    `${date} · ${roundsDone} round${roundsDone!==1?'s':''} completed · ${meta.players||'?'} players`;

  setBadge(isLive ? 'live' : 'done', isLive ? 'LIVE' : 'Completed');

  // Group matches by round
  const byRound = {};
  for (const m of matches) {
    const r = m.round || 1;
    if (!byRound[r]) byRound[r] = [];
    byRound[r].push(m);
  }

  // Compute per-player totals
  const playerMap = {}; // name -> { pts, wins, losses, pf, pa, gp }
  for (const m of matches) {
    const teamA = m.teamA || [];
    const teamB = m.teamB || [];
    const a = m.a ?? 0, b = m.b ?? 0;
    const awon = a > b, bwon = b > a;
    const allPlayers = [...teamA.map(n => ({n,pts:a,pa:b,won:awon})), ...teamB.map(n => ({n,pts:b,pa:a,won:bwon}))];
    for (const {n, pts, pa, won} of allPlayers) {
      if (!playerMap[n]) playerMap[n] = {pts:0, wins:0, losses:0, pf:0, pa:0, gp:0};
      playerMap[n].pts += pts;
      playerMap[n].pf  += pts;
      playerMap[n].pa  += pa;
      playerMap[n].gp  += 1;
      if (won) playerMap[n].wins += 1;
      else if (!won && pts !== pa) playerMap[n].losses += 1;
    }
  }

  // Use meta standings if available for consistent ordering, else compute
  let standings;
  if (meta.standings && meta.standings.length) {
    standings = meta.standings.map(s => ({
      name: s.name,
      pts: s.pts,
      wins: s.wins || playerMap[s.name]?.wins || 0,
      ...(playerMap[s.name] || {})
    }));
  } else {
    standings = Object.entries(playerMap)
      .map(([name, d]) => ({ name, ...d }))
      .sort((a,b) => b.pts - a.pts || b.wins - a.wins);
  }

  _tournData = { type: 'openplay', name, date, status, standings, byRound, playerMap, meta };

  showTabs();
  renderTab(_activeTab);
}

// ────────────────────────────────────────────────────────────
// Tab switching
// ────────────────────────────────────────────────────────────
window.switchTab = function(tab) {
  _activeTab = tab;
  document.querySelectorAll('.tab').forEach(el => el.classList.toggle('active', el.dataset.tab === tab));
  renderTab(tab);
};

function renderTab(tab) {
  if (!_tournData) return;
  if (_tournData.type === 'admin') {
    if (tab === 'standings') renderAdminStandings();
    else if (tab === 'rounds') renderAdminRounds();
    else renderAdminPlayerStats();
  } else {
    if (tab === 'standings') renderOpenPlayStandings();
    else if (tab === 'rounds') renderOpenPlayRounds();
    else renderOpenPlayPlayerStats();
  }
}

// ────────────────────────────────────────────────────────────
// openPlay renders
// ────────────────────────────────────────────────────────────
function renderOpenPlayStandings() {
  const { standings, meta } = _tournData;
  let html = '';

  // Champion banner if completed
  if ((meta.status === 'completed' || meta.status === 'archived') && standings[0]) {
    html += `<div class="champ-banner">
      <h2>🏆 ${meta.name||'Tournament'}</h2>
      <div class="champ-winner">${standings[0].name} · ${standings[0].pts} pts</div>
      <div class="champ-sub">${meta.date||''} · ${meta.players||standings.length} players · ${meta.totalRounds||meta.rounds||'?'} rounds</div>
    </div>`;
  }

  html += '<div class="section-title">Final Standings</div>';
  html += `<div class="lb-card">
    <div class="lb-row hdr"><span>#</span><span>Player</span><span style="text-align:right">Pts</span><span style="text-align:right">W-T-L</span><span style="text-align:right">GP</span></div>
    ${standings.map((s, pos) => {
      const topCls = pos===0?' top1':pos===1?' top2':pos===2?' top3':'';
      const posCls = pos===0?' p1':pos===1?' p2':pos===2?' p3':'';
      const medal = pos===0?'🥇 ':pos===1?'🥈 ':pos===2?'🥉 ':'';
      const wins = s.wins||0;
      const losses = s.losses != null ? s.losses : Math.max(0,(s.gp||0)-wins-(s.ties||0));
      const ties = s.ties != null ? s.ties : Math.max(0,(s.gp||0)-wins-losses);
      return `<div class="lb-row${topCls}">
        <span class="pos${posCls}">${pos+1}</span>
        <span style="font-weight:600">${medal}${s.name}</span>
        <span class="pts-val">${s.pts}</span>
        <span class="stat" style="font-size:0.78rem">${wins}-${ties}-${losses}</span>
        <span class="stat">${s.gp||0}</span>
      </div>`;
    }).join('')}
  </div>`;

  // Combined all-players performance chart
  html += `<div id="all-chart-wrap">${buildAllPlayersPerfChart()}</div>`;

  document.getElementById('main-content').innerHTML = html;
}

function renderOpenPlayRounds() {
  const { byRound } = _tournData;
  const rounds = Object.keys(byRound).map(Number).sort((a,b) => a-b);
  let html = '';
  for (const rNum of rounds) {
    const matches = byRound[rNum];
    html += `<div class="round-section">
      <div class="round-header"><span class="round-pill">Round ${rNum}</span>
        <span style="font-size:0.75rem;color:var(--muted)">${matches.length} match${matches.length!==1?'es':''}</span>
      </div>`;
    matches.forEach((m, mi) => {
      const a = m.a ?? 0, b = m.b ?? 0;
      const aWon = a > b, bWon = b > a;
      const teamA = (m.teamA||[]).join(' & ');
      const teamB = (m.teamB||[]).join(' & ');
      html += `<div class="match-card">
        <div class="match-header">
          <span class="court-label">Court ${mi+1}</span>
          <span>${m.date||''}</span>
        </div>
        <div class="match-body">
          <div class="team-row">
            <div class="team-names">${teamA}</div>
            <div class="team-score ${aWon?'winner':bWon?'loser':''}">${a}</div>
          </div>
          <div class="vs-line"></div>
          <div class="team-row">
            <div class="team-names">${teamB}</div>
            <div class="team-score ${bWon?'winner':aWon?'loser':''}">${b}</div>
          </div>
        </div>
      </div>`;
    });
    html += '</div>';
  }
  document.getElementById('main-content').innerHTML = html || '<div class="idle"><div class="big">🎾</div>No round data</div>';
}

// ── Deep per-player stats builder ──────────────────────────
function buildPlayerDeepStats(playerName) {
  const { byRound, standings } = _tournData;
  const rounds = Object.keys(byRound).map(Number).sort((a,b)=>a-b);
  const pos = standings.findIndex(s => s.name === playerName);

  // Per-match data for this player
  const myMatches = [];
  for (const rNum of rounds) {
    for (const m of byRound[rNum]) {
      const inA = (m.teamA||[]).includes(playerName);
      const inB = (m.teamB||[]).includes(playerName);
      if (!inA && !inB) continue;
      const myScore = inA ? (m.a??0) : (m.b??0);
      const oppScore = inA ? (m.b??0) : (m.a??0);
      const partner = inA ? (m.teamA||[]).find(n=>n!==playerName) : (m.teamB||[]).find(n=>n!==playerName);
      const opponents = inA ? (m.teamB||[]) : (m.teamA||[]);
      const result = myScore > oppScore ? 'W' : myScore < oppScore ? 'L' : 'T';
      const margin = myScore - oppScore;
      myMatches.push({ round: rNum, myScore, oppScore, partner, opponents, result, margin });
    }
  }

  const wins = myMatches.filter(m=>m.result==='W').length;
  const losses = myMatches.filter(m=>m.result==='L').length;
  const ties = myMatches.filter(m=>m.result==='T').length;
  const gp = myMatches.length;
  const totalPts = myMatches.reduce((s,m)=>s+m.myScore, 0);
  const totalAgainst = myMatches.reduce((s,m)=>s+m.oppScore, 0);
  const diff = totalPts - totalAgainst;
  const avg = gp ? (totalPts/gp).toFixed(1) : 0;

  // Cumulative pts per round
  let cumPts = 0;
  const cumByRound = [0]; // R0 baseline
  for (const rNum of rounds) {
    const rm = myMatches.filter(m=>m.round===rNum);
    cumPts += rm.reduce((s,m)=>s+m.myScore, 0);
    cumByRound.push(cumPts);
  }

  // Rank after each round (cumulative pts vs others)
  const rankByRound = [standings.length]; // start at bottom
  let runningPts = {};
  standings.forEach(s => runningPts[s.name] = 0);
  for (const rNum of rounds) {
    for (const m of byRound[rNum]) {
      [...(m.teamA||[]),...(m.teamB||[])].forEach(n => {
        if (runningPts[n]===undefined) return;
        const inA = (m.teamA||[]).includes(n);
        runningPts[n] += inA ? (m.a??0) : (m.b??0);
      });
    }
    const myRunning = runningPts[playerName]||0;
    const rank = standings.map(s=>runningPts[s.name]||0).filter(p=>p>myRunning).length + 1;
    rankByRound.push(rank);
  }

  // Best partner (highest win rate when paired with)
  const partnerStats = {};
  for (const m of myMatches) {
    if (!m.partner) continue;
    if (!partnerStats[m.partner]) partnerStats[m.partner]={w:0,gp:0};
    partnerStats[m.partner].gp++;
    if (m.result==='W') partnerStats[m.partner].w++;
  }
  const bestPartner = Object.entries(partnerStats)
    .sort((a,b)=>(b[1].w/b[1].gp)-(a[1].w/a[1].gp) || b[1].gp-a[1].gp)[0];

  // Toughest opponent (most losses against, then fewest wins against, then smallest avg margin)
  const oppStats = {};
  for (const m of myMatches) {
    for (const opp of m.opponents) {
      if (!oppStats[opp]) oppStats[opp]={losses:0,wins:0,gp:0,marginSum:0};
      oppStats[opp].gp++;
      oppStats[opp].marginSum += m.margin;
      if (m.result==='L') oppStats[opp].losses++;
      else if (m.result==='W') oppStats[opp].wins++;
    }
  }
  const toughest = Object.entries(oppStats)
    .sort((a,b)=>b[1].losses-a[1].losses || a[1].wins-b[1].wins || (a[1].marginSum/a[1].gp)-(b[1].marginSum/b[1].gp))[0];

  // Biggest win / biggest loss
  const biggestWin = myMatches.filter(m=>m.result==='W').sort((a,b)=>b.margin-a.margin)[0];
  const biggestLoss = myMatches.filter(m=>m.result==='L').sort((a,b)=>a.margin-b.margin)[0];

  return { wins, losses, ties, gp, totalPts, totalAgainst, diff, avg, pos,
           cumByRound, rankByRound, rounds, myMatches,
           bestPartner, toughest, biggestWin, biggestLoss };
}

// ── SVG performance chart ───────────────────────────────────
let _allChartMode = 'pts';

function buildAllPlayersPerfChart(mode) {
  mode = mode || _allChartMode || 'pts';
  try {
    // Support both openPlay (byRound/standings) and admin (players/state/ranked/state.rounds) formats
    let byRound = _tournData.byRound;
    let standings = _tournData.standings;

    if (!byRound && _tournData.type === 'admin') {
      const { players, state, ranked } = _tournData;
      byRound = {};
      (state.rounds||[]).forEach((round, ri) => {
        const rNum = ri + 1;
        byRound[rNum] = [];
        (round.matches||[]).forEach((m, mi) => {
          const teamA = (m.p1||[]).map(i => players[i]).filter(Boolean);
          const teamB = (m.p2||[]).map(i => players[i]).filter(Boolean);
          const scores = (round.scores||[])[mi]||[0,0];
          byRound[rNum].push({ teamA, teamB, a: scores[0], b: scores[1], round: rNum });
        });
      });
      standings = ranked.map(pi => ({
        name: players[pi], pts: state.pts[pi]||0,
        wins: state.wins[pi]||0, gp: state.played[pi]||0,
      }));
    }

    if (!byRound || !standings || standings.length < 2) return '';
    const rounds = Object.keys(byRound).map(Number).sort((a,b)=>a-b);
    if (rounds.length < 2) return '';

    const savedTournData = _tournData;
    if (_tournData.type === 'admin' && !_tournData.byRound) {
      _tournData = { ..._tournData, byRound, standings };
    }

    const playerData = standings.map(s => {
      try {
        const stats = buildPlayerDeepStats(s.name);
        return { name: s.name, cumArr: stats.cumByRound, rankArr: stats.rankByRound };
      } catch(e2) { return { name: s.name, cumArr: null, rankArr: null }; }
    }).filter(p => p.cumArr && p.cumArr.length > 1);

    _tournData = savedTournData;
    if (playerData.length < 2) return '';

    const arr = p => mode === 'rank' ? p.rankArr : p.cumArr;
    const numPoints = arr(playerData[0]).length;

    // For rank: lower = better, so invert y axis
    const allVals = playerData.flatMap(p => arr(p));
    const maxV = Math.max(...allVals, 1);
    const minV = Math.min(...allVals, 0);
    // rank: y=1 at top; pts: y=0 at bottom
    const xScale = i => PAD.l + (i / (numPoints - 1)) * cW;
    const yScale = v => mode === 'rank'
      ? PAD.t + ((v - 1) / (maxV - 1 || 1)) * cH
      : PAD.t + cH - ((v - minV) / (maxV - minV || 1)) * cH;

    // Chart dims — compact to match leaderboard card width
    const W = 320, H = 155, PAD = { t:14, r:12, b:28, l:32 };
    const cW = W - PAD.l - PAD.r, cH = H - PAD.t - PAD.b;

    const PALETTE = ['#E8FF3B','#4FC3F7','#FF7043','#A5D6A7','#CE93D8','#FFB74D','#80DEEA','#EF9A9A'];

    let paths = '', dots = '';
    playerData.forEach((p, pi) => {
      const color = PALETTE[pi % PALETTE.length];
      const data = arr(p);
      let d = '';
      data.forEach((v, i) => {
        const x = xScale(i), y = yScale(v);
        d += d ? ` L${x},${y}` : `M${x},${y}`;
      });
      paths += `<path d="${d}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round" opacity="0.9"/>`;
      const lx = xScale(data.length - 1), ly = yScale(data[data.length - 1]);
      dots += `<circle cx="${lx}" cy="${ly}" r="3" fill="${color}"/>`;
    });

    // Y-axis grid
    let grid = '';
    const yTicks = mode === 'rank' ? Math.min(playerData.length - 1, 4) : 4;
    for (let i = 0; i <= yTicks; i++) {
      const v = mode === 'rank'
        ? 1 + Math.round((maxV - 1) * i / yTicks)
        : Math.round(minV + (maxV - minV) * i / yTicks);
      const y = yScale(v);
      grid += `<line x1="${PAD.l}" x2="${PAD.l+cW}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>`;
      grid += `<text x="${PAD.l-4}" y="${y+3.5}" fill="rgba(255,255,255,0.38)" font-size="6" font-family="inherit" text-anchor="end">${v}</text>`;
    }

    // X-axis labels
    let xLabels = `<text x="${xScale(0)}" y="${PAD.t+cH+16}" fill="rgba(255,255,255,0.28)" font-size="6" font-family="inherit" text-anchor="middle">S</text>`;
    rounds.forEach((r, i) => {
      xLabels += `<text x="${xScale(i+1)}" y="${PAD.t+cH+16}" fill="rgba(255,255,255,0.42)" font-size="6" font-family="inherit" text-anchor="middle">R${r}</text>`;
    });

    // Legend — 4-per-row, compact
    let legend = '';
    const cols = 4;
    playerData.forEach((p, pi) => {
      const col = pi % cols, row = Math.floor(pi / cols);
      const lx = 2 + col * 78, ly = H + 12 + row * 12;
      legend += `<rect x="${lx}" y="${ly-5}" width="8" height="3" rx="1.5" fill="${PALETTE[pi%PALETTE.length]}"/>`;
      legend += `<text x="${lx+11}" y="${ly}" fill="rgba(255,255,255,0.7)" font-size="6" font-family="inherit">${p.name}</text>`;
    });
    const legendRows = Math.ceil(playerData.length / cols);
    const svgH = H + 8 + legendRows * 12 + 4;

    const isPts = mode === 'pts';
    return `<div style="margin-top:20px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <span style="font-size:0.7rem;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase">Performance</span>
        <div style="display:flex;gap:4px">
          <button onclick="switchAllChart('pts')" style="font-size:0.7rem;font-weight:600;padding:3px 10px;border-radius:12px;border:1px solid;cursor:pointer;background:${isPts?'rgba(232,255,59,.15)':'transparent'};color:${isPts?'var(--accent)':'var(--muted)'};border-color:${isPts?'rgba(232,255,59,.35)':'var(--border)'}">Points</button>
          <button onclick="switchAllChart('rank')" style="font-size:0.7rem;font-weight:600;padding:3px 10px;border-radius:12px;border:1px solid;cursor:pointer;background:${!isPts?'rgba(232,255,59,.15)':'transparent'};color:${!isPts?'var(--accent)':'var(--muted)'};border-color:${!isPts?'rgba(232,255,59,.35)':'var(--border)'}">Rank</button>
        </div>
      </div>
      <div style="background:var(--surface);border-radius:12px;border:1px solid var(--border);padding:12px 10px 8px;overflow:hidden">
        <svg width="100%" viewBox="0 0 ${W} ${svgH}" xmlns="http://www.w3.org/2000/svg" style="display:block;font-family:inherit">
          ${grid}${paths}${dots}${xLabels}${legend}
        </svg>
      </div>
    </div>`;
  } catch(e) {
    return '';
  }
}

function buildPerfChart(playerName, mode /* 'pts' | 'rank' */) {
  const d = buildPlayerDeepStats(playerName);
  const { cumByRound, rankByRound, rounds } = d;
  const data = mode === 'pts' ? cumByRound : rankByRound;
  const totalRounds = rounds.length;
  const labels = ['R0', ...rounds.map(r=>`R${r}`)];

  const W = 320, H = 120, padL=28, padR=12, padT=14, padB=24;
  const chartW = W-padL-padR, chartH = H-padT-padB;

  const minVal = mode === 'rank' ? 1 : 0;
  const maxVal = mode === 'rank' ? (d.pos >= 0 ? d.gp > 0 ? 8 : 8 : 8) : Math.max(...data, 1);
  const yFlip = mode === 'rank'; // lower rank # = better = top of chart

  const xScale = i => padL + (i/(labels.length-1))*chartW;
  const yScale = v => {
    const norm = (v - minVal)/(maxVal - minVal || 1);
    return padT + (yFlip ? norm : 1-norm)*chartH;
  };

  const pts = data.map((v,i) => `${xScale(i).toFixed(1)},${yScale(v).toFixed(1)}`).join(' ');

  // Y axis grid lines
  const gridCount = 4;
  let gridLines = '';
  for (let i=0;i<=gridCount;i++) {
    const v = minVal + (maxVal-minVal)*(i/gridCount);
    const y = yScale(v).toFixed(1);
    const lbl = mode==='rank' ? Math.round(v) : Math.round(v);
    gridLines += `<line x1="${padL}" x2="${W-padR}" y1="${y}" y2="${y}" stroke="#2a2a2a" stroke-width="1"/>`;
    gridLines += `<text x="${padL-4}" y="${parseFloat(y)+4}" text-anchor="end" font-size="9" fill="#666">${lbl}</text>`;
  }

  // X axis labels
  let xLabels = '';
  labels.forEach((lbl,i) => {
    xLabels += `<text x="${xScale(i).toFixed(1)}" y="${H-4}" text-anchor="middle" font-size="9" fill="#666">${lbl}</text>`;
  });

  // Accent colour for this player based on standing position
  const COLOURS = ['#e8ff3b','#3bffe8','#ff6b35','#ff4d4d','#a78bfa','#f472b6','#4dff91','#60a5fa'];
  const colour = COLOURS[d.pos % COLOURS.length] || '#e8ff3b';

  // Area fill
  const firstX = xScale(0).toFixed(1), lastX = xScale(labels.length-1).toFixed(1);
  const bottomY = (padT+chartH).toFixed(1);
  const areaPath = `M${firstX},${yScale(data[0]).toFixed(1)} ${data.map((_,i)=>i>0?`L${xScale(i).toFixed(1)},${yScale(data[i]).toFixed(1)}`:'').filter(Boolean).join(' ')} L${lastX},${bottomY} L${firstX},${bottomY} Z`;

  return `<svg class="perf-chart" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="ag${playerName.replace(/\W/g,'')}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${colour}" stop-opacity="0.2"/>
        <stop offset="100%" stop-color="${colour}" stop-opacity="0.01"/>
      </linearGradient>
    </defs>
    ${gridLines}
    ${xLabels}
    <path d="${areaPath}" fill="url(#ag${playerName.replace(/\W/g,'')})" />
    <polyline points="${pts}" fill="none" stroke="${colour}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${data.map((v,i)=>`<circle cx="${xScale(i).toFixed(1)}" cy="${yScale(v).toFixed(1)}" r="3.5" fill="${colour}" stroke="var(--bg)" stroke-width="1.5"/>`).join('')}
  </svg>`;
}

      </div>

    </div>` : ''}
    ${d.biggestWin ? `<div class="spotlight-footer" style="cursor:default">

      <div class="spotlight-lbl">Biggest win · +${d.biggestWin.margin} margin</div></div>
    </div>` : ''}
    ${d.biggestLoss ? `<div class="spotlight-footer" style="cursor:default">

    return `<div class="mh-row">

      </div>
      <div>
        <div class="mh-score ${resCls}">${m.myScore}–${m.oppScore}</div>

    <div class="match-hist-header" onclick="toggleMatchHist(this)">
      <span class="match-hist-title">Match History <span style="color:var(--muted);font-weight:400">(${d.gp} games)</span></span>
      <span class="match-hist-cue" id="mh-cue">View Matches ›</span>

    <div class="match-hist-body" id="match-hist-body">${matchRows}</div>
  </div>`;

  document.getElementById('main-content').innerHTML = chipsHtml + spotlightHtml + chartHtml + matchHistHtml;
  } catch(e) {
    console.error('[PlayerStats error]', e);
    document.getElementById('main-content').innerHTML = `<div style="padding:20px;color:#ff4d4d;font-size:0.85rem">Stats error: ${e.message}</div>`;
  }
}

  html += `<div class="lb-card">
    <div class="lb-row hdr"><span>#</span><span>Player</span><span style="text-align:right">Pts</span><span style="text-align:right">W-T-L</span><span style="text-align:right">GP</span></div>
    ${ranked.map((pi, pos) => {
      const topCls = pos===0?' top1':pos===1?' top2':pos===2?' top3':'';
      const posCls = pos===0?' p1':pos===1?' p2':pos===2?' p3':'';
      const wins = state.wins[pi]||0;
      const gp = state.played[pi]||0;
      // Compute ties and losses from round data
      let ties = 0, losses = 0;
      (state.rounds||[]).forEach(round => {
        (round.matches||[]).forEach((m, mi) => {
          const isA = (m.p1||[]).includes(pi);
          const isB = (m.p2||[]).includes(pi);
          if (!isA && !isB) return;
          const scores = (round.scores||[])[mi]||[0,0];
          const [sa, sb] = scores;
          if (sa === sb) ties++;
          else if ((isA && sb > sa) || (isB && sa > sb)) losses++;
        });
      });
      const wtl = `${wins}-${ties}-${losses}`;
      return `<div class="lb-row${topCls}">
        <span class="pos${posCls}">${pos+1}</span>
        <span style="font-weight:600">${players[pi]}</span>
        <span class="pts-val">${state.pts[pi]}</span>
        <span class="stat" style="font-size:0.78rem">${wtl}</span>
        <span class="stat">${gp}</span>
      </div>`;
    }).join('')}
  </div>`;

  // Combined all-players performance chart
  html += `<div id="all-chart-wrap">${buildAllPlayersPerfChart()}</div>`;

  document.getElementById('main-content').innerHTML = html;
}

function renderAdminRounds() {
  const { players, state, config, closedEarly, times, championshipRound } = _tournData;
  const totalRounds = config?.totalRounds || (state.rounds||[]).length;
  const pillCount = closedEarly || totalRounds;
  const roundsDone = (state.submitted||[]).filter(Boolean).length;

  let html = '<div class="section-title">Round History</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px">';
  for (let ri = 0; ri < pillCount; ri++) {
    const done = state.submitted?.[ri];
    const isChamp = ri === championshipRound;
    const label = isChamp ? '🏆 Final' : `R${ri+1}`;
    const style = done ? 'background:rgba(232,255,59,.1);color:var(--accent);border-color:rgba(232,255,59,.3)'
      : 'background:var(--surface);color:var(--muted);border-color:var(--border)';
    html += `<span style="font-size:.75rem;font-weight:700;padding:4px 12px;border-radius:20px;border:1px solid;${style}">${label}</span>`;
  }
  html += '</div>';

  // Show completed rounds' matches
  for (let ri = 0; ri < (state.rounds||[]).length; ri++) {
    const round = state.rounds[ri];
    if (!round || !round.matches) continue;
    const isChamp = ri === championshipRound;
    const label = isChamp ? '🏆 Championship Round' : `Round ${ri+1}`;
    const timeLabel = times?.[ri] || '';
    html += `<div class="round-section"><div class="round-header"><span class="round-pill">${label}</span>${timeLabel?`<span style="font-size:.73rem;color:var(--muted)">${timeLabel}</span>`:''}</div>`;
    round.matches.forEach((m, mi) => {
      const scores = round.scores?.[mi];
      const sa = scores?.[0] ?? '—', sb = scores?.[1] ?? '—';
      const courtLabel = m.label || `Court ${(m.c||mi)+1}`;
      html += `<div class="match-card">
        <div class="match-header"><span class="court-label">${courtLabel}</span>${isChamp?'<span>🏆</span>':''}</div>
        <div class="match-body">
          <div class="team-row">
            <div class="team-names">${players[m.p1[0]]} <span class="p2n">& ${players[m.p1[1]]||''}</span></div>
            <div class="team-score">${sa}</div>
          </div>
          <div class="vs-line"></div>
          <div class="team-row">
            <div class="team-names">${players[m.p2[0]]} <span class="p2n">& ${players[m.p2[1]]||''}</span></div>
            <div class="team-score">${sb}</div>
          </div>
        </div>
      </div>`;
    });
    if (round.byes?.length) {
      html += `<div style="padding:8px 12px;font-size:.8rem;color:var(--muted);background:rgba(0,0,0,.2);border-radius:8px;margin-bottom:8px">Sitting out: ${round.byes.map(i=>players[i]).join(', ')}</div>`;
    }
    html += '</div>';
  }
  document.getElementById('main-content').innerHTML = html || '<div class="idle"><div class="big">🎾</div>No round data yet</div>';
}

function renderAdminPlayerStats() {
  // Convert admin index-based data into name-based match records,
  // then reuse the same interactive renderOpenPlayPlayerStats UI.
  const { players, state, ranked } = _tournData;
  const rounds = state.rounds || [];

  // Build byRound in openPlay format
  const byRound = {};
  rounds.forEach((round, ri) => {
    const rNum = ri + 1;
    byRound[rNum] = [];
    (round.matches || []).forEach((m, mi) => {
      const teamA = (m.p1 || []).map(i => players[i]).filter(Boolean);
      const teamB = (m.p2 || []).map(i => players[i]).filter(Boolean);
      const scores = (round.scores || [])[mi] || [0, 0];
      byRound[rNum].push({ teamA, teamB, a: scores[0], b: scores[1], round: rNum });
    });
  });

  // Build standings from ranked + state
  const standings = ranked.map(pi => ({
    name: players[pi],
    pts: state.pts[pi] || 0,
    wins: state.wins[pi] || 0,
    gp: state.played[pi] || 0,
  }));

  // Temporarily swap _tournData so buildPlayerDeepStats works
  const saved = _tournData;
  _tournData = { ..._tournData, byRound, standings };
  renderOpenPlayPlayerStats();
  _tournData = saved;
  // Restore the full byRound for future calls
  _tournData = { ..._tournData, byRound, standings };
}

function setBadge(type, label) {
  const dot = document.getElementById('live-dot');
  const badge = document.getElementById('status-badge');
  dot.style.display = type === 'live' ? 'block' : 'none';
  badge.style.display = 'block';
  badge.textContent = label;
  badge.className = `status-badge badge-${type}`;
}

function showIdle(msg) {
  document.getElementById('t-name').textContent = msg;
  document.getElementById('t-sub').textContent = '';
  document.getElementById('main-content').innerHTML = `<div class="idle"><div class="big">🏓</div>${msg}</div>`;
}

// Backfill _meta standings for archived admin-format tournaments
async function backfillMetaStandingsIfMissing(id, data) {
  try {
    const metaRef = ref(db, `tournaments/_meta/${id}`);
    onValue(metaRef, async metaSnap => {
      const meta = metaSnap.val();
      if (!meta || (meta.standings && meta.standings.length)) return;
      const { players, state, config } = data;
      if (!players || !state?.pts) return;
      const N = players.length;
      const ranked = [...Array(N).keys()].sort((a,b) =>
        state.pts[b]-state.pts[a] || (state.wins[b]||0)-(state.wins[a]||0));
      const standings = ranked.slice(0,4).map((pi, i) => ({ pos: i+1, name: players[pi], pts: state.pts[pi] }));
      const roundsDone = (state.submitted||[]).filter(Boolean).length;
      await update(metaRef, {
        winner: players[ranked[0]],
        standings,
        roundsDone,
        rounds: config?.totalRounds || roundsDone,
        players: N,
        format: config?.format || meta?.format || '',
        sport: config?.sport || meta?.sport || 'padel'
      });
    }, { onlyOnce: true });
  } catch(e) { /* silent */ }
}
