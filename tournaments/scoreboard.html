<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Scoreboard — Deuce & Smash</title>
<style>
  :root {
    --bg:#0d0d0d;--surface:#161616;--card:#1c1c1c;--border:#2a2a2a;
    --accent:#e8ff3b;--accent2:#3bffe8;--text:#f0f0f0;--muted:#888;
    --danger:#ff4d4d;--success:#4dff91;--warn:#ffb347;
    --font:'Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;}
  .header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 20px;display:flex;align-items:center;gap:12px;}
  .logo{font-size:1.4rem;font-weight:800;letter-spacing:-0.5px;}
  .logo span{color:var(--accent);}
  .live-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);animation:pulse 1.5s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.5;transform:scale(0.8);}}
  .live-label{font-size:0.75rem;color:var(--accent);font-weight:700;letter-spacing:1px;}
  .header-right{margin-left:auto;text-align:right;}
  .t-name{font-size:0.9rem;font-weight:700;}
  .t-sub{font-size:0.75rem;color:var(--muted);}

  .main{padding:16px;max-width:900px;margin:0 auto;}

  /* Leaderboard */
  .section-title{font-size:0.75rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:10px;padding:0 4px;}
  .lb-card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:20px;}
  .lb-row{display:grid;grid-template-columns:36px 1fr 60px 44px 44px;gap:4px;padding:11px 14px;border-bottom:1px solid var(--border);align-items:center;font-size:0.88rem;}
  .lb-row:last-child{border-bottom:none;}
  .lb-row.header-row{font-size:0.7rem;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);background:var(--surface);padding:8px 14px;}
  .lb-row.top1{background:rgba(232,255,59,0.07);}
  .lb-row.top2{background:rgba(232,255,59,0.04);}
  .lb-row.top3{background:rgba(232,255,59,0.02);}
  .pos{font-weight:800;color:var(--muted);font-size:0.85rem;}
  .pos.p1{color:var(--accent);}
  .pos.p2{color:var(--accent2);}
  .pos.p3{color:var(--warn);}
  .player-name{font-weight:600;}
  .pts{color:var(--accent);font-weight:800;font-size:1rem;text-align:right;}
  .stat{text-align:right;color:var(--muted);font-size:0.8rem;}

  /* Current round */
  .court-card{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden;}
  .court-header{padding:10px 14px;background:var(--surface);font-size:0.75rem;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;}
  .court-label{font-weight:700;color:var(--accent2);}
  .match-display{padding:14px;}
  .team-block{display:flex;align-items:center;gap:10px;padding:6px 0;}
  .team-players{flex:1;}
  .team-player{font-size:0.9rem;font-weight:600;}
  .team-player.sub{font-size:0.8rem;color:var(--muted);font-weight:400;}
  .team-score{font-size:2rem;font-weight:800;color:var(--accent);min-width:44px;text-align:right;}
  .vs-divider{text-align:center;font-size:0.75rem;color:var(--muted);border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:4px;margin:2px 0;}
  .byes-block{padding:10px 14px;font-size:0.8rem;color:var(--muted);background:rgba(0,0,0,0.2);}

  /* Round history pills */
  .rounds-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
  .round-pill{padding:6px 14px;border-radius:20px;font-size:0.78rem;font-weight:600;background:var(--surface);border:1px solid var(--border);color:var(--muted);}
  .round-pill.done{background:rgba(232,255,59,0.1);border-color:rgba(232,255,59,0.3);color:var(--accent);}
  .round-pill.champ{background:rgba(232,255,59,0.2);border-color:var(--accent);color:#000;}
  .round-pill.current{border-color:var(--accent2);color:var(--accent2);}

  /* Championship banner */
  .champ-banner{background:linear-gradient(135deg,rgba(232,255,59,0.15),rgba(59,255,232,0.1));border:1px solid var(--accent);border-radius:10px;padding:16px;text-align:center;margin-bottom:16px;}
  .champ-banner h2{font-size:1.2rem;color:var(--accent);margin-bottom:4px;}
  .champ-banner p{font-size:0.85rem;color:var(--muted);}

  /* No tournament */
  .idle{text-align:center;padding:60px 20px;color:var(--muted);}
  .idle .big{font-size:3rem;margin-bottom:12px;}

  @media(max-width:480px){
    .lb-row{grid-template-columns:28px 1fr 50px 36px;}
    .lb-row .stat:last-child{display:none;}
    .team-score{font-size:1.5rem;}
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo">Deuce &amp; <span>Smash</span></div>
  <div style="display:flex;align-items:center;gap:6px;margin-left:10px">
    <div class="live-dot" id="live-dot" style="display:none"></div>
    <span class="live-label" id="live-label" style="display:none">LIVE</span>
  </div>
  <div class="header-right">
    <div class="t-name" id="t-name">—</div>
    <div class="t-sub" id="t-sub">Loading…</div>
  </div>
</div>

<div class="main" id="main-content">
  <div class="idle"><div class="big">🏓</div>No active tournament</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, query, orderByChild, equalTo } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDu7A0agFAT1jwfrjCRkQe6tHg2Qu_LnDc",
  authDomain: "deuceandsmash-club.firebaseapp.com",
  databaseURL: "https://deuceandsmash-club-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "deuceandsmash-club",
  storageBucket: "deuceandsmash-club.firebasestorage.app",
  messagingSenderId: "953747553630",
  appId: "1:953747553630:web:316645b323ae12019fa3cf"
};

const app = initializeApp(FIREBASE_CONFIG);
const db = getDatabase(app);

let tournament = null;

// Listen for all tournaments, find active
onValue(ref(db, 'tournaments'), snap => {
  const all = snap.val() || {};
  const active = Object.entries(all).find(([id,t]) => t.status === 'active');
  if (active) {
    tournament = { id: active[0], ...active[1] };
    render();
    document.getElementById('live-dot').style.display = 'block';
    document.getElementById('live-label').style.display = 'block';
  } else {
    tournament = null;
    document.getElementById('main-content').innerHTML = '<div class="idle"><div class="big">🏓</div>No active tournament</div>';
    document.getElementById('t-name').textContent = '—';
    document.getElementById('t-sub').textContent = 'No tournament running';
    document.getElementById('live-dot').style.display = 'none';
    document.getElementById('live-label').style.display = 'none';
  }
});

function render() {
  if (!tournament) return;
  const { players, state, config, name } = tournament;
  const { totalRounds, randomRounds, target, times } = config;
  const N = players.length;
  const roundsDone = (state.submitted || []).filter(Boolean).length;

  document.getElementById('t-name').textContent = name;
  const timePart = (config.startTime || config.endTime)
    ? ` · ${config.startTime || ''}${config.startTime && config.endTime ? '–' : ''}${config.endTime || ''}`
    : '';
  document.getElementById('t-sub').textContent = `${config.date || ''}${timePart} · Round ${roundsDone}/${totalRounds}`;

  let html = '';

  // Championship banner if in championship round
  const latestRoundIdx = (state.rounds||[]).length - 1;
  const isChampRound = latestRoundIdx === config.championshipRound;
  if (isChampRound) {
    html += `<div class="champ-banner"><h2>🏆 Championship Round</h2><p>Finals underway — Grand Final &amp; Consolation Final</p></div>`;
  }

  // Round status pills
  html += '<div class="section-title">Rounds</div><div class="rounds-row">';
  for (let ri = 0; ri < totalRounds; ri++) {
    const done = state.submitted?.[ri];
    const isChamp = ri === config.championshipRound;
    const isCurrent = ri === roundsDone && (state.rounds||[])[ri];
    const label = isChamp ? '🏆 Final' : `R${ri+1}`;
    const mode = isChamp ? 'champ' : done ? 'done' : isCurrent ? 'current' : '';
    html += `<div class="round-pill ${mode}">${label}</div>`;
  }
  html += '</div>';

  // Current active round (generated but not yet submitted)
  const currentRound = (state.rounds||[]).find((r,ri) => r && !state.submitted?.[ri]);
  if (currentRound) {
    const ri = state.rounds.indexOf(currentRound);
    const timeLabel = times?.[ri] || '';
    const isChamp = currentRound.isChamp;
    html += `<div class="section-title">Now Playing${timeLabel ? ' — ' + timeLabel : ''}</div>`;
    for (let mi = 0; mi < (currentRound.matches||[]).length; mi++) {
      const m = currentRound.matches[mi];
      const label = m.label || `Court ${m.c + 1}`;
      const sa = currentRound.scores?.[mi]?.[0];
      const sb = currentRound.scores?.[mi]?.[1];
      html += `<div class="court-card">
        <div class="court-header"><span class="court-label">${label}</span><span>${isChamp?'🏆 Championship':''}</span></div>
        <div class="match-display">
          <div class="team-block">
            <div class="team-players">
              <div class="team-player">${players[m.p1[0]]}</div>
              <div class="team-player sub">${players[m.p1[1]]}</div>
            </div>
            <div class="team-score">${sa ?? '—'}</div>
          </div>
          <div class="vs-divider">VS</div>
          <div class="team-block">
            <div class="team-players">
              <div class="team-player">${players[m.p2[0]]}</div>
              <div class="team-player sub">${players[m.p2[1]]}</div>
            </div>
            <div class="team-score">${sb ?? '—'}</div>
          </div>
        </div>
      </div>`;
    }
    if (currentRound.byes?.length) {
      html += `<div class="byes-block">Sitting out this round: ${currentRound.byes.map(i=>players[i]).join(', ')}</div>`;
    }
  }

  // Leaderboard
  const ranked = [...Array(N).keys()].sort((a,b) => state.pts[b]-state.pts[a] || state.wins[b]-state.wins[a]);
  html += '<div class="section-title" style="margin-top:20px">Leaderboard</div>';
  html += `<div class="lb-card">
    <div class="lb-row header-row"><span>#</span><span>Player</span><span style="text-align:right">Pts</span><span style="text-align:right">W</span><span style="text-align:right">GP</span></div>
    ${ranked.map((pi, pos) => {
      const topCls = pos===0?' top1':pos===1?' top2':pos===2?' top3':'';
      const posCls = pos===0?' p1':pos===1?' p2':pos===2?' p3':'';
      return `<div class="lb-row${topCls}">
        <span class="pos${posCls}">${pos+1}</span>
        <span class="player-name">${players[pi]}</span>
        <span class="pts">${state.pts[pi]}</span>
        <span class="stat">${state.wins[pi]}</span>
        <span class="stat">${state.played[pi]}</span>
      </div>`;
    }).join('')}
  </div>`;

  document.getElementById('main-content').innerHTML = html;
}
</script>
</body>
</html>
