<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Bazaar Admin — Deuce &amp; Smash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --page:#0E0E2C; --card:#16163C; --card2:#1D1D4A; --line:#2B2B5C; --well:#F4F4F7;
  --text:#F2F2F7; --text2:#C2C2DA; --muted:#8C8CB0;
  --yellow:#F5D628; --blue:#1A6FD4; --blueText:#5aa2f5; --green:#7DC515; --orange:#E05A00; --red:#ff8a7a;
  --head:'Bebas Neue', Impact, sans-serif;
  --body:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --ui:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--page);color:var(--text);font-family:var(--ui);font-size:14.5px;line-height:1.4;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blueText)}
.hidden{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* gate */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.gate-box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 24px;max-width:380px;width:100%;text-align:center}
.gate-box img{width:220px;margin:0 auto 6px;display:block}
.gate-box h1{font-family:var(--head);font-size:40px;letter-spacing:.05em;color:var(--yellow);line-height:1}
.gate-box p{color:var(--text2);margin:8px 0 18px}
.gate-msg{margin-top:12px;font-size:14px;color:var(--text2)}
.gate-msg.err{color:var(--red)}
.spinner{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--yellow);border-radius:50%;animation:sp .8s linear infinite;margin:6px auto}
@keyframes sp{to{transform:rotate(360deg)}}

/* top */
header.top{position:sticky;top:0;z-index:20;background:rgba(14,14,44,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.top-row{display:flex;align-items:center;gap:10px;padding:10px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand img{height:30px;width:auto}
.wm-s{height:22px;width:75px;flex:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
.wm-g{display:block;width:124px;height:auto;margin:6px auto 0}
.gate-box h1.adm{font-size:20px;letter-spacing:.3em;color:var(--muted);margin-top:4px}
.who{color:var(--muted);font-size:13px;margin-left:auto}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.tabs a{flex:none;text-decoration:none;color:var(--text2);font-family:var(--body);font-weight:600;font-size:16px;letter-spacing:.03em;text-transform:uppercase;padding:6px 13px;border-radius:999px}
.tabs a.on{background:var(--yellow);color:var(--page)}
.tabs .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--orange);color:#fff;font-size:12px;text-align:center;line-height:18px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:8px 13px;font-family:var(--body);font-weight:700;font-size:15px;letter-spacing:.03em;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:#44448a}
.btn.pri{background:var(--yellow);border-color:var(--yellow);color:var(--page)}
.btn.wa{background:#25D366;border-color:#25D366;color:#06311a}
.btn.danger{border-color:#7a2f2f;color:var(--red)}
.btn.sm{padding:5px 10px;font-size:14px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}

main{padding:16px 0 80px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar h2{font-family:var(--head);font-size:30px;letter-spacing:.04em;margin-right:auto}
input.in,select.in,textarea.in{background:var(--page);border:1px solid var(--line);border-radius:9px;padding:8px 10px;outline:none;width:100%}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--blueText)}
.toolbar input.in,.toolbar select.in{width:auto;min-width:150px}
.hint{color:var(--muted);font-size:13px}

/* rows */
.rows{display:flex;flex-direction:column;gap:8px}
.r{display:grid;grid-template-columns:56px minmax(160px,1.6fr) repeat(4,minmax(78px,.55fr)) auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.r.off{opacity:.62}
.r img,.r .ni{width:56px;height:56px;border-radius:8px;object-fit:contain;background:var(--well)}
.r .ni{display:flex;align-items:center;justify-content:center;color:#999;font-size:11px}
.r .t{min-width:0}
.r .t b{display:block;font-family:var(--body);font-size:17px;line-height:1.1}
.r .t span{color:var(--muted);font-size:12.5px}
.r label.f{display:flex;flex-direction:column;gap:2px;font-size:11.5px;color:var(--muted)}
.r label.f input{padding:6px 8px}
.r .acts{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:760px){
  .r{grid-template-columns:56px 1fr 1fr 1fr 1fr;}
  .r .t{grid-column:2 / -1}
  .r label.f:nth-of-type(1){grid-column:1 / 2}
  .r .acts{grid-column:1 / -1;justify-content:flex-start}
}
.vsum{font-size:12.5px;color:var(--text2)}
.pill{display:inline-block;font-family:var(--body);font-weight:700;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:var(--card2);color:var(--text2)}
.pill.y{background:var(--yellow);color:var(--page)} .pill.g{background:var(--green);color:var(--page)} .pill.o{background:var(--orange);color:#fff} .pill.b{background:var(--blue);color:#fff} .pill.red{background:#5a1d1d;color:var(--red)}
.sw{position:relative;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text2);cursor:pointer;user-select:none}
.sw input{appearance:none;width:36px;height:20px;border-radius:99px;background:#3a3a66;position:relative;transition:.15s;cursor:pointer;flex:none}
.sw input:before{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.sw input:checked{background:var(--green)}
.sw input:checked:before{left:18px}
.star{background:none;border:0;font-size:20px;color:#55557f;padding:2px 4px}
.star.on{color:var(--yellow)}

/* request cards */
.req{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.req.new{border-left:4px solid var(--yellow)}
.req .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.req .h b{font-family:var(--body);font-size:18px}
.req .h time{margin-left:auto;color:var(--muted);font-size:12.5px}
.req .d{color:var(--text2)}
.req .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.flag{background:rgba(125,197,21,.12);border:1px solid rgba(125,197,21,.4);color:var(--green);border-radius:8px;padding:5px 9px;font-size:13px;font-weight:600}

/* import */
.draft{display:grid;grid-template-columns:90px 1fr auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.draft img{width:90px;height:90px;object-fit:contain;background:var(--well);border-radius:9px}
.draft .hook{color:var(--text2);font-size:13.5px;margin-top:3px}
@media (max-width:600px){.draft{grid-template-columns:70px 1fr}.draft img{width:70px;height:70px}.draft .acts{grid-column:1/-1}}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,5,20,.75);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px}
.modal.open{display:flex}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:18px;width:100%;max-width:760px;padding:20px}
.sheet.narrow{max-width:420px;margin-top:12vh}
.sheet h3{font-family:var(--head);font-size:32px;letter-spacing:.04em;line-height:1;margin-bottom:12px}
.fg{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px 12px}
.fg .c2{grid-column:span 2}.fg .c3{grid-column:span 3}.fg .c4{grid-column:span 4}.fg .c6{grid-column:span 6}
@media (max-width:640px){.fg .c2,.fg .c3,.fg .c4{grid-column:span 6}}
.fld{display:flex;flex-direction:column;gap:4px}
.fld>label{font-family:var(--body);font-weight:600;font-size:14.5px;color:var(--text2)}
.fld textarea.in{min-height:64px;resize:vertical}
.legend{grid-column:span 6;font-family:var(--head);font-size:20px;letter-spacing:.06em;color:var(--yellow);margin-top:8px;border-top:1px solid var(--line);padding-top:10px}
.checks{display:flex;gap:6px;flex-wrap:wrap}
.checks label{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13.5px;cursor:pointer}
.checks input{accent-color:var(--yellow)}
.imgprev{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.phm{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin-bottom:8px}
.ph-t{position:relative;aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:var(--well);border:1px solid var(--line)}
.ph-t img{width:100%;height:100%;object-fit:cover}
.ph-t .cov{position:absolute;left:5px;top:5px;background:var(--yellow);color:var(--page);font-family:var(--body);font-weight:700;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:5px}
.ph-t .web{position:absolute;right:5px;top:5px;background:rgba(14,14,44,.8);color:#fff;font-size:10.5px;padding:2px 5px;border-radius:5px}
.ph-a{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;background:linear-gradient(transparent,rgba(5,5,20,.85));padding:14px 4px 4px}
.ph-a button{background:rgba(14,14,44,.85);border:1px solid #44448a;color:#fff;border-radius:7px;width:30px;height:28px;font-size:13px;padding:0}
.ph-a button:disabled{opacity:.3}
.ph-a button[data-x]{color:var(--red)}
.ph-t.up{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--card2);color:var(--text2);font-size:12px}
.ph-add{aspect-ratio:1/1;border:2px dashed #44448a;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:var(--yellow);gap:2px}
.ph-add b{font-size:30px;line-height:1}
.ph-add span{font-family:var(--body);font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.04em}
.ph-add:hover{border-color:var(--yellow)}
.ph-url{display:flex;gap:6px;margin-bottom:6px}
.ph-url .in{flex:1}
.imgprev img{width:54px;height:54px;object-fit:cover;border-radius:7px;background:var(--well)}
.sheet .foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.sheet .foot .left{margin-right:auto}
.ferr{color:var(--red);font-size:13.5px;margin-top:8px;min-height:18px}
.empty{text-align:center;color:var(--text2);padding:50px 16px;background:var(--card);border:1px dashed var(--line);border-radius:14px}
.empty h3{font-family:var(--head);font-size:28px;letter-spacing:.04em;color:var(--text)}

.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:760px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile span{display:block;color:var(--muted);font-family:var(--body);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:13px}
.tile b{display:block;font-family:var(--head);font-weight:400;font-size:32px;letter-spacing:.02em;line-height:1.1;margin-top:2px}
.tile small{color:var(--muted);font-size:12.5px}
.pos{color:var(--green)} .neg{color:var(--red)!important}
.mgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 18px}
@media (max-width:900px){.mgrid{grid-template-columns:minmax(0,1fr)}}
.mh{font-family:var(--head);font-weight:400;font-size:24px;letter-spacing:.04em;margin:20px 0 8px}
#view section{overflow-x:auto}
table.mt{width:100%;border-collapse:collapse;font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
table.mt th{font-family:var(--body);font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-size:12.5px;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.mt td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.mt td:nth-child(2){white-space:normal}
table.mt tr:last-child td{border-bottom:0}
.pb{position:relative;min-width:110px;height:22px;display:flex;align-items:center}
.pb span{position:absolute;left:0;top:3px;bottom:3px;background:rgba(125,197,21,.25);border-radius:4px}
.pb b{position:relative;font-weight:600;padding-left:6px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);opacity:0;background:var(--green);color:var(--page);font-weight:700;padding:10px 18px;border-radius:10px;transition:.2s;z-index:80;pointer-events:none;font-family:var(--body);font-size:16px}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:#e05555;color:#fff}
</style>
</head>
<body>

<section class="gate" id="gate">
  <div class="gate-box">
    <img src="/bazaar/img/logo.webp" alt="Deuce & Smash">
    <svg class="wm-g" viewBox="0 0 252 74" role="img" aria-label="Bazaar"><defs><linearGradient id="gLime" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBEA58"/><stop offset=".5" stop-color="#D4D63A"/><stop offset="1" stop-color="#AAC22A"/></linearGradient><linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B5E0FA"/><stop offset=".5" stop-color="#5D9DEE"/><stop offset="1" stop-color="#1752E7"/></linearGradient></defs><text x="126" y="72" text-anchor="middle" font-family="'Bebas Neue', Impact, sans-serif" font-size="100" textLength="248" lengthAdjust="spacingAndGlyphs" stroke-width="2.2" stroke-linejoin="round"><tspan fill="url(#gBlue)" stroke="url(#gBlue)">BAZ</tspan><tspan fill="url(#gLime)" stroke="url(#gLime)">AAR</tspan></text></svg>
    <h1 class="adm">Admin</h1>
    <p>Owners only. Sign in with your Google account.</p>
    <div id="gateBody"><div class="spinner"></div></div>
    <div class="gate-msg" id="gateMsg"></div>
  </div>
</section>

<div id="app" class="hidden">
  <header class="top">
    <div class="wrap">
      <div class="top-row">
        <a class="brand" href="#inventory" aria-label="Bazaar admin"><img src="/bazaar/img/logo.webp" alt="Deuce &amp; Smash"><svg class="wm-s" viewBox="0 0 252 74" role="img" aria-label="Bazaar"><defs><linearGradient id="gLimeH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBEA58"/><stop offset=".5" stop-color="#D4D63A"/><stop offset="1" stop-color="#AAC22A"/></linearGradient><linearGradient id="gBlueH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B5E0FA"/><stop offset=".5" stop-color="#5D9DEE"/><stop offset="1" stop-color="#1752E7"/></linearGradient></defs><text x="126" y="72" text-anchor="middle" font-family="'Bebas Neue', Impact, sans-serif" font-size="100" textLength="248" lengthAdjust="spacingAndGlyphs" stroke-width="2.2" stroke-linejoin="round"><tspan fill="url(#gBlueH)" stroke="url(#gBlueH)">BAZ</tspan><tspan fill="url(#gLimeH)" stroke="url(#gLimeH)">AAR</tspan></text></svg></a>
        <a class="btn sm" href="/bazaar/" target="_blank" rel="noopener">View shop ↗</a>
        <span class="who" id="who"></span>
        <button class="btn sm" id="signOutBtn">Sign out</button>
      </div>
      <nav class="tabs" id="tabs">
        <a href="#inventory" data-tab="inventory">Inventory</a>
        <a href="#used" data-tab="used">Bazaar Resale</a>
        <a href="#requests" data-tab="requests">Requests<span class="n hidden" id="nReq"></span></a>
        <a href="#import" data-tab="import">Import<span class="n hidden" id="nImp"></span></a>
        <a href="#margins" data-tab="margins">Margins</a>
        <a href="#categories" data-tab="categories">Categories</a>
      </nav>
    </div>
  </header>
  <main class="wrap" id="view"></main>
</div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getDatabase, ref, onValue, get, set, update, remove, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { mediaImg, autoHydrate, uploadPhoto, deletePhotos, isDb } from "../media.js";
import { firebaseConfig, OWNERS, WHATSAPP, LEVELS, GRADES, CATEGORY_TYPES, STARTER_CATEGORIES, esc, inr, discount, slug, list, newStock, stockLabel, usedShown, productTitle } from "../config.js";

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getDatabase(fbApp);
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

let C = { categories: {}, products: {}, used: {} };
let R = {};          // requests
let D = [];          // drafts from the repo
let K = { products: {}, used: {} };   // buying prices (private, owners only)
let S = {};          // sales log (private, owners only)
let tab = 'inventory';
const UI = { invQ: '', invCat: '', reqF: 'open', usedF: 'available', mPeriod: 'all' };
const unsubs = [];

/* ───────── toast & confirm ───────── */
let tt;
function toast(msg, err) { const t = $('#toast'); t.textContent = msg; t.className = 'show' + (err ? ' err' : ''); clearTimeout(tt); tt = setTimeout(() => t.className = '', 1800); }
function openModal(html, narrow) { $('#sheet').className = 'sheet' + (narrow ? ' narrow' : ''); $('#sheet').innerHTML = html; $('#modal').classList.add('open'); }
let PM = null; // active photo manager in an open editor
function closeModal() { if (PM && !PM.done) PM.discard(); PM = null; $('#modal').classList.remove('open'); }

function editPhotos(kind, id) {
  const x = kind === 'used' ? C.used[id] : C.products[id], p = kind === 'used' ? (C.products[x.productId] || {}) : x;
  openModal(`<h3>Photos</h3><p class="hint" style="margin-bottom:10px">${kind === 'used' ? 'Pre-Loved ' : ''}${esc(productTitle(p))}</p><div id="qpPhotos"></div>
    <div class="ferr" id="qpErr"></div><div class="foot"><button class="btn" id="qpNo">Cancel</button><button class="btn pri" id="qpGo">Save photos</button></div>`, true);
  const pm = photoMgr($('#qpPhotos'), list(x.images), kind === 'used' ? 'Shoot front, back, both edges and any marks.' : 'Product photos.');
  $('#qpNo').onclick = closeModal;
  $('#qpGo').onclick = async () => {
    if (pm.busy) return ($('#qpErr').textContent = 'Wait for the photos to finish uploading.');
    if (await save(`catalog/${kind}/${id}`, { images: pm.list(), updatedAt: Date.now() }, 'Photos saved')) { await pm.commit(); closeModal(); }
  };
}

/* ───────── PHOTO MANAGER (upload from phone/computer; stored in catalog/media) ───────── */
function photoMgr(el, initial, hint) {
  const st = { list: [...initial], init: new Set(initial), added: new Set(), busy: 0, done: false };
  const draw = () => {
    el.innerHTML = `<div class="phm">${st.list.map((r, i) => `<div class="ph-t">${mediaImg(r, 't', 'alt=""')}${i === 0 ? '<span class="cov">Cover</span>' : ''}${isDb(r) ? '' : '<span class="web">web</span>'}
        <div class="ph-a"><button type="button" data-m="${i}" data-d="-1" ${i ? '' : 'disabled'} aria-label="Move left">◀</button><button type="button" data-x="${i}" aria-label="Remove">✕</button><button type="button" data-m="${i}" data-d="1" ${i < st.list.length - 1 ? '' : 'disabled'} aria-label="Move right">▶</button></div></div>`).join('')}
      ${Array.from({ length: st.busy }, () => '<div class="ph-t up"><div class="spinner"></div><span>Uploading…</span></div>').join('')}
      <label class="ph-add"><input type="file" accept="image/*" multiple hidden><b>＋</b><span>Add photos</span></label></div>
      <div class="ph-url"><input class="in" placeholder="…or paste an image link" id="phUrl"><button type="button" class="btn sm" id="phUrlAdd">Add link</button></div>
      <span class="hint">${hint} First photo is the cover. Photos are resized and compressed automatically.</span>`;
    el.querySelector('input[type=file]').onchange = e => { const fs = [...e.target.files]; e.target.value = ''; addFiles(fs); };
    el.querySelectorAll('[data-x]').forEach(b => b.onclick = () => { st.list.splice(+b.dataset.x, 1); draw(); });
    el.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { const i = +b.dataset.m, j = i + +b.dataset.d; [st.list[i], st.list[j]] = [st.list[j], st.list[i]]; draw(); });
    el.querySelector('#phUrlAdd').onclick = () => { const v = el.querySelector('#phUrl').value.trim(); if (!/^(https?:\/\/|\/)/.test(v)) return toast('Paste a full https:// link or a /bazaar/img path', true); st.list.push(v); draw(); };
  };
  async function addFiles(files) {
    st.busy += files.length; draw();
    for (const f of files) {
      try { const r = await uploadPhoto(db, f); st.list.push(r); st.added.add(r); if (st.done) deletePhotos(db, [r]); }
      catch (e) { console.error(e); toast(e.message.length < 140 ? e.message : 'Upload failed: ' + (e.code || 'error'), true); }
      st.busy--; if (!st.done) draw();
    }
  }
  draw();
  const api = {
    get busy() { return st.busy > 0; }, get done() { return st.done; }, list: () => [...st.list],
    commit() { st.done = true; return deletePhotos(db, [...new Set([...st.init, ...st.added])].filter(r => !st.list.includes(r))); },
    discard() { st.done = true; return deletePhotos(db, [...st.added]); }
  };
  PM = api; return api;
}

const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const dayToTs = d => { const t = new Date(d + 'T12:00:00').getTime(); return isNaN(t) ? Date.now() : t; };
function varLabel(p, k) { const v = p && p.variants && p.variants[k]; return v ? [v.size, v.color].filter(Boolean).join(' ') : ''; }
/** Sell button: pick a size if needed, then record the sale AND take it out of stock in one go */
function sellItem(id) {
  const p = C.products[id], vs = Object.entries(p.variants || {});
  if (!vs.length) return askSale([{ productId: id, qty: 1 }], null, { decrement: true });
  const inStock = vs.filter(([, v]) => Number(v.stock) > 0);

  openModal(`<h3>Which size sold?</h3><p class="hint" style="margin-bottom:10px">${esc(productTitle(p))}</p>

}
/** items: [{productId, variant?, qty}] for new stock, or [{productId, usedId, qty:1}] for a pre-loved racket.
 *  opts.decrement: also take the sold quantity out of stock (Sell button). */
function askSale(items, onDone, opts = {}) {
  const rows = items.map((it, i) => {
    const p = C.products[it.productId] || {}, u = it.usedId ? C.used[it.usedId] : null;
    const price = u ? u.price : p.price, cost = u ? K.used[it.usedId] : K.products[it.productId];
    const label = u ? `Pre-Loved ${productTitle(p)}` : productTitle(p) + (it.variant ? ` · ${varLabel(p, it.variant)}` : '');
    return `<div class="fg" data-i="${i}" style="align-items:end;margin-bottom:8px"><div class="fld c6"><b style="font-family:var(--body);font-size:16px">${esc(label)}</b></div>
      <div class="fld c2"><label>Qty sold</label><input class="in" data-s="qty" inputmode="numeric" value="${it.qty}" ${u ? 'readonly' : ''}></div>
      <div class="fld c2"><label>Sold at ₹ (each)${price ? ` <span class="hint">listed ${inr(price)}</span>` : ''}</label><input class="in" data-s="price" inputmode="numeric" value="${price ?? ''}"></div>
      <div class="fld c2"><label>Buying ₹ (each) 🔒</label><input class="in" data-s="cost" inputmode="numeric" value="${cost ?? ''}" placeholder="unknown"></div></div>`;
  }).join('');
  openModal(`<h3>${opts.decrement ? 'Record a sale' : 'Was this a sale?'}</h3><p class="hint" style="margin-bottom:12px">${opts.decrement ? 'Check the price it actually sold for (change it if you gave a discount). Saving records the sale and takes it out of stock.' : 'Recording it as a sale tracks revenue and margin in the Margins tab. If you were just correcting the count, skip it. You can change the sold price if you gave a discount.'}</p>
    ${rows}<div class="fg"><div class="fld c2"><label>Sale date</label><input class="in" id="saleDay" type="date" value="${today()}"></div></div>
    <div class="ferr" id="saleErr"></div>
    <div class="foot"><button class="btn" id="saleNo">${opts.decrement ? 'Cancel' : items[0].usedId ? 'Mark sold without recording' : 'No, just a correction'}</button><button class="btn pri" id="saleYes">${opts.decrement ? 'Record sale &amp; update stock' : 'Record sale'}</button></div>`, true);
  $('#saleNo').onclick = () => { closeModal(); if (!opts.decrement) onDone && onDone(false); };
  $('#saleYes').onclick = async () => {
    const at = dayToTs($('#saleDay').value), upd = {};
    for (const [i, it] of items.entries()) {
      const r = $(`[data-i="${i}"]`), qty = num(r.querySelector('[data-s="qty"]').value), price = num(r.querySelector('[data-s="price"]').value), cost = num(r.querySelector('[data-s="cost"]').value);
      if (!(qty > 0) || price === null) return ($('#saleErr').textContent = 'Each line needs a quantity and a sold price.');
      const p = C.products[it.productId] || {};
      const key = push(ref(db, 'private/sales')).key;
      upd[`private/sales/${key}`] = { kind: it.usedId ? 'used' : 'new', productId: it.productId, usedId: it.usedId || null, variant: it.variant || null,
        title: productTitle(p) + (it.variant ? ` · ${varLabel(p, it.variant)}` : '') + (it.usedId ? ' (pre-loved)' : ''), categoryId: p.categoryId || null, qty, price, cost, at, by: (auth.currentUser || {}).email || null };
      if (cost !== null) upd[`private/cost/${it.usedId ? 'used' : 'products'}/${it.usedId || it.productId}`] = cost;
      if (opts.decrement && !it.usedId) {
        const have = it.variant ? Number(((p.variants || {})[it.variant] || {}).stock) || 0 : Number(p.stock) || 0;
        if (qty > have) return ($('#saleErr').textContent = `Only ${have} in stock${it.variant ? ' in that size' : ''}.`);
        upd[it.variant ? `catalog/products/${it.productId}/variants/${it.variant}/stock` : `catalog/products/${it.productId}/stock`] = have - qty;
        upd[`catalog/products/${it.productId}/updatedAt`] = Date.now();
      }
    }
    try { await update(ref(db), upd); closeModal(); toast(opts.decrement ? 'Sold: recorded and stock updated' : 'Sale recorded'); onDone && onDone(true); }
    catch (e) { console.error(e); $('#saleErr').textContent = 'Not saved: ' + (e.code || e.message); }
  };
}

/* ───────── REQUESTS ───────── */
function reqItem(r) {
  const p = C.products[r.productId];
  if (!p) return { title: r.productId + ' (removed)', p: null };
  if (r.usedId) { const u = C.used[r.usedId]; const g = u && GRADES[u.grade]; return { title: `Pre-Loved ${productTitle(p)}${g ? ' · ' + g.label : ''}${u ? ' · ' + inr(u.price) : ''}`, p, u }; }
  const v = r.variant && p.variants && p.variants[r.variant];
  return { title: productTitle(p) + (v ? ` · ${[v.size, v.color].filter(Boolean).join(' ')}` : ''), p, v };
}
function backInStock(r, it) {
  if (r.type !== 'notify' || !it.p) return false;
  if (it.v) return Number(it.v.stock) > 0;
  const n = newStock(it.p); return n !== null && n > 0;
}

      const msg = r.type === 'see'
        ? `Hi ${first}, this is Deuce & Smash. Thanks for your interest in the ${it.title}! We'll keep it ready at the front desk for you${r.visit ? ` (${r.visit})` : ''}. See you at the club!`

        <div class="d"><b style="color:var(--text)">${esc(r.name)}</b> · <a href="tel:${esc(r.phone.replace(/\s/g, ''))}">${esc(r.phone)}</a>${r.visit ? ` · visiting: ${esc(r.visit)}` : ''}</div>

        <div class="acts">
          <a class="btn sm wa" target="_blank" rel="noopener" data-act="wa" href="https://wa.me/${esc(waNum(r.phone))}?text=${encodeURIComponent(msg)}">WhatsApp ${esc(first)}</a>
          ${r.status === 'new' ? `<button class="btn sm" data-act="contacted">Mark contacted</button>` : ''}

/* ───────── IMPORT (drafts researched in chat, committed to the repo) ───────── */
async function loadDrafts() {
  try {
    const idx = await (await fetch('/bazaar/drafts/index.json?t=' + Date.now(), { cache: 'no-store' })).json();
    const files = list(idx.drafts);
    D = (await Promise.all(files.map(f => fetch('/bazaar/drafts/' + f + '?t=' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null)))).filter(Boolean);
  } catch (e) { console.warn('No drafts index', e); D = []; }
  badges(); if (tab === 'import') render();
}
function draftState(d) {
  const cur = d.kind === 'used' ? C.used[d.id] : C.products[d.id];
  if (!cur) return 'new';
  return (cur.rev || 0) < (d.rev || 1) ? 'update' : 'done';
}
function impHTML() {
  const order = { new: 0, update: 1, done: 2 };

  const pending = D.filter(d => draftState(d) !== 'done').length;
  const missingCats = [...new Set(D.filter(d => d.kind !== 'used' && !C.categories[d.data.categoryId]).map(d => d.data.categoryId))];
  return `<div class="toolbar"><h2>Import</h2><button class="btn" id="impReload">Check again</button>${pending ? `<button class="btn pri" id="impAll">Import all ${pending}</button>` : ''}</div>
    <p class="hint" style="margin-bottom:10px">Items we research together in chat land here. Import brings one into the inventory <b>hidden</b>, so you can check it, set price and stock, then switch it Live. Re-importing an update refreshes the description and photos, but keeps your price, stock and Live setting.</p>
    ${missingCats.filter(c => !STARTER_IDS[c]).length ? `<div class="flag" style="margin-bottom:10px;color:var(--yellow);border-color:rgba(245,214,40,.4);background:rgba(245,214,40,.08)">Some drafts use categories you don't have yet (${missingCats.filter(c => !STARTER_IDS[c]).map(esc).join(', ')}). Add them in the <a href="#categories">Categories</a> tab first.</div>` : ''}

    `<div class="rows">${ds.map(d => {

        ${thumb(list(x.images)[0] || list(p.images)[0])}
        <div><span class="pill ${st === 'new' ? 'y' : st === 'update' ? 'b' : ''}">${st === 'new' ? 'New' : st === 'update' ? 'Update' : 'Imported'}</span> ${d.kind === 'used' ? '<span class="pill">Pre-loved racket</span>' : ''}
          <div style="font-family:var(--body);font-size:18px;font-weight:700;margin-top:4px">${esc(productTitle(p) || d.id)}</div>

}
function wireImp() {
  $('#impReload').onclick = () => { toast('Checking…'); loadDrafts(); };
  const all = $('#impAll'); if (all) all.onclick = async () => {
    all.disabled = true; all.textContent = 'Importing…';
    const todo = D.filter(d => draftState(d) !== 'done').sort((a, b) => (a.kind === 'used') - (b.kind === 'used'));
    let ok = 0; for (const d of todo) { if (await importDraft(d, true)) ok++; }
    toast(`Imported ${ok} of ${todo.length}. They're hidden until you switch them Live.`);
  };
  $$('.draft[data-id]').forEach(row => {
    const d = D.find(x => x.id === row.dataset.id);
    const go = row.querySelector('[data-act="go"]'); if (go) go.onclick = () => { if (d.kind === 'used') location.hash = 'used'; else { UI.invQ = d.data.model || ''; location.hash = 'inventory'; } };
    const imp = row.querySelector('[data-act="imp"]'); if (imp) imp.onclick = () => importDraft(d);
  });
}
const OWNER_FIELDS = ['mrp', 'price', 'stock', 'variants', 'visible', 'featured', 'status', 'soldAt'];
const STARTER_IDS = Object.fromEntries(STARTER_CATEGORIES.map((c, i) => [slug(c.name), { ...c, order: (i + 1) * 10 }]));
async function importDraft(d, quiet) {
  const x = d.data || {};
  if (d.kind === 'used' && !C.products[x.productId]) { toast('Import its model first', true); return false; }
  const catUpd = {};
  if (d.kind !== 'used' && !C.categories[x.categoryId]) {
    if (!STARTER_IDS[x.categoryId]) { toast(`Category "${x.categoryId}" is missing`, true); return false; }
    catUpd[`catalog/categories/${x.categoryId}`] = STARTER_IDS[x.categoryId];
  }
  const path = d.kind === 'used' ? `catalog/used/${d.id}` : `catalog/products/${d.id}`;
  const cur = d.kind === 'used' ? C.used[d.id] : C.products[d.id];
  const data = { ...x, rev: d.rev || 1, updatedAt: Date.now() };
  if (cur) { OWNER_FIELDS.forEach(k => { if (k in cur) data[k] = cur[k]; else delete data[k]; }); data.createdAt = cur.createdAt || Date.now(); }
  else { data.createdAt = Date.now(); if (d.kind === 'used') { data.status = 'available'; data.visible = x.visible ?? true; } else data.visible = false; }
  const upd = { ...catUpd, [path]: data };
  if (list(d.sources).length) upd[`private/sources/${d.id}`] = list(d.sources);
  try {
    await update(ref(db), upd);
    if (d.kind !== 'used') C.products[d.id] = data; else C.used[d.id] = data;
    Object.entries(catUpd).forEach(([k, v]) => C.categories[k.split('/').pop()] = v);
    if (!quiet) toast(cur ? 'Updated' : (d.kind === 'used' ? 'Imported' : 'Imported (hidden)'));
    return true;
  } catch (e) { console.error(e); toast('Import failed: ' + (e.code || e.message), true); return false; }
}

/* ───────── MARGINS (cost vs profit over time) ───────── */
const PERIODS = [['month', 'This month'], ['3m', 'Last 3 months'], ['year', 'This year'], ['all', 'All time']];
function periodStart(k) { const d = new Date(); if (k === 'month') return new Date(d.getFullYear(), d.getMonth(), 1).getTime(); if (k === '3m') return new Date(d.getFullYear(), d.getMonth() - 2, 1).getTime(); if (k === 'year') return new Date(d.getFullYear(), 0, 1).getTime(); return 0; }
const pctTxt = (a, b) => b > 0 ? Math.round(a / b * 100) + '%' : '—';
function agg(rows) {
  const o = { units: 0, rev: 0, revC: 0, cost: 0, n: 0, noCost: 0 };
  rows.forEach(x => { const q = Number(x.qty) || 0, r = q * (Number(x.price) || 0); o.units += q; o.rev += r; o.n++; if (x.cost === null || x.cost === undefined) o.noCost++; else { o.revC += r; o.cost += q * Number(x.cost); } });
  o.profit = o.revC - o.cost; return o;
}
function group(rows, keyFn) { const m = new Map(); rows.forEach(x => { const k = keyFn(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); }); return [...m.entries()].map(([k, v]) => [k, agg(v)]); }
function aggTable(head, rows, maxProfit) {
  return `<table class="mt"><thead><tr><th>${head}</th><th>Units</th><th>Revenue</th><th>Cost</th><th>Profit</th><th>Margin</th></tr></thead><tbody>${rows.map(([k, a]) => `<tr><td>${k}</td><td>${a.units}</td><td>${inr(a.rev)}</td><td>${a.cost ? inr(a.cost) : '—'}</td>
    <td><div class="pb"><span style="width:${maxProfit > 0 ? Math.max(0, a.profit) / maxProfit * 100 : 0}%"></span><b class="${a.profit < 0 ? 'neg' : ''}">${a.revC ? inr(a.profit) : '—'}</b></div></td><td>${pctTxt(a.profit, a.revC)}${a.noCost ? ` <span class="hint" title="${a.noCost} sale(s) without a buying price">*</span>` : ''}</td></tr>`).join('')}</tbody></table>`;
}
function marHTML() {
  const from = periodStart(UI.mPeriod);
  const all = Object.entries(S).map(([k, x]) => ({ key: k, ...x })).sort((a, b) => (b.at || 0) - (a.at || 0));
  const rows = all.filter(x => (x.at || 0) >= from);
  const t = agg(rows);
  const mkey = x => { const d = new Date(x.at); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
  const months = group(rows, mkey).sort((a, b) => b[0].localeCompare(a[0])).map(([k, a]) => [new Date(k + '-01T12:00').toLocaleDateString('en-IN', { month: 'short', year: 'numeric' }), a]);
  const cats = group(rows, x => catName(x.categoryId)).sort((a, b) => b[1].profit - a[1].profit || b[1].rev - a[1].rev);
  const prods = group(rows, x => x.kind === 'used' ? (x.title || '') : (C.products[x.productId] ? productTitle(C.products[x.productId]) : x.title || x.productId)).sort((a, b) => b[1].profit - a[1].profit || b[1].rev - a[1].rev).slice(0, 15);
  const maxP = arr => Math.max(0, ...arr.map(([, a]) => a.profit));
  // stock on hand
  let su = 0, sCost = 0, sRetail = 0, sRetailC = 0, missing = [];
  Object.entries(C.products).forEach(([id, p]) => { const n = newStock(p); if (!(n > 0)) return; su += n; sRetail += n * (Number(p.price) || 0); const c = K.products[id]; if (c > 0) { sCost += n * c; sRetailC += n * (Number(p.price) || 0); } else missing.push(productTitle(p)); });
  Object.entries(C.used).forEach(([id, u]) => { if (u.status === 'sold') return; su += 1; sRetail += Number(u.price) || 0; const c = K.used[id]; if (c > 0) { sCost += c; sRetailC += Number(u.price) || 0; } else missing.push('Pre-Loved ' + productTitle(C.products[u.productId] || {})); });
  return `<div class="toolbar"><h2>Margins</h2>
    <select class="in" id="mPeriod">${PERIODS.map(([k, l]) => `<option value="${k}" ${UI.mPeriod === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
    <button class="btn" id="mSale">+ Record a sale</button><button class="btn" id="mCsv" ${all.length ? '' : 'disabled'}>Download CSV</button></div>
    <p class="hint" style="margin-bottom:12px">🔒 Owners only. Sales are logged here when you lower stock or mark a pre-loved racket sold, and you choose "Record sale". Zoho POS is still the official record; this is for margin analysis.</p>
    <div class="tiles">
      <div class="tile"><span>Revenue</span><b>${inr(t.rev)}</b><small>${t.units} unit${t.units === 1 ? '' : 's'} · ${t.n} sale${t.n === 1 ? '' : 's'}</small></div>
      <div class="tile"><span>Cost of goods</span><b>${inr(t.cost)}</b><small>${t.noCost ? `${t.noCost} sale${t.noCost === 1 ? '' : 's'} missing buying price` : 'all sales costed'}</small></div>
      <div class="tile"><span>Gross profit</span><b class="${t.profit < 0 ? 'neg' : 'pos'}">${inr(t.profit)}</b><small>on costed sales</small></div>
      <div class="tile"><span>Margin</span><b>${pctTxt(t.profit, t.revC)}</b><small>profit ÷ revenue</small></div>
    </div>
    ${!rows.length ? `<div class="empty" style="margin-top:14px"><h3>No sales recorded${UI.mPeriod === 'all' ? ' yet' : ' in this period'}</h3><p>When you sell something, lower its stock in Inventory (or tap Mark sold on a pre-loved racket) and choose <b>Record sale</b>.</p></div>` : `
    <div class="mgrid">
      <section><h3 class="mh">By month</h3>${aggTable('Month', months, maxP(months))}</section>
      <section><h3 class="mh">By category</h3>${aggTable('Category', cats, maxP(cats))}</section>
    </div>
    <section><h3 class="mh">By product <span class="hint">(top 15 by profit)</span></h3>${aggTable('Product', prods.map(([k, a]) => [esc(k), a]), maxP(prods))}</section>`}
    <section><h3 class="mh">Stock on hand <span class="hint">(right now)</span></h3>
      <div class="tiles">
        <div class="tile"><span>Units in stock</span><b>${su}</b><small>new + pre-loved</small></div>
        <div class="tile"><span>Value at buying price</span><b>${inr(sCost)}</b><small>what it cost you</small></div>
        <div class="tile"><span>Value at club price</span><b>${inr(sRetail)}</b><small>if it all sells</small></div>
        <div class="tile"><span>Potential profit</span><b class="pos">${inr(sRetailC - sCost)}</b><small>${pctTxt(sRetailC - sCost, sRetailC)} margin on costed stock</small></div>
      </div>
      ${missing.length ? `<p class="hint" style="margin-top:8px;color:var(--yellow)">No buying price yet for ${missing.length} item${missing.length === 1 ? '' : 's'} in stock: ${missing.slice(0, 8).map(esc).join(', ')}${missing.length > 8 ? '…' : ''}</p>` : ''}
    </section>
    ${rows.length ? `<section><h3 class="mh">Sales log</h3><table class="mt"><thead><tr><th>Date</th><th>Item</th><th>Qty</th><th>Sold at</th><th>Bought at</th><th>Profit</th><th></th></tr></thead><tbody>
      ${rows.map(x => { const pr = x.cost === null || x.cost === undefined ? null : (x.price - x.cost) * x.qty; return `<tr><td>${new Date(x.at).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: '2-digit' })}</td><td>${esc(x.title || x.productId)}</td><td>${x.qty}</td><td>${inr(x.price)}</td><td>${x.cost === null || x.cost === undefined ? '<span class="hint">—</span>' : inr(x.cost)}</td><td class="${pr < 0 ? 'neg' : ''}">${pr === null ? '—' : inr(pr)}</td><td><button class="btn sm" data-edit="${esc(x.key)}">Edit</button> <button class="btn sm danger" data-del="${esc(x.key)}">✕</button></td></tr>`; }).join('')}
    </tbody></table></section>` : ''}`;
}

function wireCat() {

  if (st) st.onclick = async () => {
    const upd = {}; STARTER_CATEGORIES.forEach((c, i) => upd[`catalog/categories/${slug(c.name)}`] = { ...c, order: (i + 1) * 10 });
    try { await update(ref(db), upd); toast('Categories added'); } catch (e) { toast(e.code || e.message, true); }
  };
  $$('[data-id] [data-f]').forEach(inp => inp.addEventListener('change', () => {
    const id = inp.closest('[data-id]').dataset.id, f = inp.dataset.f;

  }));
  $$('[data-id] [data-act="del"]').forEach(b => b.onclick = async () => {

  });

  };
}
