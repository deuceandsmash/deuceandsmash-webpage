name: Close SmashDex season

# 00:30 IST on the 2nd of every month (19:00 UTC on the 1st) closes the month that just ended.
# Run it by hand from the Actions tab to retry, or to close/rewrite a specific month.
on:
  schedule:
    - cron: '0 19 1 * *'
  workflow_dispatch:
    inputs:
      month:
        description: 'Month to close (YYYY-MM). Leave empty for last month.'
        required: false
      force:
        description: 'Rewrite the month if it is already closed'
        type: boolean
        default: false

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: scripts
      - run: node tests/honours.test.mjs
      - name: Close the season
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/close-season.mjs ${{ github.event.inputs.month }} ${{ github.event.inputs.force == 'true' && '--force' || '' }}
