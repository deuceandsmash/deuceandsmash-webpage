<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>D&S Ops — Deuce & Smash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --page:#0E0E2C; --card:#16163C; --card2:#1C1C48; --line:#2A2A57; --grid:#24244C; --axis:#3A3A6A;
  --text:#F2F2F7; --text2:#B9B9D3; --muted:#8C8CB0;
  --yellow:#F5D628; --navy:#0E0E2C;
  --padel:#3987e5; --pickle:#5fa30f;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
  --good:#0ca30c; --goodText:#3ccf3c; --warn:#fab219; --serious:#ec835a; --crit:#e05555;
  --r:14px;
  --head:'Bebas Neue', Impact, sans-serif;
  --body:'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
  --ui:'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--page);color:var(--text);font-family:var(--body);font-size:16px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
a{color:var(--yellow)}
.hidden{display:none!important}

/* ── Gate ─────────────────────────────────────────── */
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.gate-card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:40px 32px;text-align:center}
.brand{font-family:var(--head);letter-spacing:.04em;line-height:.9}
.gate-card .brand{font-size:44px}
.gate-card .brand b{color:var(--yellow);font-weight:400}
.gate-sub{color:var(--text2);margin:14px 0 28px;font-size:18px}
.btn{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:999px;padding:10px 18px;font-size:16px;font-weight:600;letter-spacing:.02em}
.btn:hover{border-color:var(--axis)}
.btn-primary{background:var(--yellow);color:var(--navy);border-color:var(--yellow)}
.btn-primary:hover{filter:brightness(1.05)}
.btn-sm{padding:6px 12px;font-size:14px}
.gate-msg{margin-top:18px;color:var(--text2);font-size:15px;min-height:20px}
.gate-msg.err{color:var(--serious)}
.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--yellow);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── App shell ────────────────────────────────────── */
header.top{position:sticky;top:0;z-index:20;background:rgba(14,14,44,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:16px;padding:12px 24px;max-width:1440px;margin:0 auto}
.top-row .brand{font-size:30px;white-space:nowrap}
.top-row .brand b{color:var(--yellow);font-weight:400}
.sync{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text2);margin-left:auto;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none}
.dot.warn{background:var(--warn)} .dot.crit{background:var(--crit)}
.who{font-size:14px;color:var(--muted);white-space:nowrap}
nav.tabs{display:flex;gap:4px;padding:0 24px;max-width:1440px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{font-family:var(--head);font-size:21px;letter-spacing:.05em;color:var(--muted);text-decoration:none;padding:8px 14px 10px;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a:hover{color:var(--text)}
nav.tabs a.on{color:var(--yellow);border-bottom-color:var(--yellow)}
main{max-width:1440px;margin:0 auto;padding:20px 24px 80px}
.banner{border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:16px;display:flex;gap:10px;align-items:flex-start;font-size:16px;background:var(--card)}
.banner.warn{border-color:#6b5310;background:#2a2412}
.banner.crit{border-color:#6b2222;background:#2a1414}

/* Filter row */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px}
.seg{display:inline-flex;max-width:100%;overflow-x:auto;scrollbar-width:none;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{white-space:nowrap;flex:none;background:none;border:0;color:var(--text2);font-size:15px;font-weight:600;padding:6px 12px;border-radius:999px;letter-spacing:.02em}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--yellow);color:var(--navy)}
.filters input[type=date]{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:6px 10px;font-family:var(--ui);font-size:14px}
.range-label{color:var(--muted);font-size:15px;margin-left:4px}

/* Grid & cards */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}.c3{grid-column:span 3}
@media (max-width:1100px){.c8,.c7,.c6,.c5,.c4{grid-column:span 12}.c3{grid-column:span 6}}
@media (max-width:560px){.c3{grid-column:span 12}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0}
.card-h{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.card-h h3{font-family:var(--head);font-weight:400;font-size:24px;letter-spacing:.04em;line-height:1}
.card-h .sub{color:var(--muted);font-size:14px;margin-top:4px;font-family:var(--ui)}
.card-h .acts{margin-left:auto;display:flex;gap:6px;flex:none}
.tgl{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;font-size:13px;padding:3px 9px;font-family:var(--ui)}
.tgl:hover{color:var(--text);border-color:var(--axis)}
.section-title{font-family:var(--head);font-size:30px;letter-spacing:.04em;margin:30px 0 12px;display:flex;align-items:baseline;gap:12px}
.section-title small{font-family:var(--ui);font-size:14px;color:var(--muted);letter-spacing:0}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 13px;min-width:0;position:relative}
.kpi.hero{background:linear-gradient(0deg,var(--card),var(--card));border-color:#5a5222;box-shadow:inset 0 0 0 1px rgba(245,214,40,.12)}
.kpi .lab{font-size:14px;color:var(--text2);letter-spacing:.03em;text-transform:uppercase;font-weight:600}
.kpi .val{font-size:38px;font-weight:600;line-height:1.05;margin-top:6px;letter-spacing:-.01em}
.kpi.hero .val{color:var(--yellow)}
.kpi .foot{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;font-size:14px;color:var(--muted);font-family:var(--ui)}
.delta{display:inline-flex;align-items:center;gap:3px;font-weight:600}
.delta.up{color:var(--goodText)} .delta.down{color:var(--crit)} .delta.flat{color:var(--muted)}

/* Charts */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--ui);font-size:12px;fill:var(--muted)}
.chart .lbl{fill:var(--text2)}
.chart .hit{fill:transparent}
.chart .hit:hover{fill:rgba(255,255,255,.05)}
.chart .cell:hover{stroke:var(--text);stroke-width:1.5}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:-4px 0 10px;font-size:14px;color:var(--text2);font-family:var(--ui)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend i.ln{height:3px;border-radius:2px;vertical-align:3px;width:14px}
#tip{position:fixed;z-index:50;pointer-events:none;background:#0A0A20;border:1px solid var(--axis);border-radius:10px;padding:9px 12px;font-family:var(--ui);font-size:13px;color:var(--text);max-width:300px;box-shadow:0 8px 24px rgba(0,0,0,.45);opacity:0;transition:opacity .08s}
#tip.on{opacity:1}
#tip .t{font-weight:600;margin-bottom:5px;color:var(--text)}
#tip .r{display:flex;justify-content:space-between;gap:14px;color:var(--text2);line-height:1.55}
#tip .r b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
#tip .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}

/* Bar lists */
.bl{display:flex;flex-direction:column;gap:10px}
.bl-row{display:grid;grid-template-columns:minmax(90px,140px) 1fr auto;align-items:center;gap:12px;font-size:15px}
.bl-label{color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bl-track{height:12px;background:var(--grid);border-radius:4px;overflow:hidden}
.bl-fill{height:100%;border-radius:0 4px 4px 0}
.bl-val{font-variant-numeric:tabular-nums;font-family:var(--ui);font-size:14px;white-space:nowrap;text-align:right;min-width:90px}
.bl-val span{color:var(--muted)}

/* Tables */
.tbl-wrap{overflow-x:auto;margin:0 -4px}
table.tbl{width:100%;border-collapse:collapse;font-family:var(--ui);font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{font-weight:600;color:var(--muted);text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:13px;text-transform:uppercase;letter-spacing:.03em;position:sticky;top:0;background:var(--card)}
.tbl td{text-align:right;padding:8px 10px;border-bottom:1px solid var(--grid);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child,.tbl .l,.tbl th.l{text-align:left}
.tbl tr:hover td{background:rgba(255,255,255,.025)}
.tbl td.wrap{white-space:normal;min-width:220px;color:var(--text2);text-align:left}
.tbl .muted{color:var(--muted)}
.tbl tr.total td{font-weight:600;border-top:1px solid var(--axis)}
.scroll-y{max-height:520px;overflow:auto}

/* Status chips */
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:600;white-space:nowrap;font-family:var(--ui)}
.chip.critical{background:rgba(224,85,85,.16);color:#ff9d9d}
.chip.serious{background:rgba(236,131,90,.16);color:#ffb08f}
.chip.warning{background:rgba(250,178,25,.14);color:#ffd27a}
.chip.info{background:rgba(185,185,211,.12);color:var(--text2)}
.chip svg{width:12px;height:12px}
.sp{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}

/* Court timeline */
.tl{position:relative;min-width:700px;font-family:var(--ui)}
.tl-wrap{overflow-x:auto;padding-bottom:4px}
.tl-axis{position:relative;height:22px;margin-left:56px}
.tl-axis span{position:absolute;transform:translateX(-50%);font-size:12px;color:var(--muted)}
.tl-row{display:flex;align-items:stretch;height:52px;border-top:1px solid var(--grid)}
.tl-row:last-child{border-bottom:1px solid var(--grid)}
.tl-name{width:56px;flex:none;display:flex;flex-direction:column;justify-content:center;font-weight:600;font-size:14px}
.tl-name small{font-size:11px;color:var(--muted);font-weight:500}
.tl-lane{position:relative;flex:1}
.tl-peak{position:absolute;top:0;bottom:0;background:rgba(245,214,40,.05)}
.tl-hr{position:absolute;top:0;bottom:0;width:1px;background:var(--grid)}
.tl-b{position:absolute;top:6px;bottom:6px;border-radius:7px;padding:4px 7px;overflow:hidden;font-size:12.5px;line-height:1.25;cursor:default;border:2px solid var(--card)}
.tl-b.padel{background:var(--padel);color:#fff}
.tl-b.pickle{background:var(--pickle);color:#0B1A02}
.tl-b .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-b .t{opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-b .bang{position:absolute;top:3px;right:4px;width:15px;height:15px;border-radius:50%;background:var(--warn);color:#2a1d00;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.tl-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--muted);font-family:var(--ui)}

/* Day picker */
.daybar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.daybar h2{font-family:var(--head);font-size:40px;font-weight:400;letter-spacing:.03em;line-height:1}
.daybar .navbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:18px;display:flex;align-items:center;justify-content:center}
.daybar .navbtn:disabled{opacity:.35;cursor:default}
.daybar input[type=date]{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:6px 10px;font-family:var(--ui)}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:13px;font-family:var(--ui);font-weight:600;background:var(--card2);color:var(--text2)}
.pill.peak{background:rgba(245,214,40,.14);color:var(--yellow)}

.empty{color:var(--muted);text-align:center;padding:30px 10px;font-family:var(--ui);font-size:15px}
.note{color:var(--muted);font-size:13.5px;font-family:var(--ui);margin-top:10px;line-height:1.45}
.lists{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:560px){.lists{grid-template-columns:1fr}}
.rank{display:flex;flex-direction:column;gap:6px}
.rank div{display:flex;justify-content:space-between;gap:10px;font-size:15px;padding:6px 0;border-bottom:1px solid var(--grid)}
.rank div span:last-child{font-variant-numeric:tabular-nums;font-family:var(--ui);font-size:14px}
.rank h4{font-family:var(--ui);font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.coming{border:1px dashed var(--axis);background:transparent}
.pchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;align-items:center}
.pchip{border:1px solid var(--line);background:var(--card2);color:var(--text2);border-radius:999px;padding:6px 12px;font-size:15px;font-weight:600;letter-spacing:.02em}
.pchip:hover{border-color:var(--axis);color:var(--text)}
.pchip.on{background:rgba(245,214,40,.14);border-color:var(--yellow);color:var(--yellow)}
.pchip small{font-weight:500;opacity:.7;font-family:var(--ui);font-size:12px;margin-left:4px}
.plink{background:none;border:0;color:var(--muted);font-family:var(--ui);font-size:13px;text-decoration:underline;padding:4px 6px}
.plink:hover{color:var(--text)}
.cmp th .pd{display:block;font-weight:500;text-transform:none;letter-spacing:0;color:var(--muted);font-size:11.5px}
.cmp td .d{display:block;font-size:12px;font-weight:600;margin-top:1px}
.cmp td.best{color:var(--yellow);font-weight:600}
.cmp tr.sec td{background:var(--card2);font-family:var(--head);font-size:17px;letter-spacing:.05em;color:var(--text2);padding:6px 10px;text-align:left}
.cmp td.avg,.cmp th.avg{border-left:1px solid var(--axis)}
.coming p{color:var(--text2);font-family:var(--ui);font-size:15px;line-height:1.5}
select{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:6px 10px;font-family:var(--ui);font-size:14px}

@media (max-width:700px){
  .top-row{padding:10px 14px;gap:8px 10px;flex-wrap:wrap}
  #refreshBtn{margin-left:auto}
  .sync{order:5;width:100%;margin-left:0;font-size:13px;white-space:normal}
  .top-row .brand{font-size:24px}
  .who{display:none}
  nav.tabs{padding:0 10px}
  main{padding:14px 12px 60px}
  .kpi .val{font-size:30px}
  .card{padding:14px}
  .daybar h2{font-size:30px}
}
</style>
</head>
<body>

<!-- Sign-in gate -->
<section id="gate">
  <div class="gate-card">
    <div class="brand">DEUCE <b>&amp;</b> SMASH</div>
    <div class="brand" style="font-size:26px;color:var(--text2);margin-top:6px">OPS DASHBOARD</div>
    <p class="gate-sub">Owners only. Sign in with your Google account.</p>
    <div id="gateBody">
      <div class="spinner"></div>
    </div>
    <div class="gate-msg" id="gateMsg"></div>
  </div>
</section>

<!-- App -->
<div id="app" class="hidden">
  <header class="top">
    <div class="top-row">
      <div class="brand">D<b>&amp;</b>S OPS</div>
      <div class="sync" id="sync"></div>
      <a class="btn btn-sm" href="/ops/entry/" style="text-decoration:none">Front desk</a>
      <button class="btn btn-sm" id="refreshBtn" title="Reload data from the database">Refresh</button>
      <span class="who" id="who"></span>
      <button class="btn btn-sm" id="signOutBtn">Sign out</button>
    </div>
    <nav class="tabs" id="tabs">
      <a href="#today" data-tab="today">Day view</a>
      <a href="#utilisation" data-tab="utilisation">Utilisation</a>
      <a href="#revenue" data-tab="revenue">Revenue</a>
      <a href="#weekly" data-tab="weekly">Weekly</a>
      <a href="#monthly" data-tab="monthly">Monthly</a>
      <a href="#players" data-tab="players">Players</a>
      <a href="#health" data-tab="health">Data health</a>
    </nav>
  </header>
  <main>
    <div id="banners"></div>
    <div id="filterBar" class="filters"></div>
    <div id="view"></div>
  </main>
</div>
<div id="tip"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCicHoHWs7R8ifZ7Q5FcjhTncgO0AOODeY",
  authDomain: "deuceandsmash-ops.firebaseapp.com",
  databaseURL: "https://deuceandsmash-ops-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "deuceandsmash-ops",
  storageBucket: "deuceandsmash-ops.firebasestorage.app",
  messagingSenderId: "734897702156",
  appId: "1:734897702156:web:044b91164114be8cc9b529"
};
// Display-side allowlist. The real lock is the database rules — this only gives a friendly message.
const OWNERS = ['84.ranjith@gmail.com', 'rashmi.rajamanickam@gmail.com', 'manojnr.07@gmail.com'];

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getDatabase(fbApp);

/* ═══════════════════ Utilities ═══════════════════ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum = (a, f) => a.reduce((s, x) => s + (f ? f(x) : x || 0), 0);
const inr = v => '₹' + Math.round(v || 0).toLocaleString('en-IN');
const inrK = v => {
  const a = Math.abs(v || 0), sg = v < 0 ? '−' : '';
  if (a >= 1e5) return sg + '₹' + (a / 1e5).toFixed(a >= 1e7 ? 0 : 2).replace(/\.?0+$/, '') + 'L';
  if (a >= 1e3) return sg + '₹' + (a / 1e3).toFixed(1).replace(/\.0$/, '') + 'k';
  return sg + '₹' + Math.round(a);
};
const pct = (v, d = 1) => isFinite(v) ? (v * 100).toFixed(d) + '%' : '—';
const hrs = m => { const h = (m || 0) / 60; return (h >= 100 ? Math.round(h) : h >= 10 ? h.toFixed(0) : h.toFixed(1)).toString().replace(/\.0$/, '') + 'h'; };
const num = v => Math.round(v || 0).toLocaleString('en-IN');
const D = iso => new Date(iso + 'T00:00:00Z');
const addDays = (iso, n) => new Date(D(iso).getTime() + n * 864e5).toISOString().slice(0, 10);
const dowOf = iso => D(iso).getUTCDay();
const daysBetween = (a, b) => Math.round((D(b) - D(a)) / 864e5);
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DOW_MON = [1,2,3,4,5,6,0];
const fd = iso => { const d = D(iso); return d.getUTCDate() + ' ' + MON[d.getUTCMonth()]; };
const fdw = iso => DOW[dowOf(iso)] + ' ' + fd(iso);

  A.avail = { padel: 0, pickle: 0 }; A.peakUsed = { padel: 0, pickle: 0 }; A.peakAvail = { padel: 0, pickle: 0 };

/* ═══════════════════ KPI tiles ═══════════════════ */
function delta(cur, prev, goodUp = true, kind = 'pct') {
  if (!isFinite(cur) || !isFinite(prev) || prev === 0 && cur === 0) return '';
  let txt, dir;
  if (kind === 'pp') { const d = (cur - prev) * 100; dir = Math.abs(d) < 0.05 ? 0 : Math.sign(d); txt = (d >= 0 ? '+' : '−') + Math.abs(d).toFixed(1) + ' pts'; }
  else { if (prev === 0) return ''; const d = (cur - prev) / Math.abs(prev); dir = Math.abs(d) < 0.005 ? 0 : Math.sign(d); txt = Math.abs(d) > 9.99 ? (d > 0 ? '>+999%' : '−>999%') : (d >= 0 ? '+' : '−') + Math.abs(d * 100).toFixed(0) + '%'; }
  const good = dir === 0 ? 'flat' : ((dir > 0) === goodUp ? 'up' : 'down');
  if (dir === 0) return `<span class="delta flat">no change</span>`;
  return `<span class="delta ${good}">${dir > 0 ? ICON.up : ICON.down}${txt}</span>`;
}
function kpi(label, val, foot = '', hero = false, tipHtml) {
  return `<div class="kpi${hero ? ' hero' : ''}"${tipHtml ? ` data-tip="${tip(tipHtml)}"` : ''}><div class="lab">${esc(label)}</div><div class="val">${val}</div>${foot ? `<div class="foot">${foot}</div>` : ''}</div>`;
}

/* ═══════════════════ Period filter ═══════════════════ */
const PRESETS = [['7d', '7D'], ['30d', '30D'], ['90d', '90D'], ['mtd', 'This month'], ['lm', 'Last month'], ['all', 'All time'], ['custom', 'Custom']];
let period = store.get('period', { p: '30d' });
function range() {
  const p = period.p;
  if (p === '7d') return [maxD(addDays(LAST, -6)), LAST];
  if (p === '30d') return [maxD(addDays(LAST, -29)), LAST];
  if (p === '90d') return [maxD(addDays(LAST, -89)), LAST];
  if (p === 'mtd') return [maxD(LAST.slice(0, 8) + '01'), LAST];
  if (p === 'lm') { const s = addDays(LAST.slice(0, 8) + '01', -1); return [maxD(s.slice(0, 8) + '01'), s]; }
  if (p === 'custom' && period.from && period.to) return [maxD(period.from), period.to > LAST ? LAST : period.to];
  return [FIRST, LAST];
}
const maxD = d => d < FIRST ? FIRST : d;
function prevRange([a, b]) { const n = daysBetween(a, b) + 1, pb = addDays(a, -1), pa = addDays(a, -n); return pb < FIRST ? null : [maxD(pa), pb]; }

  const [a, b] = range();
  return `<div class="seg">${PRESETS.map(([k, l]) => `<button data-p="${k}" class="${period.p === k ? 'on' : ''}">${l}</button>`).join('')}</div>
    ${period.p === 'custom' ? `<input type="date" id="pf" value="${a}" min="${FIRST}" max="${LAST}"><span class="range-label">to</span><input type="date" id="pt" value="${b}" min="${FIRST}" max="${LAST}">` : ''}
    <span class="range-label">${fd(a)} – ${fd(b)} · ${daysBetween(a, b) + 1} days</span>`;
}
$('#filterBar').addEventListener('click', e => {
  const b = e.target.closest('[data-p]'); if (!b) return;
  if (b.dataset.p === 'custom') { const [a, c] = range(); period = { p: 'custom', from: a, to: c }; } else period = { p: b.dataset.p };
  store.set('period', period); render();
});
$('#filterBar').addEventListener('change', e => {
  if (e.target.id === 'pf' || e.target.id === 'pt') {
    period = { p: 'custom', from: $('#pf').value, to: $('#pt').value };
    if (period.from > period.to) [period.from, period.to] = [period.to, period.from];
    store.set('period', period); render();
  }
});

/* ═══════════════════ Shared series ═══════════════════ */
function rolling(arr, n = 7) { return arr.map((_, i) => { if (i < n - 1) return null; let s = 0; for (let k = i - n + 1; k <= i; k++) s += arr[k]; return s / n; }); }
function dayUtil(iso, s) { return DAY[iso].used[s] / (OPEN_HOURS * 60 * COURTS[s].length); }

/* ═══════════════════ VIEW: Day ═══════════════════ */
let dayISO = null;
function viewDay() {
  if (!dayISO || dayISO < FIRST || dayISO > LAST) dayISO = LAST;

  const A = agg(dayISO, dayISO);

  const prevSame = [1, 2, 3, 4].map(k => addDays(dayISO, -7 * k)).filter(x => x >= FIRST);
  const T = prevSame.length ? prevSame.map(x => agg(x, x)) : null;
  const avg = f => T ? sum(T, f) / T.length : NaN;
  const vs = (cur, f, goodUp = true, kind) => T ? `${delta(cur, avg(f), goodUp, kind)} <span>vs typical ${DOW[dw]}</span>` : '';
  const isWeekend = dw === 0 || dw === 6;

  </div>`;

    ${kpi('Collected', inr(A.collected), A.receivable ? `<span class="delta down">${inr(A.receivable)} to collect</span>` : `<span>Fully tallied</span>`)}
    ${kpi('Court-hours', hrs(A.used.padel + A.used.pickle), vs(A.used.padel + A.used.pickle, x => x.used.padel + x.used.pickle))}
    ${kpi('Padel utilisation', pct(A.util('padel'), 0), vs(A.util('padel'), x => x.util('padel'), true, 'pp'))}
    ${kpi('Pickleball utilisation', pct(A.util('pickle'), 0), vs(A.util('pickle'), x => x.util('pickle'), true, 'pp'))}
    ${kpi('Bookings', num(A.bookings), vs(A.bookings, x => x.bookings) + (A.noShow.n ? ` <span>${A.noShow.n} no-show</span>` : ''))}
    ${kpi('Beverages', inr(A.rev.beverage), vs(A.rev.beverage, x => x.rev.beverage))}
    ${kpi('Rev / court-hour', inr(A.revpach), vs(A.revpach, x => x.revpach))}
  </div>`;

  // Court timeline
  const occ = d.list.flatMap(b => b.occ.map(o => ({ ...o, b })));
  const maxEnd = Math.max(CLOSE_H * 60, ...occ.map(o => o.e)), minStart = Math.min(OPEN_H * 60, ...occ.map(o => o.s));
  const t0 = Math.floor(minStart / 60) * 60, t1 = Math.ceil(maxEnd / 60) * 60, span = t1 - t0;
  const L = m => ((m - t0) / span * 100).toFixed(3) + '%';
  let axis = ''; for (let m = t0; m <= t1; m += 60) if (((m - t0) / 60) % 2 === 0) axis += `<span style="left:${L(m)}">${hhmm(m)}</span>`;

  let grid = ''; for (let m = t0 + 60; m < t1; m += 60) grid += `<div class="tl-hr" style="left:${L(m)}"></div>`;
  const rows = ALL_COURTS.map(c => {
    const blocks = occ.filter(o => o.c === c).map(o => {

        ...(b.receivable ? [{ l: 'To collect', v: inr(b.receivable) }] : []),

      return `<div class="tl-b ${o.sport}" style="left:${L(o.s)};width:${((o.e - o.s) / span * 100).toFixed(3)}%" data-tip="${t}">

  h += `<div class="grid"><div class="card c12"><div class="card-h"><div><h3>Courts</h3><div class="sub">Every booking on its court. Shaded columns are peak hours. % is each court's fill for the day.</div></div></div>

    ${list.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th class="l">Time</th><th class="l">Name</th><th class="l">Type</th><th class="l">Courts</th><th>Mins</th><th>Billed</th><th>Paid</th><th>Revenue</th><th class="l">Paid via</th><th class="l">Notes / issues</th></tr></thead><tbody>
    ${list.map(b => {

    ${kpi('Off-peak fill', pct((A.offUsed.padel + A.offUsed.pickle) / (A.offAvail.padel + A.offAvail.pickle)), `<span>Padel ${pct(A.offUsed.padel / A.offAvail.padel, 0)} · Pickle ${pct(A.offUsed.pickle / A.offAvail.pickle, 0)}</span>`)}
    ${kpi('Court-hours booked', hrs(A.used.padel + A.used.pickle), dlt(A.used.padel + A.used.pickle, x => x.used.padel + x.used.pickle))}
    ${kpi('After 11 PM', hrs(late), `<span>Extra play outside opening hours (not in %)</span>`)}
    ${kpi('Avg booking length', durs.length ? Math.round(sum(durs, x => x.minutes) / durs.length) + ' min' : '—', `<span>${num(durs.length)} played bookings</span>`)}
  </div>`;

  // Utilisation over time — daily faint + 7-day average
  const idxA = DAYS.indexOf(a), idxB = DAYS.indexOf(b), labels = DAYS.slice(idxA, idxB + 1);
  const dailyU = s => DAYS.map(x => dayUtil(x, s));
  const rP = rolling(dailyU('padel')).slice(idxA, idxB + 1), rK = rolling(dailyU('pickle')).slice(idxA, idxB + 1);
  const dP = dailyU('padel').slice(idxA, idxB + 1), dK = dailyU('pickle').slice(idxA, idxB + 1);
  const yMaxU = niceMax(Math.max(0.1, ...dP, ...dK) * 1.02);
  h += `<div class="grid">` + chartCard('c12', 'Utilisation over time', 'Bold line = 7-day average · faint line = each day', {
    legend: [{ l: 'Padel', c: HEX.padel, line: 1 }, { l: 'Pickleball', c: HEX.pickle, line: 1 }],
    draw: w => lines(w, { labels, xFmt: fd, yFmt: v => pct(v, 0), max: yMaxU, endLabels: true, aria: 'Daily utilisation by sport',
      series: [{ c: HEX.padel, values: dP, faint: 1 }, { c: HEX.pickle, values: dK, faint: 1 }, { c: HEX.padel, values: rP, short: 'Padel' }, { c: HEX.pickle, values: rK, short: 'Pickle' }],
      tip: i => tipRows(fdw(labels[i]), [{ l: 'Padel (day)', v: pct(dP[i], 0), c: HEX.padel }, { l: 'Padel (7-day avg)', v: rP[i] == null ? '—' : pct(rP[i], 0) },
        { l: 'Pickleball (day)', v: pct(dK[i], 0), c: HEX.pickle }, { l: 'Pickleball (7-day avg)', v: rK[i] == null ? '—' : pct(rK[i], 0) }]) }),
    table: () => ({ head: ['Date', 'Padel', 'Padel 7d', 'Pickleball', 'Pickle 7d'], rows: labels.map((l, i) => [fdw(l), pct(dP[i], 0), rP[i] == null ? '—' : pct(rP[i], 0), pct(dK[i], 0), rK[i] == null ? '—' : pct(rK[i], 0)]) })
  });

  // Heatmaps
  for (const s of SPORTS) {
    h += chartCard('c6', `${SPORT[s]} · when courts fill`, `% of ${COURTS[s].length} courts in use, by weekday and hour`, {
      draw: w => heatmap(w, A, s),
      table: () => ({ head: ['Day', ...Array.from({ length: OPEN_HOURS }, (_, i) => hhmm((OPEN_H + i) * 60))],
        rows: DOW_MON.map(dw => [DOW[dw], ...Array.from({ length: OPEN_HOURS }, (_, i) => { const cap = A.dowCount[dw] * 60 * COURTS[s].length; return cap ? Math.round(A.heat[s][dw][OPEN_H + i] / cap * 100) + '%' : '—'; })]) })
    });
  }

  // Per court
  const courtItems = ALL_COURTS.map(c => ({ l: c + (COURT_SPORT[c] === 'padel' ? ' · Padel' : ' · Pickleball'), v: A.court[c] / (A.ndays * OPEN_HOURS * 60), c: HEX[COURT_SPORT[c]], sw: true, share: false,
    extra: [{ l: 'Hours used', v: hrs(A.court[c]) }] }));
  h += `<div class="card c4"><div class="card-h"><div><h3>By court</h3><div class="sub">Fill per court. Sheet bookings are spread evenly where the court wasn't recorded.</div></div></div>${barList(courtItems, v => pct(v), 0)}</div>`;

  // By weekday
  const wd = DOW_MON.map(dw => ({ dw, p: A.dowCount[dw] ? sum([...Array(24).keys()], hh => A.heat.padel[dw][hh]) / (A.dowCount[dw] * OPEN_HOURS * 60 * 2) : 0,
    k: A.dowCount[dw] ? sum([...Array(24).keys()], hh => A.heat.pickle[dw][hh]) / (A.dowCount[dw] * OPEN_HOURS * 60 * 3) : 0 }));
  h += chartCard('c4', 'By weekday', 'Average fill on each day of the week', {
    legend: [{ l: 'Padel', c: HEX.padel }, { l: 'Pickleball', c: HEX.pickle }],
    draw: w => groupedBars(w, wd.map(x => DOW[x.dw]), [{ c: HEX.padel, values: wd.map(x => x.p), l: 'Padel' }, { c: HEX.pickle, values: wd.map(x => x.k), l: 'Pickleball' }], v => pct(v, 0)),
    table: () => ({ head: ['Day', 'Padel', 'Pickleball', 'Days in range'], rows: wd.map(x => [DOW[x.dw], pct(x.p), pct(x.k), A.dowCount[x.dw]]) })
  });

  // Booking length
  const bins = [[0, 45, '≤ 45m'], [46, 75, '1h'], [76, 105, '1.5h'], [106, 135, '2h'], [136, 195, '2.5–3h'], [196, 9999, '3h +']];
  const binV = bins.map(([lo, hi, l]) => ({ l, v: durs.filter(x => x.minutes >= lo && x.minutes <= hi).length, c: HEX.s1 }));

    <div class="lists"><div class="rank"><h4>Busiest</h4>${top.map(rankRow).join('')}</div><div class="rank"><h4>Leanest</h4>${low.map(rankRow).join('')}</div></div></div>`;

  // Util vs revenue scatter
  const pts = labels.map(x => { const u = (DAY[x].used.padel + DAY[x].used.pickle) / (OPEN_HOURS * 60 * 5), r = DAY[x].rev.total;
    return { x: u, y: r, c: (dowOf(x) === 0 || dowOf(x) === 6) ? HEX.s4 : HEX.s1, tip: tipRows(fdw(x), [{ l: 'Utilisation', v: pct(u, 0) }, { l: 'Revenue', v: inr(r) }, { l: 'Rev / court-hour', v: inr(r / (OPEN_HOURS * 5)) }]) }; });
  h += chartCard('c6', 'Utilisation vs revenue', 'Each dot is a day. Dots high and to the left earn more per hour used.', {
    legend: [{ l: 'Weekday', c: HEX.s1 }, { l: 'Weekend', c: HEX.s4 }],
    draw: w => scatter(w, { pts, xFmt: v => pct(v, 0), yFmt: inrK, xTitle: 'Utilisation →', aria: 'Daily utilisation vs revenue' }),
    table: () => ({ head: ['Date', 'Utilisation', 'Revenue'], rows: labels.map((x, i) => [fdw(x), pct(pts[i].x, 0), inr(pts[i].y)]) })
  });
  h += `</div>`;
  $('#view').innerHTML = h;
}
function groupedBars(w, labels, series, yFmt) {
  const h = 240, m = { l: 44, r: 8, t: 14, b: 26 }, iw = w - m.l - m.r, ih = h - m.t - m.b, n = labels.length;
  const max = niceMax(Math.max(0.01, ...series.flatMap(s => s.values)));
  const y = v => m.t + ih - (v / max) * ih, slot = iw / n, gw = slot * .72, bw = (gw - 2 * (series.length - 1)) / series.length;
  let s = `<svg viewBox="0 0 ${w} ${h}" role="img">` + yAxis(m, iw, ih, max, yFmt);
  labels.forEach((l, i) => {
    const x0 = m.l + i * slot + (slot - gw) / 2;
    series.forEach((sr, k) => { const v = sr.values[i]; if (v > 0) s += `<rect x="${(x0 + k * (bw + 2)).toFixed(1)}" y="${y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${(m.t + ih - y(v)).toFixed(1)}" rx="3" fill="${sr.c}"/>`; });
    s += `<text x="${(m.l + i * slot + slot / 2).toFixed(1)}" y="${h - 7}" text-anchor="middle">${esc(l)}</text>`;
    s += `<rect class="hit" x="${(m.l + i * slot).toFixed(1)}" y="${m.t}" width="${slot.toFixed(1)}" height="${ih}" data-tip="${tip(tipRows(l, series.map(sr => ({ l: sr.l, v: yFmt(sr.values[i]), c: sr.c }))))}"/>`;
  });
  return s + '</svg>';
}

  const idxA = DAYS.indexOf(a), idxB = DAYS.indexOf(b), labels = DAYS.slice(idxA, idxB + 1);

  });

  // Revenue per court-hour trend (weekly, by sport)
  const weeks = [...new Set(labels.map(weekStart))];
  const wk = weeks.map(ws => agg(ws < a ? a : ws, addDays(ws, 6) > b ? b : addDays(ws, 6)));
  h += chartCard('c6', 'Revenue per court-hour, by week', 'Court & event revenue ÷ court-hours available', {

  });
  // Mix + modes
  const mix = REV_PARTS.map(p => ({ l: p.label, v: A.rev[p.k], c: p.c, sw: true }));
  const modes = MODES.map(mo => ({ l: mo.label, v: A.modes[mo.k], c: mo.c, sw: true })).filter(i => i.v > 0);

    ${mrows.length > 1 ? `<tr class="total"><td class="l">Total</td><td>${A.ndays}</td><td>${inr(A.rev.total)}</td><td>${inr(A.rev.court)}</td><td>${inr(A.rev.racquet)}</td><td>${inr(A.rev.balls)}</td><td>${inr(A.rev.beverage)}</td><td>${inr(A.rev.events)}</td><td>${inr(A.collected)}</td><td>${inr(A.receivable)}</td><td>${inr(A.revpach)}</td><td>${pct(A.util('padel'))}</td><td>${pct(A.util('pickle'))}</td><td>${num(A.bookings)}</td></tr>` : ''}

  h += `<div class="card c12 coming"><div class="card-h"><div><h3>Revenue vs expenses</h3><div class="sub">Next build</div></div></div>

/* ═══════════════════ VIEW: Weekly ═══════════════════ */
function viewWeekly() {
  const ws = weekStart(LAST), dayN = daysBetween(ws, LAST) + 1;
  const cur = agg(maxD(ws), LAST);
  const sameLast = agg(maxD(addDays(ws, -7)), addDays(ws, -7 + dayN - 1));
  const lastFull = agg(maxD(addDays(ws, -7)), addDays(ws, -1));
  const prev4 = [1, 2, 3, 4].map(k => addDays(ws, -7 * k)).filter(x => addDays(x, 6) >= FIRST).map(x => agg(maxD(x), addDays(x, 6)));
  const avg4 = f => prev4.length ? sum(prev4, f) / prev4.length : NaN;
  const M = [
    ['Revenue', x => x.rev.total, inr, true],
    ['Collected', x => x.collected, inr, true],
    ['Revenue per court-hour', x => x.revpach, inr, true],
    ['Court-hours booked', x => x.used.padel + x.used.pickle, hrs, true],
    ['Padel utilisation', x => x.util('padel'), v => pct(v), true, 'pp'],
    ['Pickleball utilisation', x => x.util('pickle'), v => pct(v), true, 'pp'],
    ['Peak-hour fill', x => (x.peakUsed.padel + x.peakUsed.pickle) / (x.peakAvail.padel + x.peakAvail.pickle), v => pct(v), true, 'pp'],
    ['Bookings', x => x.bookings, num, true],
    ['Avg booking value', x => x.avgBooking, inr, true],
    ['Unique bookers', x => x.bookers, num, true],
    ['New bookers', x => x.newBookers, num, true],
    ['Beverages', x => x.rev.beverage, inr, true],
    ['D&S fill-ins', x => x.fill.n, num, null],
    ['No-shows', x => x.noShow.n, num, false],
    ['To collect', x => x.receivable, inr, false]
  ];
  let h = `<div class="section-title" style="margin-top:0">WEEK OF ${fd(ws).toUpperCase()} <small>Mon–${DOW[dowOf(LAST)]}, ${dayN} day${dayN > 1 ? 's' : ''} so far · compared like-for-like with the same days last week</small></div>`;
  h += `<div class="grid"><div class="card c12"><div class="tbl-wrap"><table class="tbl"><thead><tr><th class="l">Metric</th><th>This week so far</th><th>Same days last week</th><th>Change</th><th>Last full week</th><th>4-week average</th></tr></thead><tbody>
    ${M.map(([l, f, fm, up, kind]) => { const c = f(cur), s = f(sameLast); return `<tr><td class="l">${l}</td><td><b>${fm(c)}</b></td><td>${fm(s)}</td><td>${up === null ? '<span class="muted">—</span>' : delta(c, s, up, kind) || '<span class="muted">—</span>'}</td><td>${fm(f(lastFull))}</td><td>${fm(avg4(f))}</td></tr>`; }).join('')}
  </tbody></table></div></div>`;

  // Week by week
  const weeks = []; for (let w = weekStart(FIRST); w <= LAST; w = addDays(w, 7)) weeks.push(w);
  const W = weeks.map(w => ({ w, A: agg(maxD(w), addDays(w, 6) > LAST ? LAST : addDays(w, 6)) }));
  h += chartCard('c7', 'Weekly revenue', 'Partial weeks (first and current) marked in the tooltip', {
    legend: REV_PARTS.map(p => ({ l: p.label, c: p.c })),

function issueAmount(b, k, flag) {

  if (k === 'possible_duplicate_of_row') return b.billed ? b.billed.total : 0;

  return 0;
}

  if (k === 'possible_duplicate_of_row') return 'Matches sheet row #' + rest;
  if (k === 'line_items_ne_total') return 'Line items ' + rest.replace('≠', ' vs total ');
  if (k === 'underpaid_no_reason') return `Short by ${inr(+rest)}`;
  if (k === 'unpaid') return `${inr(b.outstanding)} not recorded as paid`;
  if (k === 'unparsed_slot') return `Slot: "${rest}"`;
  if (k === 'status') return rest === 'no_show' ? 'Did not show up' : 'Cancelled';
  return rest;
}

  }
  const open = items.filter(i => i.def.sev !== 'info');
  const counts = {}; for (const i of items) counts[i.k] = (counts[i.k] || 0) + 1;
  const atStake = sum(open, i => ['unpaid', 'partly_paid', 'underpaid_no_reason'].includes(i.k) ? i.amt : 0);
  const rowsWith = new Set(open.map(i => i.b.sheetRow)).size;

    ${kpi('Critical', num(open.filter(i => i.def.sev === 'critical').length), `${chip('critical')}`)}
    ${kpi('Serious', num(open.filter(i => i.def.sev === 'serious').length), `${chip('serious')}`)}
    ${kpi('To check', num(open.filter(i => i.def.sev === 'warning').length), `${chip('warning')}`)}
  </div>`;

  h += reconCard(a, b);
  // Tally by period
  const groups = [];
  if (healthGroup === 'month') { for (const mo of [...new Set(DAYS.filter(x => x >= a && x <= b).map(x => x.slice(0, 7)))]) { const ds = DAYS.filter(x => x >= a && x <= b && x.startsWith(mo)); groups.push({ l: fmonth(mo), from: ds[0], to: ds[ds.length - 1] }); } }
  else { for (let w = weekStart(a); w <= b; w = addDays(w, 7)) groups.push({ l: 'Week of ' + fd(w), from: maxD(w < a ? a : w), to: addDays(w, 6) > b ? b : addDays(w, 6) }); }
  const G = groups.map(g => {
    const bk = A.bk.filter(x => x.date >= g.from && x.date <= g.to && x.played);
    const billed = sum(bk, x => x.billed ? x.billed.total : 0), bev = sum(bk, x => x.beverage || 0), fill = sum(bk, x => x.fillIn ? x.fillIn.shortfall : 0);
    const part = sum(bk, x => x.partial ? x.underpaid || 0 : 0), paid = sum(bk, x => x.paid ? x.paid.total : 0);
    const unpaid = sum(bk, x => x.outstanding || 0), under = sum(bk, x => x.partial ? 0 : x.underpaid || 0);
    const issues = open.filter(i => i.b.date >= g.from && i.b.date <= g.to).length;
    return { ...g, billed, bev, fill, part, paid, unpaid, under, issues, gap: billed + bev - fill - part - paid };
  }).reverse();
  h += `<div class="grid"><div class="card c12"><div class="card-h"><div><h3>Does it tally?</h3><div class="sub">For played bookings: billed + beverages − fill-in & partial-play discounts should equal what was paid. Any gap is unpaid or unexplained.</div></div>
    <div class="acts"><div class="seg"><button data-hg="week" class="${healthGroup === 'week' ? 'on' : ''}">Weekly</button><button data-hg="month" class="${healthGroup === 'month' ? 'on' : ''}">Monthly</button></div></div></div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th class="l">Period</th><th>Billed</th><th>+ Beverages</th><th>− Fill-ins</th><th>− Partial play</th><th>Should be paid</th><th>Paid</th><th>Gap</th><th>of which unpaid</th><th>unexplained</th><th>Issues</th></tr></thead><tbody>
    ${G.map(g => `<tr><td class="l">${g.l}</td><td>${inr(g.billed)}</td><td>${inr(g.bev)}</td><td>${inr(g.fill)}</td><td>${inr(g.part)}</td><td>${inr(g.billed + g.bev - g.fill - g.part)}</td><td>${inr(g.paid)}</td>
      <td>${Math.abs(g.gap) < 1 ? `<span style="color:var(--goodText)">✓ Tallies</span>` : `<b style="color:${g.gap > 0 ? '#ffb08f' : 'var(--text)'}">${inr(g.gap)}</b>`}</td><td>${g.unpaid ? inr(g.unpaid) : '—'}</td><td>${g.under ? inr(g.under) : '—'}</td><td>${g.issues || '—'}</td></tr>`).join('')}
    </tbody></table></div></div>`;

  // Issue type summary
  const types = Object.keys(ISSUES).filter(k => counts[k]).sort((p, q) => SEV_ORDER[ISSUES[p].sev] - SEV_ORDER[ISSUES[q].sev] || counts[q] - counts[p]);
  h += `<div class="card c12"><div class="card-h"><div><h3>What needs checking</h3><div class="sub">Pick an issue type to filter the list below. Export it as a CSV to hand to the front desk.</div></div>
    <div class="acts"><button class="btn btn-sm" id="csvBtn">Export CSV</button></div></div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th class="l">Issue</th><th class="l">Severity</th><th>Rows</th><th>₹ involved</th><th class="l" style="text-align:left">What to check</th></tr></thead><tbody>
    ${types.filter(k => healthInfo || ISSUES[k].sev !== 'info').map(k => `<tr style="cursor:pointer" data-iss="${k}" class="${healthIssue === k ? 'sel' : ''}"><td class="l"><b>${ISSUES[k].label}</b>${healthIssue === k ? ' ◂' : ''}</td><td class="l">${chip(ISSUES[k].sev)}</td><td>${counts[k]}</td><td>${(() => { const v = sum(items.filter(i => i.k === k), i => i.amt); return v ? inr(v) : '—'; })()}</td><td class="wrap">${esc(ISSUES[k].check)}</td></tr>`).join('')}
    </tbody></table></div>
    <div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <select id="issSel"><option value="all">All issues</option>${types.map(k => `<option value="${k}" ${healthIssue === k ? 'selected' : ''}>${ISSUES[k].label} (${counts[k]})</option>`).join('')}</select>
      <label style="font-family:var(--ui);font-size:14px;color:var(--text2);display:flex;gap:6px;align-items:center"><input type="checkbox" id="infoChk" ${healthInfo ? 'checked' : ''}> Show informational</label>
    </div></div>`;

  const shown = items.filter(i => (healthInfo || i.def.sev !== 'info') && (healthIssue === 'all' || i.k === healthIssue))
    .sort((p, q) => q.b.date.localeCompare(p.b.date) || SEV_ORDER[p.def.sev] - SEV_ORDER[q.def.sev]);
  window.__healthRows = shown;
  h += `<div class="card c12"><div class="card-h"><div><h3>Rows to fix</h3><div class="sub">${shown.length} item${shown.length === 1 ? '' : 's'} · newest first · row number = row in the D&S tab</div></div></div>
    ${shown.length ? `<div class="tbl-wrap scroll-y"><table class="tbl"><thead><tr><th class="l">Row</th><th class="l">Date</th><th class="l">Name</th><th class="l">Issue</th><th class="l" style="text-align:left">Detail</th><th>Billed</th><th>Paid</th><th>₹ involved</th><th class="l" style="text-align:left">Notes</th></tr></thead><tbody>
    ${shown.map(i => `<tr><td class="l"><b>#${i.b.sheetRow}</b></td><td class="l">${fd(i.b.date)}</td><td class="l">${esc(i.b.name)}</td><td class="l">${chip(i.def.sev)} ${esc(i.def.label)}</td><td class="wrap">${esc(flagDetail(i.k, i.f, i.b))}</td><td>${inr(i.b.billed ? i.b.billed.total : 0)}</td><td>${inr(i.b.paid ? i.b.paid.total : 0)}</td><td>${i.amt ? inr(i.amt) : '—'}</td><td class="wrap">${esc(i.b.notes || '')}</td></tr>`).join('')}
    </tbody></table></div>` : '<div class="empty">Nothing to fix in this period.</div>'}</div></div>`;
  $('#view').innerHTML = h;

  document.querySelectorAll('[data-hg]').forEach(x => x.onclick = () => { healthGroup = x.dataset.hg; store.set('hg', healthGroup); render(); });
  document.querySelectorAll('[data-iss]').forEach(x => x.onclick = () => { healthIssue = healthIssue === x.dataset.iss ? 'all' : x.dataset.iss; render(); });
  $('#issSel').onchange = e => { healthIssue = e.target.value; render(); };
  $('#infoChk').onchange = e => { healthInfo = e.target.checked; render(); };
  $('#csvBtn').onclick = () => {
    const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
    const lines = [['Sheet row', 'Sr no', 'Date', 'Name', 'Issue', 'Severity', 'Detail', 'Billed', 'Paid', 'Amount involved', 'What to check', 'Notes'].map(q).join(',')];
    for (const i of shown) lines.push([i.b.sheetRow, i.b.sr, i.b.date, i.b.name, i.def.label, SEV_LABEL[i.def.sev], flagDetail(i.k, i.f, i.b), i.b.billed ? i.b.billed.total : 0, i.b.paid ? i.b.paid.total : 0, i.amt, i.def.check, i.b.notes].map(q).join(','));
    const blob = new Blob(['﻿' + lines.join('\n')], { type: 'text/csv' });
    const u = URL.createObjectURL(blob), el = document.createElement('a');
    el.href = u; el.download = `ds-data-issues-${a}-to-${b}.csv`; document.body.appendChild(el); el.click(); el.remove(); setTimeout(() => URL.revokeObjectURL(u), 1000);
  };
}

/* ═══════════════════ Sheet vs app (parallel run) ═══════════════════ */
function reconCard(a, b) {
  const head = `<div class="card c12"><div class="card-h"><div><h3>Sheet vs app</h3><div class="sub">During the parallel run, every booking should be in both the sheet and the desk app. Matched by date, sport and start time (±30 min).</div></div></div>`;
  if (!APP.length) return `<div class="grid" style="margin-bottom:16px">${head}<div class="empty">No bookings have been entered in the desk app yet. This check starts the day the front desk begins using it.</div></div></div>`;
  const appStart = APP.map(x => x.date).sort()[0], from = a > appStart ? a : appStart;
  if (from > b) return `<div class="grid" style="margin-bottom:16px">${head}<div class="empty">The desk app started on ${fd(appStart)}, after this period.</div></div></div>`;
  const apps = APP.filter(x => x.date >= from && x.date <= b && x.status !== 'cancelled');
  const sheet = BK.filter(x => x.date >= from && x.date <= b && x.played);
  const used = new Set(), pairs = [], appOnly = [];
  for (const e of apps.sort((p, q) => p.date.localeCompare(q.date) || p.start - q.start)) {
    let best = null, bd = 31;
    for (const s of sheet) {
      if (used.has(s) || s.date !== e.date) continue;
      const sp = (s.segments && s.segments[0] && s.segments[0].sport) || null;
      if (sp && sp !== e.sport) continue;
      const d = s.startMin == null ? 30 : Math.abs(s.startMin - e.start);
      if (d < bd) { bd = d; best = s; }
    }
    if (best) { used.add(best); pairs.push({ e, s: best }); } else appOnly.push(e);
  }
  const sheetOnly = sheet.filter(s => !used.has(s));
  const diffs = pairs.filter(({ e, s }) => Math.abs((e.totals ? e.totals.due : 0) - s.rv.total) > 1 || Math.abs((e.paid || 0) - (s.paid ? s.paid.total : 0)) > 1);
  const days = [...new Set([...apps.map(x => x.date), ...sheet.map(x => x.date)])].sort().reverse();
  const row = d => {
    const A_ = apps.filter(x => x.date === d), S_ = sheet.filter(x => x.date === d);
    const ad = sum(A_, x => x.totals ? x.totals.due : 0), sd = sum(S_, x => x.rv.total), ap = sum(A_, x => x.paid || 0), sp = sum(S_, x => x.paid ? x.paid.total : 0);
    const ok = A_.length === S_.length && Math.abs(ad - sd) < 1 && Math.abs(ap - sp) < 1;
    return `<tr><td class="l">${fdw(d)}</td><td>${S_.length}</td><td>${A_.length}</td><td>${inr(sd)}</td><td>${inr(ad)}</td><td>${inr(sp)}</td><td>${inr(ap)}</td><td>${ok ? '<span style="color:var(--goodText)">✓ Match</span>' : `<b style="color:#ffb08f">${ad - sd < 0 ? '−' : '+'}${inr(Math.abs(ad - sd))}</b>`}</td></tr>`;
  };
  const who = x => (x.players || []).find(p => p.booker) || (x.players || [])[0] || {};
  const list = [
    ...appOnly.map(e => ({ d: e.date, t: hhmm(e.start), what: 'In the app, missing from the sheet', name: who(e).name, detail: `${e.courts.join(', ')} · due ${inr(e.totals && e.totals.due)} · paid ${inr(e.paid)}` })),
    ...sheetOnly.map(s => ({ d: s.date, t: s.startMin != null ? hhmm(s.startMin) : '—', what: 'In the sheet, missing from the app', name: s.name, detail: `Row #${s.sheetRow} · ${inr(s.rv.total)}` })),
    ...diffs.map(({ e, s }) => ({ d: e.date, t: hhmm(e.start), what: 'Amounts differ', name: who(e).name || s.name, detail: `Sheet row #${s.sheetRow}: revenue ${inr(s.rv.total)}, paid ${inr(s.paid && s.paid.total)} · App: due ${inr(e.totals && e.totals.due)}, paid ${inr(e.paid)}` }))
  ].sort((p, q) => q.d.localeCompare(p.d) || p.t.localeCompare(q.t));
  return `<div class="grid" style="margin-bottom:16px">${head}
    <div class="kpis" style="margin-bottom:12px">${kpi('Matched', num(pairs.length - diffs.length), `<span>of ${num(Math.max(apps.length, sheet.length))} bookings since ${fd(from)}</span>`, true)}
      ${kpi('Only in app', num(appOnly.length), '')}${kpi('Only in sheet', num(sheetOnly.length), '')}${kpi('Amounts differ', num(diffs.length), '')}</div>
    <div class="tbl-wrap scroll-y" style="max-height:320px"><table class="tbl"><thead><tr><th class="l">Day</th><th>Sheet rows</th><th>App bookings</th><th>Sheet revenue</th><th>App due</th><th>Sheet paid</th><th>App paid</th><th>Difference</th></tr></thead><tbody>${days.map(row).join('')}</tbody></table></div>
    ${list.length ? `<div class="tbl-wrap scroll-y" style="max-height:360px;margin-top:14px"><table class="tbl"><thead><tr><th class="l">Date</th><th class="l">Time</th><th class="l">Problem</th><th class="l">Booking</th><th class="l" style="text-align:left">Detail</th></tr></thead><tbody>
      ${list.map(i => `<tr><td class="l">${fd(i.d)}</td><td class="l">${i.t}</td><td class="l">${esc(i.what)}</td><td class="l">${esc(i.name || '—')}</td><td class="wrap">${esc(i.detail)}</td></tr>`).join('')}</tbody></table></div>` : ''}
  </div></div>`;
}

/* ═══════════════════ Router & render ═══════════════════ */
const VIEWS = { today: viewDay, utilisation: viewUtil, revenue: viewRevenue, weekly: viewWeekly, monthly: viewMonthly, players: viewPlayers, health: viewHealth };
const NO_FILTER = new Set(['today', 'weekly', 'monthly']);
function tab() { const t = location.hash.slice(1); return VIEWS[t] ? t : 'today'; }
function render() {
  if (!BK.length) { $('#view').innerHTML = '<div class="empty">No bookings in the database yet. Run the sync script once.</div>'; return; }
  TIPS = []; CHARTS.length = 0; tipEl.classList.remove('on');
  const t = tab();
  document.querySelectorAll('#tabs a').forEach(a => a.classList.toggle('on', a.dataset.tab === t));
  $('#filterBar').classList.toggle('hidden', NO_FILTER.has(t));
  if (!NO_FILTER.has(t)) $('#filterBar').innerHTML = filterBar();
  VIEWS[t]();
  drawCharts();
}
addEventListener('hashchange', () => { render(); scrollTo(0, 0); });

function banners() {
  let h = '';
  if (META) {
    const ran = META.ranAt ? new Date(META.ranAt) : null, age = ran ? (Date.now() - ran) / 36e5 : Infinity;
    if (META.ok === false) h += `<div class="banner crit">${ICON.critical.replace('<svg', '<svg width="18" height="18" style="flex:none;color:#ff9d9d;margin-top:2px"')}<div><b>The last sync failed</b> (${esc(new Date(META.failedAt).toLocaleString('en-IN'))}): ${esc(META.error || '')}<br>Showing data from the last successful sync.</div></div>`;
    else if (age > 30) h += `<div class="banner warn">${ICON.warning.replace('<svg', '<svg width="18" height="18" style="flex:none;color:#ffd27a;margin-top:2px"')}<div><b>Data is ${Math.floor(age)} hours old.</b> The morning sync hasn't run. Check the D&S Ops Sync script's triggers.</div></div>`;
    $('#sync').innerHTML = ran ? `<span class="dot ${META.ok === false ? 'crit' : age > 30 ? 'warn' : ''}"></span>Synced ${ran.toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' })} · ${num(META.bookingCount)} bookings` : '';
  }
  $('#banners').innerHTML = h;
}

/* ═══════════════════ Auth & loading ═══════════════════ */
const provider = new GoogleAuthProvider();
provider.setCustomParameters({ prompt: 'select_account' });
function gate(html, msg = '', err = false) { $('#gate').classList.remove('hidden'); $('#app').classList.add('hidden'); $('#gateBody').innerHTML = html; $('#gateMsg').textContent = msg; $('#gateMsg').className = 'gate-msg' + (err ? ' err' : ''); }
const signInBtn = `<button class="btn btn-primary" id="signInBtn"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#4285F4" d="M45 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h11.8c-.5 2.7-2.1 5-4.4 6.6v5.5h7.1c4.2-3.8 6.5-9.5 6.5-16.1z"/><path fill="#34A853" d="M24 46c5.9 0 10.9-2 14.5-5.3l-7.1-5.5c-2 1.3-4.5 2.1-7.4 2.1-5.7 0-10.6-3.9-12.3-9.1H4.4v5.7C8 41.1 15.4 46 24 46z"/><path fill="#FBBC05" d="M11.7 28.2c-.4-1.3-.7-2.7-.7-4.2s.3-2.9.7-4.2v-5.7H4.4C2.9 17.1 2 20.4 2 24s.9 6.9 2.4 9.9l7.3-5.7z"/><path fill="#EA4335" d="M24 10.7c3.2 0 6.1 1.1 8.4 3.3l6.3-6.3C34.9 4.2 29.9 2 24 2 15.4 2 8 6.9 4.4 14.1l7.3 5.7c1.7-5.2 6.6-9.1 12.3-9.1z"/></svg>Sign in with Google</button>`;
document.addEventListener('click', async e => {
  if (e.target.closest('#signInBtn')) {
    $('#gateMsg').textContent = '';
    try { await signInWithPopup(auth, provider); }
    catch (err) {
      if (['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment'].includes(err.code)) return signInWithRedirect(auth, provider);
      if (err.code !== 'auth/popup-closed-by-user' && err.code !== 'auth/cancelled-popup-request') { $('#gateMsg').textContent = 'Sign-in failed: ' + (err.message || err.code); $('#gateMsg').className = 'gate-msg err'; }
    }
  }
  if (e.target.closest('#signOutBtn') || e.target.closest('#gateSignOut')) { await signOut(auth); }
});
$('#refreshBtn').onclick = () => load(true);
getRedirectResult(auth).catch(err => { $('#gateMsg').textContent = 'Sign-in failed: ' + (err.message || err.code); $('#gateMsg').className = 'gate-msg err'; });

async function load(isRefresh) {
  if (isRefresh) { $('#refreshBtn').textContent = 'Loading…'; $('#view').style.opacity = '.5'; }
  try {
    const [bs, ms, es] = await Promise.all([get(ref(db, 'sheetBookings')), get(ref(db, 'meta/sync')), get(ref(db, 'entries')).catch(() => null)]);
    META = ms.val(); prep(bs.val());
    APP = Object.values((es && es.val()) || {}).filter(x => x && x.date);
    dayISO = store.get('day', null); if (!isRefresh || !dayISO) dayISO = LAST;
    $('#gate').classList.add('hidden'); $('#app').classList.remove('hidden');
    banners(); render();
  } catch (err) {
    const denied = /permission/i.test(err.message || err.code || '');
    gate(`<button class="btn" id="gateSignOut">Sign out</button>`, denied ? 'The database refused access for this account. Ask Ranjith to check the database rules.' : 'Couldn\'t load data: ' + (err.message || err), true);
  } finally { $('#refreshBtn').textContent = 'Refresh'; $('#view').style.opacity = ''; }
}

onAuthStateChanged(auth, user => {
  if (!user) return gate(signInBtn);
  const email = (user.email || '').toLowerCase();
  if (!OWNERS.includes(email)) return gate(`<button class="btn" id="gateSignOut">Sign out</button>`, `${email} doesn't have access to the ops dashboard.`, true);
  $('#who').textContent = email;
  gate('<div class="spinner"></div>', 'Loading club data…');
  load(false);
});
</script>
